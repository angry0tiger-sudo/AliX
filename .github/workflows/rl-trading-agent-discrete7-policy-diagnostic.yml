name: AliX RL Discrete(7) Policy Diagnostic Validation Only

on:
  push:
    branches:
      - "research/rl-trading-agent"
    paths:
      - ".github/workflows/rl-trading-agent-discrete7-policy-diagnostic.yml"
      - "scripts/diagnose_rl_discrete7_policy.py"
      - "tests/unit/test_rl_discrete7_policy_diagnostic.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alix-rl-discrete7-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-diagnostic:
    name: Inspect saved Run #98 policy on Validation only
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout diagnostic code without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Wait for matching commit CI to pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          deadline = time.monotonic() + 600
          url = f"https://api.github.com/repos/{repository}/actions/runs?head_sha={sha}&per_page=100"
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              matches = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("name") == "AliX Continuous Integration"
                  and run.get("head_sha") == sha
              ]
              if matches:
                  latest = max(matches, key=lambda run: run.get("run_number", 0))
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") == "success":
                          print("Exact-commit CI passed; diagnostic may proceed.")
                          raise SystemExit(0)
                      raise SystemExit(
                          f"Fail closed: exact-commit CI conclusion was {latest.get('conclusion')}"
                      )
              time.sleep(15)
          raise SystemExit("Fail closed: timed out waiting for exact-commit CI")
          PY

      - name: Download immutable model and public data from Run #98
        uses: actions/download-artifact@v4
        with:
          name: rl-trading-agent-4571691ec6b11146ea6f3a93e0cc7c9e742ec578
          path: artifacts/source-run-98
          repository: ${{ github.repository }}
          run-id: 40348192766
          github-token: ${{ github.token }}

      - name: Pin resolver and install CPU-only RL research runtime
        run: |
          python -m pip install pip==25.2
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-rl-research.txt
          python -m pip check

      - name: Run diagnostic and RL contract unit tests
        run: >-
          python -m pytest
          tests/unit/test_rl_discrete7_policy_diagnostic.py
          tests/unit/test_rl_auxiliary_ppo.py
          tests/unit/test_rl_trading_environment.py
          tests/unit/test_rl_cost_curriculum.py
          tests/unit/test_rl_trading_agent_runner.py
          -q

      - name: Inspect Run #98 logits, observation and auxiliary-loss alignment on Validation only
        run: |
          python -m scripts.diagnose_rl_discrete7_policy             --data artifacts/source-run-98/public-minute-bars/binance_BTCUSDT_1m.csv             --manifest artifacts/source-run-98/public-minute-bars/manifest.json             --model artifacts/source-run-98/rl-agent/rl_trading_agent_recurrent_ppo.zip             --source-report artifacts/source-run-98/rl-agent/rl-trading-agent-report.json             --out-dir artifacts/rl-agent-discrete7-diagnostic             --commit-sha "${{ github.sha }}"             --expected-source-commit-sha 4571691ec6b11146ea6f3a93e0cc7c9e742ec578             --seed 20261026             --sample-count 6

      - name: Verify diagnostic scope and safety invariants
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("artifacts/rl-agent-discrete7-diagnostic")
          report = json.loads(
              (root / "rl-trading-agent-discrete7-diagnostic.json").read_text(encoding="utf-8")
          )
          csv_path = root / "logits-validation-probes.csv"
          with csv_path.open(encoding="utf-8", newline="") as stream:
              rows = list(csv.DictReader(stream))
          safety = report["safety_invariants"]
          diagnostic = report["diagnostic"]
          assert report["training_performed"] is False
          assert report["model_weights_modified"] is False
          assert report["final_holdout_scored"] is False
          assert report["final_holdout_metrics_computed"] is False
          assert report["validation"]["scaler_fit_on_training_only"] is True
          assert report["validation"]["source_validation_split_matched"] is True
          assert diagnostic["masking"]["probe_checks_passed"] is True
          assert len(rows) >= 8
          assert diagnostic["position_observation"]["input_matches_observation"] is True
          assert diagnostic["auxiliary_loss"]["validation_loss_weight"] == 0.0
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["orders_or_execution_api_used"] is False
          assert safety["real_order_attempts"] == 0
          assert safety["production_promotion_allowed"] is False
          print(json.dumps({
              "validation": report["validation"],
              "action_counts": diagnostic["action_counts"],
              "mean_post_mask_probabilities": diagnostic["mean_post_mask_probabilities"],
              "position_observation": diagnostic["position_observation"],
              "masking": {
                  "probe_checks_passed": diagnostic["masking"]["probe_checks_passed"],
                  "probes": [
                      {
                          "probe_kind": item["probe_kind"],
                          "current_position_fraction": item["current_position_fraction"],
                          "raw_logits": item["raw_logits"],
                          "masked_logits": item["masked_logits"],
                          "post_mask_probabilities": item["post_mask_probabilities"],
                          "mask_check": item["mask_check"],
                      }
                      for item in diagnostic["masking"]["probes"]
                  ],
              },
              "auxiliary_loss": diagnostic["auxiliary_loss"],
              "safety_invariants": safety,
          }, sort_keys=True, allow_nan=False))
          PY

      - name: Upload logits and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rl-trading-agent-discrete7-diagnostic-${{ github.sha }}
          path: |
            artifacts/rl-agent-discrete7-diagnostic/rl-trading-agent-discrete7-diagnostic.json
            artifacts/rl-agent-discrete7-diagnostic/logits-validation-probes.csv
          if-no-files-found: warn
          retention-days: 30
