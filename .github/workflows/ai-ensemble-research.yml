name: AliX Nobitex AI Ensemble Research

on:
  push:
    branches:
      - research/ml-core-ai-ensemble
  pull_request:
    branches:
      - release/nobitex-mvp
    paths:
      - "research/ai_ensemble/**"
      - "integrations/nobitex/ensemble_adapter.py"
      - "scripts/fetch_nobitex_5y_ohlcv.py"
      - "scripts/train_nobitex_ai_ensemble.py"
      - "tests/unit/test_ai_ensemble.py"
      - "docs/AI-ENSEMBLE-ARCHITECTURE.md"
      - ".github/workflows/ai-ensemble-research.yml"

permissions:
  contents: read

jobs:
  ensemble-research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ALIX_DRY_RUN: "true"
      ALIX_ALLOW_LIVE_TRADING: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned ensemble runtime and test tools
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy pandas==2.3.3 scikit-learn==1.9.0 joblib==1.5.3 lightgbm==4.7.0 xgboost-cpu==3.4.1 pytest==9.0.3 ruff==0.14.0
      - name: Compile ensemble source
        run: python -m compileall -q research/ai_ensemble integrations/nobitex/ensemble_adapter.py scripts/fetch_nobitex_5y_ohlcv.py scripts/train_nobitex_ai_ensemble.py tests/unit/test_ai_ensemble.py
      - name: Ruff lint
        run: ruff check research/ai_ensemble integrations/nobitex/ensemble_adapter.py scripts/fetch_nobitex_5y_ohlcv.py scripts/train_nobitex_ai_ensemble.py tests/unit/test_ai_ensemble.py
      - name: Ruff format check
        run: ruff format --check --diff research/ai_ensemble integrations/nobitex/ensemble_adapter.py scripts/fetch_nobitex_5y_ohlcv.py scripts/train_nobitex_ai_ensemble.py tests/unit/test_ai_ensemble.py
      - name: Research ensemble unit and training smoke tests
        run: pytest tests/unit/test_ai_ensemble.py -q
