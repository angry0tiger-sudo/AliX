name: AliX Nobitex Public Read-Only Validation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: alix-nobitex-public-readonly-${{ github.ref }}
  cancel-in-progress: false

jobs:
  public-readonly-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact workflow ref
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate read-only payload contract with synthetic fixtures
        run: |
          python -m pip install pytest==8.4.2
          python -m pytest -q tests/unit/test_nobitex_public_readonly_smoke.py
      - name: Fetch public market stats and orderbook (GET only)
        run: |
          python scripts/run_nobitex_public_readonly_smoke.py \
            --output artifacts/nobitex-public-readonly-smoke.json
      - name: Upload read-only evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-nobitex-public-readonly-${{ github.run_id }}
          path: artifacts/nobitex-public-readonly-smoke.json
          if-no-files-found: warn
          retention-days: 14
