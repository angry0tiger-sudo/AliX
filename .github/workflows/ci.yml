name: AliX Phase 0 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned quality tools
        run: python -m pip install ruff==0.14.0 mypy==1.18.2 pandas-stubs==2.3.2.250926 bandit==1.8.6 pip-audit==2.9.0 pytest==8.4.2 pytest-cov==7.0.0 import-linter==2.3 radon==6.0.1
      - name: Compile source
        run: python -m compileall -q connectivity services user_data/strategies tests scripts
      - name: Ruff lint
        run: ruff check connectivity services user_data/strategies tests scripts
      - name: Ruff format check
        run: ruff format --diff connectivity services user_data/strategies tests scripts
      - name: Strict type check
        run: mypy --config-file mypy.ini
      - name: Security scan
        run: bandit -r connectivity services user_data/strategies scripts -ll
      - name: Dependency audit
        run: pip-audit -r requirements.txt
      - name: Architecture contracts
        run: lint-imports
      - name: Complexity gate
        run: radon cc connectivity services user_data/strategies scripts -n C -s
      - name: Unit tests and coverage (mock-only)
        run: pytest --cov=connectivity --cov=services --cov=user_data/strategies --cov-report=term-missing --cov-fail-under=60 -q
      - name: Starter Kit integrity and documentation validation
        run: python scripts/validate_project_docs.py
