name: M6 Source Formatting

on:
  push:
    branches:
      - research/nobitex-hf-strategy
    paths:
      - scripts/run_m6_triple_barrier_3class.py
      - tests/unit/test_m6_triple_barrier_3class.py
      - .github/workflows/m6-source-format.yml

permissions:
  contents: write

jobs:
  format:
    if: github.ref == 'refs/heads/research/nobitex-hf-strategy'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout exact research commit
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff formatter
        run: python -m pip install ruff==0.14.0
      - name: Format M6 source and tests
        run: ruff format scripts/run_m6_triple_barrier_3class.py tests/unit/test_m6_triple_barrier_3class.py
      - name: Commit formatting changes on research branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_m6_triple_barrier_3class.py tests/unit/test_m6_triple_barrier_3class.py
          if git diff --cached --quiet; then
            echo "No Ruff formatting changes were required."
            exit 0
          fi
          git commit -m "style(m6): format three-class evaluator and tests"
          git push origin "HEAD:refs/heads/$GITHUB_REF_NAME"
