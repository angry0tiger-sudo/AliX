name: Four-Arm Signal-Density Diagnostic

on:
  push:
    branches:
      - research/nobitex-hf-strategy
    paths:
      - scripts/run_four_arm_signal_density_diagnostic.py
      - .github/workflows/four-arm-signal-density-diagnostic.yml

permissions:
  actions: read
  contents: read

concurrency:
  group: alix-four-arm-signal-density-diagnostic
  cancel-in-progress: false

jobs:
  signal-density-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALIX_FOUR_ARM_EXECUTION_AUTHORIZED: "false"
      ALIX_DRY_RUN: "true"
      ALIX_ALLOW_LIVE_TRADING: "false"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned diagnostic dependencies
        run: python -m pip install --disable-pip-version-check numpy==2.5.4 pandas==2.3.3

      - name: Verify immutable Run #10 artifact identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/43712086361/artifacts" > "$RUNNER_TEMP/run10-artifacts.json"
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          metadata = Path(os.environ["RUNNER_TEMP"]) / "run10-artifacts.json"
          payload = json.loads(metadata.read_text(encoding="utf-8"))
          matches = [
              item for item in payload.get("artifacts", [])
              if item.get("id") == 14163527266
              and item.get("name") == "four-arm-real-prehack-43712086361"
          ]
          if len(matches) != 1:
              raise SystemExit("RUN10_ARTIFACT_IDENTITY_MISSING")
          item = matches[0]
          valid = (
              item.get("size_in_bytes") == 55340
              and item.get("digest")
              == "sha256:b12c3a807316ab52829e6b0b1aa450057133d76afc0aeb54f0ac259f38300679"
              and item.get("expired") is False
          )
          if not valid:
              raise SystemExit("RUN10_ARTIFACT_IDENTITY_MISMATCH")
          print("RUN10_ARTIFACT_IDENTITY=PASS")
          PY

      - name: Download retained Run #10 forecast-cache artifact
        uses: actions/download-artifact@v4
        with:
          name: four-arm-real-prehack-43712086361
          path: ${{ runner.temp }}/run10-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: 43712086361

      - name: Run diagnostic-only signal-density audit
        run: |
          set -euo pipefail
          python -m scripts.run_four_arm_signal_density_diagnostic \
            --csv data/nobitex/prehack/nobitex-btcusdt-1h.csv \
            --manifest data/nobitex/prehack/nobitex-btcusdt-1h.manifest.json \
            --run10-artifact-dir "$RUNNER_TEMP/run10-artifact" \
            --output-dir .artifacts/four-arm-signal-density

      - name: Add aggregate-only report to Actions summary
        if: success()
        run: cat .artifacts/four-arm-signal-density/diagnostic-report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload aggregate-only diagnostic report
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: four-arm-signal-density-${{ github.sha }}
          path: .artifacts/four-arm-signal-density/
          if-no-files-found: error
          retention-days: 90
