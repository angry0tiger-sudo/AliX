name: AliX V4-Y Bollinger / EMA200 Primary Signal Economic Evaluation

on:
  push:
    branches:
      - research/ml-core-v4y-primary-signal
    paths:
      - .github/workflows/ml-core-v4y-primary-signal.yml
      - scripts/run_ml_core_v4y_primary_signal.py
      - scripts/run_ml_core_real_data_baseline.py
      - services/meta_labeling/v4y.py
      - services/meta_labeling/v4x.py
      - tests/unit/test_ml_core_v4y_primary_signal.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: alix-v4y-primary-signal
  cancel-in-progress: true

jobs:
  v4y-primary-signal-economic-evaluation:
    if: github.ref == 'refs/heads/research/ml-core-v4y-primary-signal'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require standard CI success for this exact V4-Y commit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GH_TOKEN"]
          expected_branch = "research/ml-core-v4y-primary-signal"
          if target_branch != expected_branch:
              raise SystemExit("unsupported_v4y_training_branch:" + target_branch)

          deadline = time.monotonic() + 90 * 60
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs"
              f"?head_sha={target_sha}&per_page=100"
          )
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except (HTTPError, URLError, TimeoutError) as error:
                  raise SystemExit(
                      f"ci_status_lookup_failed:{type(error).__name__}"
                  ) from None

              matching = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == target_sha
                  and run.get("head_branch") == expected_branch
                  and run.get("event") == "push"
              ]
              if matching:
                  latest = max(
                      matching,
                      key=lambda item: (
                          item.get("run_number", 0),
                          item.get("run_attempt", 0),
                      ),
                  )
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") != "success":
                          raise SystemExit(
                              "ci_green_gate_blocked:"
                              + str(latest.get("conclusion"))
                              + ":"
                              + target_sha
                          )
                      print(json.dumps({
                          "gate": "PASS",
                          "target_sha": target_sha,
                          "ci_run_id": latest.get("id"),
                          "ci_run_url": latest.get("html_url"),
                          "ci_conclusion": latest.get("conclusion"),
                      }, sort_keys=True))
                      break
              time.sleep(30)
          else:
              raise SystemExit("ci_green_gate_timeout:" + target_sha)
          PY

      - name: Checkout exact V4-Y commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm V4-Y branch, research-only scope, and fail-closed safety
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/ml-core-v4y-primary-signal"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          printf 'commit_sha=%s\n' "$GITHUB_SHA"
          printf 'primary_model=CAUSAL_BOLLINGER_UPPER_BREAKOUT_EMA200_TREND\n'
          printf 'meta_model=LightGBM_BINARY_OOF_PRIMARY_BUY_ONLY\n'
          printf 'meta_training=PURGED_MATURED_OUTER_TRAIN_OOF_EVENTS\n'
          printf 'meta_calibration=OUTER_TRAIN_OOF_PROBABILITIES_LABEL_BLIND\n'
          printf 'primary_train_sample_gate=MINIMUM_50_RAW_BUY_EVENTS\n'
          printf 'timeframes=15m,30m,1h\n'
          printf 'target=NET_POSITIVE_AFTER_FEES_AND_SLIPPAGE\n'
          printf 'validation=FORWARD_VALIDATION_ONLY\n'
          printf 'final_holdout=UNTOUCHED\n'
          printf 'market_data=PUBLIC_BINANCE_SPOT_ONLY\n'
          printf 'short_positions_supported=false\n'
          printf 'private_api_calls=0\nreal_order_attempts=0\n'
          printf 'Champion=null\norder_permission=false\ntrading_authorization=NO-GO\n'
          printf 'sequence_model_used=false\n'

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned V4-Y training and economic evaluation dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3 scikit-learn==1.9.0 lightgbm==4.7.0

      - name: Fetch complete public Binance Spot 730-day 1-minute datasets
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/alix-v4y-market-data"
          rm -rf "$data_dir"
          mkdir -p "$data_dir"
          for symbol in BTCUSDT ETHUSDT; do
            log_path="$RUNNER_TEMP/v4y-fetch-730-${symbol}.log"
            if python scripts/fetch_binance_public_ohlcv.py \
              --days 730 \
              --symbol "$symbol" \
              --interval 1m \
              --output-dir "$data_dir" \
              --commit-sha "$GITHUB_SHA" >"$log_path" 2>&1; then
              cat "$log_path"
            else
              cat "$log_path"
              echo "Public Spot data fetch failed for ${symbol}; refusing partial data." >&2
              exit 1
            fi
          done
          printf 'requested_days=730\nprovider=Binance Spot public klines API\n'
          printf 'private_api_calls=0\ncredentials_used=false\n'

      - name: Train V4-Y OOF LightGBM Meta-Model and run costed Spot economic replay
        run: |
          set -euo pipefail
          python -m scripts.run_ml_core_v4y_primary_signal \
            --input-dir "$RUNNER_TEMP/alix-v4y-market-data" \
            --output-report "$GITHUB_WORKSPACE/alix-v4y-primary-signal-report.json" \
            --output-trades-csv "$GITHUB_WORKSPACE/alix-v4y-primary-signal-trades.csv" \
            --output-decisions-csv "$GITHUB_WORKSPACE/alix-v4y-primary-signal-decisions.csv" \
            --days 730 \
            --commit-sha "$GITHUB_SHA"

      - name: Render V4-Y candidate metrics and thresholds to GitHub Step Summary
        env:
          REPORT_PATH: ${{ github.workspace }}/alix-v4y-primary-signal-report.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.run_ml_core_v4y_primary_signal import _render_summary

          report_path = Path(os.environ["REPORT_PATH"])
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("schema_version") != "alix.ml-core.v4y-primary-signal.v1":
              raise SystemExit("v4y_step_summary_report_schema_invalid")
          summary = _render_summary(report)
          if not summary or "AliX V4-Y Bollinger / EMA200 Primary" not in summary:
              raise SystemExit("v4y_step_summary_render_failed")
          summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as handle:
              handle.write(summary)
          required = (
              "Primary BUY 730d",
              "Train BUY",
              "Threshold",
              "Trades",
              "Win Rate",
              "Net PF",
              "Net PnL USD",
              "Max DD",
              "trading_authorization=NO-GO",
          )
          rendered = summary_path.read_text(encoding="utf-8")
          if any(value not in rendered for value in required):
              raise SystemExit("v4y_step_summary_required_metrics_missing")
          print(summary)
          PY

      - name: Validate V4-Y signal counts, sample gate, OOF boundaries, economics, and safety
        env:
          REPORT_PATH: ${{ github.workspace }}/alix-v4y-primary-signal-report.json
          TRADES_CSV: ${{ github.workspace }}/alix-v4y-primary-signal-trades.csv
          DECISIONS_CSV: ${{ github.workspace }}/alix-v4y-primary-signal-decisions.csv
          TARGET_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          assert report["schema_version"] == "alix.ml-core.v4y-primary-signal.v1"
          assert report["commit_sha"] == os.environ["TARGET_SHA"]
          assert report["requested_days"] == 730
          assert report["candidate_count"] == 6
          assert len(report["candidates"]) == 6
          assert report["timeframes"] == ["15m", "30m", "1h"]
          assert report["primary_model"]["definition"] == "CAUSAL_BOLLINGER_UPPER_BREAKOUT_EMA200_TREND"
          assert report["primary_model"]["fit_performed"] is False
          assert report["primary_model"]["uses_current_and_past_closed_candles_only"] is True
          assert report["primary_model"]["minimum_train_primary_buy_signals"] == 50
          assert report["meta_model"]["family"] == "LightGBM LGBMClassifier objective=binary"
          assert report["meta_model"]["training_signal_requirement"] == "OOF_PRIMARY_BUY_ONLY"
          assert report["meta_model"]["sample_gate"]["applied_before_meta_labeling_and_model_fit"] is True
          assert report["meta_model"]["calibration_labels_used"] is False
          assert report["meta_model"]["validation_labels_used_for_fit_or_threshold"] is False
          assert report["outer_split_contract"]["validation_used_for_training"] is False
          assert report["outer_split_contract"]["validation_used_for_threshold"] is False
          assert report["outer_split_contract"]["final_holdout_used"] is False
          assert report["label_contract"]["horizon_candles_by_timeframe"] == {
              "15m": 96, "30m": 48, "1h": 24
          }

          expected_candidates = {
              f"{pair}|{timeframe}|Combined"
              for pair in ("BTC/USDT", "ETH/USDT")
              for timeframe in ("15m", "30m", "1h")
          }
          observed_candidates = {item["candidate_id"] for item in report["candidates"]}
          assert observed_candidates == expected_candidates

          trained_count = 0
          for candidate in report["candidates"]:
              assert candidate["sequence_model_used"] is False
              assert candidate["primary_model"] == report["primary_model"]["definition"]
              assert candidate["horizon_hours"] == 24
              counts = candidate["primary_signal_counts"]
              gate = candidate["primary_sample_gate"]
              train_count = int(counts["train_primary_buy_event_count"])
              assert int(gate["minimum_primary_buy_count"]) == 50
              assert int(gate["observed_primary_buy_count"]) == train_count
              assert bool(gate["passed"]) is (train_count >= 50)
              assert int(counts["total_primary_buy_event_count"]) >= train_count
              if train_count < 50:
                  assert candidate["status"] == "SKIPPED_INSUFFICIENT_PRIMARY_SIGNALS"
                  assert gate["status"] == "SKIPPED_INSUFFICIENT_PRIMARY_SIGNALS"
                  assert candidate.get("meta_training") is None
                  assert candidate["selected_meta_probability_threshold"] is None
                  assert candidate["trades"] == []
                  assert candidate["decisions"] == []
                  continue

              assert gate["status"] == "PASS"
              assert candidate["status"] in {
                  "TRAINED", "SKIPPED_INSUFFICIENT_OOF_META_SUPPORT"
              }
              if candidate["status"] != "TRAINED":
                  assert candidate["skip_reason"]
                  assert candidate["selected_meta_probability_threshold"] is None
                  continue

              trained_count += 1
              threshold = float(candidate["selected_meta_probability_threshold"])
              assert math.isfinite(threshold) and 0.0 <= threshold <= 1.0
              training = candidate["training_diagnostics"]
              assert training["all_primary_signals_are_buy"] is True
              assert training["all_primary_signals_are_oof"] is True
              assert training["training_labels_are_matured_before_outer_validation"] is True
              assert training["maximum_training_label_end_index"] < training["outer_train_end_index"]
              assert training["fit_labels_end_before_calibration"] is True
              assert training["fit_max_label_end_index"] < training["calibration_start_event_index"]
              assert training["fit_labels_are_oof_primary_buy_only"] is True
              assert training["validation_labels_used_for_fit"] is False
              assert training["validation_labels_used_for_threshold"] is False
              meta = candidate["meta_training"]
              assert meta["calibration_labels_used"] is False
              assert meta["selected_using_validation_labels"] is False
              assert meta["selected_using_validation_probabilities"] is False
              metrics = candidate["metrics"]
              assert metrics["trade_count"] >= 0
              assert math.isfinite(float(metrics["win_rate"]))
              assert math.isfinite(float(metrics["net_pnl_usd"]))
              assert math.isfinite(float(metrics["max_drawdown_percent"]))
              if metrics["net_profit_factor"] is not None:
                  assert math.isfinite(float(metrics["net_profit_factor"]))
              assert candidate["validation_window"]["all_trades_close_before_holdout"] is True

          assert report["trained_candidate_count"] == trained_count
          assert report["economic_evaluation_performed"] is (trained_count > 0)
          safety = report["safety"]
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0
          assert safety["orders_or_execution_api_used"] is False
          assert safety["credentials_used"] is False
          assert safety["short_positions_supported"] is False
          assert safety["sequence_model_used"] is False
          assert report["promotion_status"] == "BLOCKED_PENDING_INDEPENDENT_OOS_AND_OWNER_REVIEW"

          with Path(os.environ["TRADES_CSV"]).open(newline="", encoding="utf-8") as handle:
              trades = list(csv.DictReader(handle))
          for trade in trades:
              assert trade["direction"] == "LONG"
              gross = float(trade["gross_market_pnl_usd"])
              fees = float(trade["fees_usd"])
              slippage = float(trade["slippage_cost_usd"])
              net = float(trade["net_pnl_usd"])
              assert math.isclose(gross - fees - slippage, net, rel_tol=0.0, abs_tol=0.02)

          with Path(os.environ["DECISIONS_CSV"]).open(newline="", encoding="utf-8") as handle:
              decisions = list(csv.DictReader(handle))
          for decision in decisions:
              assert decision["split_role"] == "FORWARD_VALIDATION"
              assert decision["primary_signal"] == "BUY"
              assert decision["executable_signal"] in {"BUY", "NO_ENTRY"}
              assert decision["meta_filter_decision"] in {"ACCEPT", "REJECT"}

          print(json.dumps({
              "validation": "PASS",
              "commit_sha": report["commit_sha"],
              "candidates": report["candidate_count"],
              "trained_candidates": trained_count,
              "trade_rows": len(trades),
              "decision_rows": len(decisions),
              "Champion": None,
              "order_permission": False,
              "trading_authorization": "NO-GO",
          }, sort_keys=True))
          PY

      - name: Upload V4-Y Primary Signal report and row-level economic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-v4y-primary-signal-economic-evaluation
          path: |
            alix-v4y-primary-signal-report.json
            alix-v4y-primary-signal-trades.csv
            alix-v4y-primary-signal-decisions.csv
          if-no-files-found: warn
