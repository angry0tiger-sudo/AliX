name: AliX V4-J Spot-Only Cost Isolation

on:
  push:
    branches:
      - research/ml-core-v4j-cost-isolation
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: alix-v4j-cost-isolation
  cancel-in-progress: false

jobs:
  cost-isolation:
    if: github.ref == 'refs/heads/research/ml-core-v4j-cost-isolation'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require Standard CI success for this exact V4-J commit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GH_TOKEN"]
          if target_branch != "research/ml-core-v4j-cost-isolation":
              raise SystemExit("unsupported_v4j_research_branch:" + target_branch)
          deadline = time.monotonic() + 90 * 60
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs"
              f"?head_sha={target_sha}&per_page=100"
          )
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except (HTTPError, URLError, TimeoutError) as error:
                  raise SystemExit(
                      f"ci_status_lookup_failed:{type(error).__name__}"
                  ) from None
              matching = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == target_sha
                  and run.get("head_branch") == target_branch
                  and run.get("event") == "push"
              ]
              if matching:
                  latest = max(
                      matching,
                      key=lambda item: (
                          item.get("run_number", 0),
                          item.get("run_attempt", 0),
                      ),
                  )
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") != "success":
                          raise SystemExit(
                              "ci_green_gate_blocked:"
                              + str(latest.get("conclusion"))
                              + ":"
                              + target_sha
                          )
                      print(json.dumps({
                          "gate": "PASS",
                          "target_sha": target_sha,
                          "ci_run_id": latest.get("id"),
                          "ci_run_url": latest.get("html_url"),
                          "ci_conclusion": latest.get("conclusion"),
                      }, sort_keys=True))
                      break
              time.sleep(30)
          else:
              raise SystemExit("ci_green_gate_timeout:" + target_sha)
          PY

      - name: Checkout exact V4-J commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download immutable V4-H Run 15 candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: alix-v4h-tuning-geometry-diagnostic
          path: ${{ runner.temp }}/v4h-source
          repository: ${{ github.repository }}
          run-id: 41293168191
          github-token: ${{ github.token }}

      - name: Download immutable V4-I Run 19 economic baseline
        uses: actions/download-artifact@v4
        with:
          name: alix-v4i-economic-evaluation
          path: ${{ runner.temp }}/v4i-baseline
          repository: ${{ github.repository }}
          run-id: 41311533034
          github-token: ${{ github.token }}

      - name: Validate V4-H source and V4-I baseline artifacts
        env:
          SOURCE_REPORT: ${{ runner.temp }}/v4h-source/alix-v4h-tuning-geometry-report.json
          BASELINE_REPORT: ${{ runner.temp }}/v4i-baseline/alix-v4i-economic-evaluation-report.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source_path = Path(os.environ["SOURCE_REPORT"])
          baseline_path = Path(os.environ["BASELINE_REPORT"])
          source = json.loads(source_path.read_text(encoding="utf-8"))
          baseline_bytes = baseline_path.read_bytes()
          baseline = json.loads(baseline_bytes.decode("utf-8"))
          assert source["schema_version"] == "alix.ml-core.v4h-tuning-geometry.v1"
          assert source["commit_sha"] == "e34861c4873b7cc2170aaaf6c79ed9b464df0a9a"
          assert source["acceptance_policy"]["status"] == "MET"
          assert source["acceptance_policy"]["strict_acceptance_count"] == 13
          assert source["trained_models"] == 96
          assert source["economic_evaluation_performed"] is False
          source_safety = source["safety"]
          assert source_safety["Champion"] is None
          assert source_safety["order_permission"] is False
          assert source_safety["trading_authorization"] == "NO-GO"
          assert source_safety["private_api_calls"] == 0
          assert source_safety["real_order_attempts"] == 0

          expected_baseline_sha = (
              "980930ba0e088860d896b642f84eba0c5333a1de837f030b9ef272cfad120fc2"
          )
          actual_baseline_sha = hashlib.sha256(baseline_bytes).hexdigest()
          assert actual_baseline_sha == expected_baseline_sha
          assert baseline["schema_version"] == "alix.ml-core.v4i-economic-evaluation.v1"
          assert baseline["commit_sha"] == "6d30de1459ef113e4ef12bc3b07bb44d1001f2b5"
          assert baseline["source_v4h_commit_sha"] == source["commit_sha"]
          assert baseline["source_v4h_run_id"] == 41293168191
          assert baseline["candidate_count"] == 13
          assert baseline["source_v4h_candidate_count"] == 13
          assert len(baseline["candidates"]) == 13
          assumptions = baseline["execution_assumptions"]
          assert assumptions["sell_semantics"] == "OPEN_SHORT"
          assert assumptions["fee_bps_per_side"] == 25.0
          assert assumptions["slippage_bps_per_side"] == 20.0
          baseline_safety = baseline["safety"]
          assert baseline_safety["Champion"] is None
          assert baseline_safety["order_permission"] is False
          assert baseline_safety["trading_authorization"] == "NO-GO"
          assert baseline_safety["private_api_calls"] == 0
          assert baseline_safety["real_order_attempts"] == 0

          source_ids = []
          for experiment in source["experiments"]:
              if experiment.get("scenario") != "V4H_Tighter_SL":
                  continue
              for policy, variant in (experiment.get("model_variants") or {}).items():
                  forward = (
                      (variant.get("threshold_optimization") or {})
                      .get("post_calibration_validation")
                  )
                  if not isinstance(forward, dict):
                      continue
                  hold = forward.get("hold_metrics") or {}
                  if (
                      hold.get("precision") is not None
                      and hold.get("recall") is not None
                      and hold["precision"] >= 0.40
                      and hold["recall"] >= 0.20
                  ):
                      source_ids.append("|".join((
                          experiment["scenario"],
                          experiment["pair"],
                          experiment["timeframe"],
                          experiment["feature_profile"],
                          policy,
                      )))
          baseline_ids = [item["candidate_id"] for item in baseline["candidates"]]
          assert len(source_ids) == 13 and source_ids == baseline_ids

          source_datasets = {item["symbol"]: item for item in source["input_datasets"]}
          baseline_datasets = {item["symbol"]: item for item in baseline["input_datasets"]}
          assert set(source_datasets) == {"BTCUSDT", "ETHUSDT"}
          assert set(baseline_datasets) == set(source_datasets)
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              for symbol in ("BTCUSDT", "ETHUSDT"):
                  source_item = source_datasets[symbol]
                  baseline_item = baseline_datasets[symbol]
                  assert baseline_item["byte_identical_to_v4h"] is True
                  assert baseline_item["csv_sha256"] == source_item["csv_sha256"]
                  env.write(f"{symbol}_START_UTC={source_item['start_utc']}\n")
                  env.write(f"{symbol}_END_UTC={source_item['end_utc']}\n")
          print(json.dumps({
              "source_v4h_sha": source["commit_sha"],
              "source_candidate_count": len(source_ids),
              "v4i_baseline_run_id": 41311533034,
              "v4i_baseline_report_sha256": actual_baseline_sha,
              "v4i_sell_semantics": assumptions["sell_semantics"],
              "model_training_allowed": False,
          }, sort_keys=True))
          PY

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned cost-isolation dependencies only
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3

      - name: Fetch byte-identical V4-H public market candles
        env:
          DATA_DIR: ${{ runner.temp }}/alix-v4j-market-data
        run: |
          set -euo pipefail
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          for symbol in BTCUSDT ETHUSDT; do
            start_var="${symbol}_START_UTC"
            end_var="${symbol}_END_UTC"
            start_utc="${!start_var}"
            end_utc="${!end_var}"
            python scripts/fetch_binance_public_ohlcv.py \
              --days 730 \
              --symbol "$symbol" \
              --interval 1m \
              --start-utc "$start_utc" \
              --end-utc "$end_utc" \
              --output-dir "$DATA_DIR" \
              --commit-sha "$GITHUB_SHA"
          done

      - name: Replay 13 candidates across three Spot-only cost profiles
        env:
          SOURCE_REPORT: ${{ runner.temp }}/v4h-source/alix-v4h-tuning-geometry-report.json
          BASELINE_REPORT: ${{ runner.temp }}/v4i-baseline/alix-v4i-economic-evaluation-report.json
          DATA_DIR: ${{ runner.temp }}/alix-v4j-market-data
          OUTPUT_REPORT: ${{ github.workspace }}/alix-v4j-cost-isolation-report.json
          OUTPUT_CSV: ${{ github.workspace }}/alix-v4j-cost-isolation-comparison.csv
        run: |
          set -euo pipefail
          python -m scripts.run_ml_core_v4j_cost_isolation \
            --source-report "$SOURCE_REPORT" \
            --baseline-report "$BASELINE_REPORT" \
            --input-dir "$DATA_DIR" \
            --output "$OUTPUT_REPORT" \
            --output-csv "$OUTPUT_CSV" \
            --commit-sha "$GITHUB_SHA"
          summary_path="${GITHUB_STEP_SUMMARY:?missing_GITHUB_STEP_SUMMARY}"
          test -s "$summary_path"
          grep -Fq "AliX V4-J Spot-Only Cost Isolation" "$summary_path"
          grep -Fq "zero_cost" "$summary_path"
          grep -Fq "fee_only" "$summary_path"
          grep -Fq "realistic" "$summary_path"
          grep -Fq "NO-GO" "$summary_path"

      - name: Validate V4-J report, Spot-only ledgers, CSV, and safety invariants
        env:
          OUTPUT_REPORT: ${{ github.workspace }}/alix-v4j-cost-isolation-report.json
          OUTPUT_CSV: ${{ github.workspace }}/alix-v4j-cost-isolation-comparison.csv
          TARGET_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["OUTPUT_REPORT"]).read_text(encoding="utf-8"))
          assert report["schema_version"] == "alix.ml-core.v4j-cost-isolation.v1"
          assert report["commit_sha"] == os.environ["TARGET_SHA"]
          assert report["source_v4h_commit_sha"] == "e34861c4873b7cc2170aaaf6c79ed9b464df0a9a"
          assert report["source_v4h_run_id"] == 41293168191
          assert report["candidate_count"] == 13
          assert report["source_v4h_candidate_count"] == 13
          assert report["economic_evaluation_performed"] is True
          assert report["model_training_performed"] is False
          assert report["model_inference_performed"] is False
          assert report["persisted_probability_replay_only"] is True
          profiles = report["cost_profiles"]
          assert set(profiles) == {"zero_cost", "fee_only", "realistic"}
          assert profiles["zero_cost"]["fee_bps_per_side"] == 0.0
          assert profiles["zero_cost"]["slippage_bps_per_side"] == 0.0
          assert profiles["fee_only"]["fee_bps_per_side"] == 25.0
          assert profiles["fee_only"]["slippage_bps_per_side"] == 0.0
          assert profiles["realistic"]["fee_bps_per_side"] == 25.0
          assert profiles["realistic"]["slippage_bps_per_side"] == 20.0
          semantics = report["spot_execution_assumptions"]
          assert semantics["sell_semantics"] == "CLOSE_LONG_OR_IGNORE_WHEN_FLAT"
          assert semantics["short_positions_supported"] is False
          for candidate in report["candidates"]:
              assert set(candidate["spot_only_profiles"]) == set(profiles)
              for result in candidate["spot_only_profiles"].values():
                  assert result["trade_direction_counts"]["SHORT"] == 0
                  assert all(trade["direction"] == "LONG" for trade in result["trades"])
          safety = report["safety"]
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0
          assert report["promotion_status"] == "BLOCKED_PENDING_INDEPENDENT_OOS_AND_OWNER_REVIEW"
          for dataset in report["input_datasets"]:
              assert dataset["byte_identical_to_v4h"] is True
              assert dataset["csv_sha256"] == dataset["source_v4h_csv_sha256"]

          with Path(os.environ["OUTPUT_CSV"]).open(encoding="utf-8", newline="") as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 52
          assert sum(row["mode"] == "v4i_short_enabled_realistic_baseline" for row in rows) == 13
          assert sum(row["spot_only"] == "True" for row in rows) == 39
          print(json.dumps({
              "candidate_count": report["candidate_count"],
              "cost_profiles": list(profiles),
              "zero_cost_pf_above_1_5": report["zero_cost_signal_edge_assessment"][
                  "profit_factor_above_1_5_count"
              ],
              "spot_only_drawdown_impact": report["spot_only_drawdown_impact_vs_v4i"],
              "Champion": None,
              "trading_authorization": "NO-GO",
              "model_training_performed": False,
          }, sort_keys=True))
          PY

      - name: Upload V4-J cost-isolation report and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-v4j-cost-isolation
          path: |
            alix-v4j-cost-isolation-report.json
            alix-v4j-cost-isolation-comparison.csv
          if-no-files-found: error
          retention-days: 14
