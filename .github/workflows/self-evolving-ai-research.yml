name: AliX Self-Evolving AI Phase 0-2 Research

on:
  push:
    branches:
      - "research/self-evolving-ai"
      - "feat/deap-sample-gates-timeframe-coverage"
    paths:
      - ".github/workflows/self-evolving-ai-research.yml"
      - "services/ai_core/self_evolving_simulator.py"
      - "services/ai_core/self_evolving_genome.py"
      - "scripts/fetch_public_minute_bars.py"
      - "configs/research/self-evolving-ai.json"
      - "tests/unit/test_self_evolving_simulator.py"
      - "tests/unit/test_self_evolving_genome.py"
      - "tests/unit/test_fetch_public_minute_bars.py"
      - "tests/unit/test_self_evolving_ga.py"
      - "scripts/run_deap_evolution.py"
      - "docs/knowledge_base/SELF_EVOLVING_AI_ARCHITECTURE.md"
      - "docs/governance/owner-directives/2026-10-25-self-evolving-ai.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alix-self-evolving-ai-research-${{ github.sha }}
  cancel-in-progress: false

jobs:
  simulator-and-minute-data:
    name: Causal simulator, genome contracts and public minute data
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research test dependencies
        run: python -m pip install numpy==2.5.4 pandas==2.3.3 scikit-learn==1.9.0 pytest==9.0.3 requests==2.34.2 deap==1.4.4

      - name: Run simulator, genome and public-data contract tests
        run: |
          python -m pytest \
            tests/unit/test_self_evolving_simulator.py \
            tests/unit/test_self_evolving_genome.py \
            tests/unit/test_fetch_public_minute_bars.py \
            tests/unit/test_self_evolving_ga.py -q

      - name: Download immutable two-year BTCUSDT public-data artifact
        uses: actions/download-artifact@v4
        with:
          name: self-evolving-public-minute-bars-f8070853994fd3014fbe2429bd0318749dc125e5
          path: .prior-market-data
          repository: ${{ github.repository }}
          run-id: 40163897863
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Stage immutable BTCUSDT data and manifest
        run: |
          python - <<'PY'
          import shutil
          from pathlib import Path

          source = Path(".prior-market-data/public-minute-bars")
          target = Path("artifacts/public-minute-bars")
          csv_path = source / "binance_BTCUSDT_1m.csv"
          manifest_path = source / "manifest.json"
          if not csv_path.is_file() or not manifest_path.is_file():
              raise SystemExit("immutable_two_year_market_data_artifact_incomplete")
          target.mkdir(parents=True, exist_ok=True)
          shutil.copy2(csv_path, target / csv_path.name)
          shutil.copy2(manifest_path, target / manifest_path.name)
          print("Staged immutable public data from successful research workflow run 40163897863.")
          PY

      - name: Verify provenance, coverage report and immutable safety invariants
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path("artifacts/public-minute-bars")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          safety = manifest["safety_invariants"]
          assert manifest["schema_version"] == "alix.self-evolving-data-manifest.v1"
          assert manifest["interval"] == "1m"
          assert manifest["row_count"] >= 1_000_000
          assert manifest["missing_minute_intervals_between_rows"] == 0
          assert manifest["coverage_fraction"] == 1.0
          assert len(manifest["csv_sha256"]) == 64
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert manifest["private_api_calls"] == 0
          assert manifest["orders_or_execution_api_used"] is False
          assert manifest["real_order_attempts"] == 0
          print(json.dumps({
              "symbol": manifest["symbol"],
              "interval": manifest["interval"],
              "start_utc": manifest["start_utc"],
              "end_utc": manifest["end_utc"],
              "row_count": manifest["row_count"],
              "missing_minute_intervals_between_rows": manifest["missing_minute_intervals_between_rows"],
              "coverage_fraction": manifest["coverage_fraction"],
              "csv_sha256": manifest["csv_sha256"],
              "Champion": safety["Champion"],
              "order_permission": safety["order_permission"],
              "trading_authorization": safety["trading_authorization"],
          }, sort_keys=True, allow_nan=False))
          PY


      - name: Run bounded DEAP evolution on research window
        run: |
          python -m scripts.run_deap_evolution \
            --data artifacts/public-minute-bars/binance_BTCUSDT_1m.csv \
            --manifest artifacts/public-minute-bars/manifest.json \
            --out-dir artifacts/self-evolving-ga \
            --population 128 \
            --generations 10 \
            --seed 20261025

      - name: Verify evolution report and immutable safety invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("artifacts/self-evolving-ga/self-evolving-ga-report.json")
              .read_text(encoding="utf-8")
          )
          safety = report["safety_invariants"]
          assert report["population_size"] == 128
          assert report["generations_completed"] >= 10
          assert report["unique_genomes_evaluated"] >= 128
          assert report["split"]["final_holdout_used"] is False
          assert report["research_result"] in {
              "NO_ECONOMICALLY_ACCEPTABLE_STRATEGY_FOUND",
              "CANDIDATE_REQUIRES_OWNER_REVIEW",
          }
          for timeframe in ("15m", "1h", "4h", "1d"):
              assert report["timeframe_coverage"][timeframe]["unique_genomes_evaluated"] > 0
              assert report["required_timeframe_coverage_by_generation"][timeframe]["minimum_population_per_generation"] >= 4
              assert report["required_timeframe_coverage_by_generation"][timeframe]["generations_with_population"] == report["generations_completed"]
          candidate = report["top_research_candidate"]
          if candidate is not None:
              assert candidate["training_metrics"]["trade_count"] > 0
              assert candidate["validation_return_used_for_selection"] is False
              assert candidate["validation_sample_count_used_for_eligibility"] is False
          else:
              assert report["economic_assessment"]["status"] == "NO-GO"
          assert report["fitness_definition"]["validation_used_for_selection"] is False
          assert report["eligibility_gates"]["minimum_completed_trade_count_enforced"] is False
          assert report["opportunity_hunter_result"]["opportunity_cost_penalty_active"] is True
          assert report["opportunity_hunter_result"]["dynamic_exit_genes_active"] is True
          assert report["same_dataset_baseline_comparison"]["comparison_is_same_dataset_and_split"] is True
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["orders_or_execution_api_used"] is False
          assert safety["real_order_attempts"] == 0
          print(json.dumps({
              "population_size": report["population_size"],
              "generations_completed": report["generations_completed"],
              "unique_genomes_evaluated": report["unique_genomes_evaluated"],
              "top_candidate_genes": report["top_research_candidate"]["genes"] if report["top_research_candidate"] else None,
              "training_metrics": report["top_research_candidate"]["training_metrics"] if report["top_research_candidate"] else None,
              "validation_metrics": report["top_research_candidate"]["validation_metrics"] if report["top_research_candidate"] else None,
              "opportunity_hunter_result": report["opportunity_hunter_result"],
              "same_dataset_baseline_comparison": report["same_dataset_baseline_comparison"],
              "fitness_definition": report["fitness_definition"],
              "research_result": report["research_result"],
              "timeframe_coverage": report["required_timeframe_coverage_by_generation"],
              "genomes_rejected_by_reason": report["genomes_rejected_by_reason"],
              "economic_assessment": report["economic_assessment"],
              "Champion": safety["Champion"],
              "order_permission": safety["order_permission"],
              "trading_authorization": safety["trading_authorization"],
          }, sort_keys=True, allow_nan=False))
          PY

      - name: Upload public data and verified manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: self-evolving-public-minute-bars-${{ github.sha }}
          path: |
            artifacts/public-minute-bars/*.csv
            artifacts/public-minute-bars/manifest.json
            artifacts/self-evolving-ga/*
          if-no-files-found: warn
          retention-days: 30
