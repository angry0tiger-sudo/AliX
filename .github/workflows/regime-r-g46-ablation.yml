name: Regime R G4.6 HGBQ-CQR volume-feature ablation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prehack-volume-ablation:
    if: github.ref == 'refs/heads/research/nobitex-hf-strategy'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    env:
      PYTHONPATH: ${{ github.workspace }}
      ALIX_DRY_RUN: "true"
      ALIX_ALLOW_LIVE_TRADING: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Checkout exact authorized Research commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned HGBQ-CQR runtime
        run: |
          python -m pip install --upgrade pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3 scikit-learn==1.9.0 mapie==1.6.0
          python -m pip check

      - name: Verify pre-hack data, frozen G3, and locked G4.6 preregistration
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          expected_data = "0aa13607d1da68c4720919f233635bb33d34048e5bd67d3ecc2ce9bb7c2b462e"
          expected_g3 = "92cdcf19a02f5cf9659f327704ed4d6c5cf0d85687aff2ba35b9542fec5cfdaa"
          expected_g46 = "83d9dffc0e3332eaddd5ee35bf846b13b049039eda6df087b9ccb734ce9f9de1"

          csv_path = Path("data/nobitex/prehack/nobitex-btcusdt-1h.csv")
          manifest_path = Path("data/nobitex/prehack/nobitex-btcusdt-1h.manifest.json")
          g3_path = Path("config/regime_r/hgbq_cqr_preregistration.json")
          g46_path = Path("config/regime_r/hgbq_cqr_preregistration_ablation.json")

          assert hashlib.sha256(csv_path.read_bytes()).hexdigest() == expected_data
          assert hashlib.sha256(g3_path.read_bytes()).hexdigest() == expected_g3
          assert hashlib.sha256(g46_path.read_bytes()).hexdigest() == expected_g46

          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          prereg = json.loads(g46_path.read_text(encoding="utf-8"))
          assert manifest["csv_sha256"] == expected_data
          assert manifest["dataset_window"] == "PRE_HACK_NOBITEX_ONLY"
          assert manifest["row_count"] == 31801
          assert manifest["missing_intervals"] == 0
          assert prereg["preregistration"]["status"] == "PREREGISTERED_LOCKED"
          assert prereg["dataset"]["confirmatory_holdout"] is False
          assert prereg["feature_ablation"]["removed_predictors"] == [
              "log_volume_change_1",
              "volume_zscore_24",
          ]
          assert len(prereg["feature_ablation"]["retained_predictors"]) == 11
          assert prereg["execution"]["holdout_access"] is False
          assert prereg["execution"]["exchange_api_access"] is False
          print("PREHACK_DATA_G3_AND_G4_6_REGISTRATION_SHA256_VERIFIED")
          PY

      - name: Run the single registered G4.6 volume ablation
        env:
          ALIX_REGIME_R_EXECUTION_AUTHORIZED: "true"
          ALIX_REGIME_R_G46_EXECUTION_AUTHORIZED: "true"
        run: |
          set -euo pipefail
          python scripts/run_regime_r_g46_volume_ablation.py \
            --commit-sha "$GITHUB_SHA" \
            --output-dir ".artifacts/regime-r-g4-g6"

      - name: Validate diagnostics, economic gates, and safety invariants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          output_dir = Path(".artifacts/regime-r-g4-g6")
          report_path = output_dir / "regime-r-g4-g6-volume-ablation.json"
          trades_path = output_dir / "regime-r-g4-g6-hypothetical-trades.csv"
          report = json.loads(report_path.read_text(encoding="utf-8"))

          assert report["schema_version"] == "alix.regime-r.g4.6-volume-ablation.v1"
          assert report["status"] == "COMPLETED"
          assert report["mode"] == "HGBQ_CQR_G4_6_VOLUME_FEATURE_ABLATION_OFFLINE_ECONOMIC_EVALUATION"
          assert report["code_commit_sha"] == "${{ github.sha }}"
          assert report["dataset"]["csv_sha256"] == "0aa13607d1da68c4720919f233635bb33d34048e5bd67d3ecc2ce9bb7c2b462e"
          assert report["dataset"]["confirmatory_holdout"] is False
          assert report["g3_configuration_sha256"] == "92cdcf19a02f5cf9659f327704ed4d6c5cf0d85687aff2ba35b9542fec5cfdaa"
          assert report["trial_accounting"] == {
              "registered_slots": 30,
              "unique_candidate_configurations": 3,
              "duplicate_slots": 27,
              "fit_calls": 90,
              "diagnostic_records": 90,
          }
          assert report["feature_ablation"]["removed_predictors"] == [
              "log_volume_change_1",
              "volume_zscore_24",
          ]
          assert report["feature_ablation"]["retained_feature_count"] == 11
          assert report["feature_ablation"]["raw_volume_column_is_predictor"] is False
          assert len(report["diagnostic_records"]) == 90
          assert len(report["acceptance"]["candidates"]) == 3
          assert report["verdict"] in {
              "PASS",
              "COMPLETE_ABSTENTION_REPEATED",
              "NO_GO_PARTIAL_SIGNALING",
          }

          for trial in report["trials"]:
              assert trial["fit_calls"] == 3
              assert trial["diagnostic_records"] == 3
              for cost in ("50", "90"):
                  scenario = trial["cost_scenarios"][cost]
                  assert set(scenario["acceptance"]["gates"]) == {
                      "net_pf_gte_1_10",
                      "trades_gte_100",
                      "max_dd_lte_15_percent",
                      "lower_bound_cost_passed_in_all_three_folds",
                  }
                  assert len(scenario["folds"]) == 3

          safety = report["safety"]
          assert safety["real_data_scope"] == "PRE_HACK_ONLY"
          assert safety["holdout_bytes_read"] is False
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0
          assert safety["paper_orders"] == 0
          assert safety["hypothetical_trades_simulated"] is True
          assert safety["exchange_network_access"] is False
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert trades_path.exists()
          print(json.dumps({
              "verdict": report["verdict"],
              "unique_candidates_passing": report["acceptance"]["unique_candidates_passing_both_costs"],
              "diagnostic_records": report["trial_accounting"]["diagnostic_records"],
              "hypothetical_trade_rows": report["trade_row_count"],
              "holdout_bytes_read": safety["holdout_bytes_read"],
              "real_order_attempts": safety["real_order_attempts"],
              "trading_authorization": safety["trading_authorization"],
          }, sort_keys=True))
          PY

      - name: Upload G4.6 diagnostics and offline hypothetical ledger
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: regime-r-g4-g6-volume-ablation-prehack-${{ github.sha }}
          path: |
            .artifacts/regime-r-g4-g6/regime-r-g4-g6-volume-ablation.json
            .artifacts/regime-r-g4-g6/regime-r-g4-g6-hypothetical-trades.csv
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
