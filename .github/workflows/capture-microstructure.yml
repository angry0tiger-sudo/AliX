name: Regime M Public Microstructure Capture

on:
  # Start away from the top of the hour to reduce scheduler contention.
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Bounded live capture window (minutes; maximum 55)"
        required: true
        type: choice
        default: "55"
        options:
          - "1"
          - "5"
          - "15"
          - "30"
          - "55"

permissions:
  contents: read

jobs:
  standard-ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  capture:
    needs: standard-ci
    runs-on: ubuntu-latest
    timeout-minutes: 65
    permissions:
      contents: read
    env:
      ALIX_SCHEDULE_INTERVAL_MINUTES: ${{ github.event_name == 'schedule' && '60' || '0' }}
      CAPTURE_DURATION_MINUTES: ${{ github.event_name == 'schedule' && '55' || inputs.duration_minutes || '55' }}
      ALIX_DRY_RUN: "true"
      ALIX_ALLOW_LIVE_TRADING: "false"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout selected research ref without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned capture and mock-test dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install websocket-client==1.9.2 httpx==0.28.1 pytest==9.0.3

      - name: Run mock-only data-contract and gap-detection tests
        run: pytest tests/unit/test_capture_nobitex_microstructure.py -q

      - name: Resolve a unique UTC segment identifier
        id: segment
        run: echo "timestamp=$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_OUTPUT"

      - name: Capture public BTCIRT L2 snapshots and market-wide trades
        run: |
          python -m scripts.capture_nobitex_microstructure \
            --duration-minutes "$CAPTURE_DURATION_MINUTES" \
            --output-dir .artifacts/regime-m-capture

      - name: Validate manifest hashes, record counts, and fail-closed invariants
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".artifacts/regime-m-capture")
          manifest_path = root / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          scheduled = os.environ["GITHUB_EVENT_NAME"] == "schedule"
          duration = int(os.environ["CAPTURE_DURATION_MINUTES"])
          interval = int(os.environ["ALIX_SCHEDULE_INTERVAL_MINUTES"])
          if scheduled:
              assert duration == 55
              assert interval == 60
              manifest["coverage_segment"] = {
                  "kind": "SCHEDULED_SOAK_SEGMENT",
                  "trigger": "schedule",
                  "capture_start_utc": manifest["started_at_utc"],
                  "capture_end_utc": manifest["finished_at_utc"],
                  "capture_duration_minutes_requested": duration,
                  "schedule_interval_minutes": interval,
                  "inter_segment_coverage_status": "MISSING_COVERAGE",
                  "nominal_inter_segment_missing_minutes": interval - duration,
                  "exact_inter_segment_gap_boundaries": (
                      "DERIVE_FROM_PREVIOUS_FINISHED_AT_AND_NEXT_STARTED_AT_DURING_FINAL_MERGE"
                  ),
                  "capture_segments_must_not_be_joined_as_continuous": True,
              }
          else:
              manifest["coverage_segment"] = {
                  "kind": "MANUAL_CAPTURE_SEGMENT",
                  "trigger": os.environ["GITHUB_EVENT_NAME"],
                  "capture_start_utc": manifest["started_at_utc"],
                  "capture_end_utc": manifest["finished_at_utc"],
                  "capture_duration_minutes_requested": duration,
                  "schedule_interval_minutes": None,
                  "inter_segment_coverage_status": "NOT_APPLICABLE",
                  "nominal_inter_segment_missing_minutes": None,
                  "exact_inter_segment_gap_boundaries": "NOT_APPLICABLE",
                  "capture_segments_must_not_be_joined_as_continuous": True,
              }
          manifest_path.write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          manifest_digest = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          (root / "manifest.sha256").write_text(
              f"{manifest_digest}  manifest.json\n", encoding="utf-8"
          )
          counts = manifest["record_counts"]
          assert manifest["code_commit_sha"] == "${{ github.sha }}"
          assert manifest["workflow_run_id"] == "${{ github.run_id }}"
          assert manifest["authorization_header_sent"] is False
          assert manifest["websocket_connection_token_sent"] is False
          assert manifest["private_api_calls"] == 0
          assert manifest["holdout_bytes_read"] is False
          assert manifest["posthack_data_read"] is False
          assert manifest["real_order_attempts"] == 0
          assert manifest["paper_orders"] == 0
          assert manifest["Champion"] is None
          assert manifest["order_permission"] is False
          assert manifest["trading_authorization"] == "NO-GO"
          coverage = manifest["coverage_segment"]
          if scheduled:
              assert coverage["inter_segment_coverage_status"] == "MISSING_COVERAGE"
              assert coverage["schedule_interval_minutes"] == 60
              assert coverage["capture_duration_minutes_requested"] == 55
              assert coverage["nominal_inter_segment_missing_minutes"] == 5
              assert coverage["capture_segments_must_not_be_joined_as_continuous"] is True
          else:
              assert coverage["inter_segment_coverage_status"] == "NOT_APPLICABLE"
          assert counts["orderbook"] > 0
          assert counts["trades"] > 0
          assert manifest["websocket_orderbook_records"] > 0
          assert manifest["websocket_trade_records"] > 0

          for name, metadata in manifest["files"].items():
              data = (root / name).read_bytes()
              assert hashlib.sha256(data).hexdigest() == metadata["sha256"], name
              assert len(data) == metadata["bytes"], name

          expected_manifest_hash = hashlib.sha256(manifest_path.read_bytes()).hexdigest()
          assert (root / "manifest.sha256").read_text(encoding="utf-8").startswith(
              expected_manifest_hash
          )
          summary = [
              "## Regime M capture summary",
              f"- Order-book rows: {counts['orderbook']}",
              f"- Trade rows: {counts['trades']}",
              f"- Gaps: {manifest['gap_count']}",
              f"- WebSocket book publications: {manifest['websocket_orderbook_records']}",
              f"- WebSocket trade publications: {manifest['websocket_trade_records']}",
              f"- Capture status: {manifest['capture_status']}",
              f"- Coverage status: {coverage['inter_segment_coverage_status']}",
              f"- Nominal inter-segment missing minutes: {coverage['nominal_inter_segment_missing_minutes']}",
          ]
          import os
          total_bytes = sum(item["bytes"] for item in manifest["files"].values())
          summary.extend([f"- Total CSV bytes: {total_bytes}", f"- Run: {manifest['workflow_run_id']}"])
          Path(os.environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(summary) + "\n", encoding="utf-8")
          PY

      - name: Upload raw capture and integrity manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-m-microstructure-${{ steps.segment.outputs.timestamp }}-${{ github.run_id }}
          path: .artifacts/regime-m-capture/*
          if-no-files-found: warn
          retention-days: 30
