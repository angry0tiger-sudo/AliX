name: Regime M Public Microstructure Capture

# Manual, bounded long-form segments only. No scheduled capture.

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Long-form public microstructure segment (fixed at 350 minutes)"
        required: true
        type: choice
        default: "350"
        options:
          - "350"
      run_number:
        description: "1-based chained soak segment number (1 through 5)"
        required: true
        type: number
        default: 1

permissions:
  contents: read

jobs:
  standard-ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  capture:
    needs: standard-ci
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    env:
      ALIX_CAPTURE_SEGMENT_INTERVAL_MINUTES: "360"
      CAPTURE_DURATION_MINUTES: ${{ inputs.duration_minutes || '350' }}
      RUN_NUMBER: ${{ inputs.run_number }}
      ALIX_DRY_RUN: "true"
      ALIX_ALLOW_LIVE_TRADING: "false"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout selected research ref without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned capture and mock-test dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install websocket-client==1.9.2 httpx==0.28.1 pytest==9.0.3

      - name: Validate bounded chained-soak input
        run: |
          python - <<'PY'
          import os

          run_number = int(os.environ["RUN_NUMBER"])
          assert 1 <= run_number <= 5, f"run_number must be in [1, 5], got {run_number}"
          assert os.environ["CAPTURE_DURATION_MINUTES"] == "350"
          PY

      - name: Run mock-only capture and auto-audit tests
        run: |
          pytest tests/unit/test_capture_nobitex_microstructure.py \
            tests/unit/test_audit_microstructure_capture.py -q

      - name: Resolve a unique UTC segment identifier
        id: segment
        run: echo "timestamp=$(date -u +'%Y%m%dT%H%M%SZ')" >> "$GITHUB_OUTPUT"

      - name: Capture public BTCIRT L2 snapshots and market-wide trades
        run: |
          python -m scripts.capture_nobitex_microstructure \
            --duration-minutes "$CAPTURE_DURATION_MINUTES" \
            --output-dir .artifacts/regime-m-capture

      - name: Validate long-form segment and fail-closed invariants
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path

          root = Path(".artifacts/regime-m-capture")
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          duration = int(os.environ["CAPTURE_DURATION_MINUTES"])
          interval = int(os.environ["ALIX_CAPTURE_SEGMENT_INTERVAL_MINUTES"])

          assert os.environ["GITHUB_EVENT_NAME"] == "workflow_dispatch"
          assert duration == 350
          assert interval == 360
          assert manifest["code_commit_sha"] == "${{ github.sha }}"
          assert manifest["workflow_run_id"] == "${{ github.run_id }}"
          assert manifest["requested_duration_minutes"] == 350

          coverage = manifest["coverage_segment"]
          assert coverage["kind"] == "MANUAL_SOAK_SEGMENT"
          assert coverage["inter_segment_coverage_status"] == "MISSING_COVERAGE"
          assert coverage["segment_interval_minutes"] == 360
          assert coverage["nominal_inter_segment_missing_minutes"] == 10
          assert coverage["capture_segments_must_not_be_joined_as_continuous"] is True

          start = datetime.fromisoformat(manifest["started_at_utc"].replace("Z", "+00:00"))
          end = datetime.fromisoformat(manifest["finished_at_utc"].replace("Z", "+00:00"))
          captured_seconds = (end - start).total_seconds()
          assert captured_seconds >= 350 * 60, captured_seconds
          assert captured_seconds < 360 * 60, captured_seconds

          assert manifest["authorization_header_sent"] is False
          assert manifest["websocket_connection_token_sent"] is False
          assert manifest["private_api_calls"] == 0
          assert manifest["holdout_bytes_read"] is False
          assert manifest["posthack_data_read"] is False
          assert manifest["real_order_attempts"] == 0
          assert manifest["paper_orders"] == 0
          assert manifest["Champion"] is None
          assert manifest["order_permission"] is False
          assert manifest["trading_authorization"] == "NO-GO"
          PY

      - name: Auto-audit CSV counts, SHA-256, gaps, and reconnects
        run: |
          python -m scripts.audit_microstructure_capture \
            --artifact-dir .artifacts/regime-m-capture

      - name: Upload raw capture and integrity manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regime-m-microstructure-${{ steps.segment.outputs.timestamp }}-${{ github.run_id }}
          path: .artifacts/regime-m-capture/*
          if-no-files-found: error
          retention-days: 30

  chain-next-segment:
    needs: capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
    steps:
      - name: Stop after the fifth successful segment
        if: ${{ inputs.run_number == 5 }}
        run: echo "Chained soak completed. No further dispatch will be issued."

      - name: Preserve the ten-minute inter-segment coverage gap
        if: ${{ inputs.run_number < 5 }}
        run: sleep 600

      - name: Dispatch the next segment only after capture and artifact upload succeeded
        if: ${{ inputs.run_number < 5 }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const runNumber = Number("${{ inputs.run_number }}");
            const durationMinutes = String("${{ inputs.duration_minutes }}");

            if (!Number.isInteger(runNumber) || runNumber < 1 || runNumber >= 5) {
              core.setFailed(`Refusing invalid next-segment dispatch from run_number=${runNumber}`);
              return;
            }

            const ref = context.ref.startsWith("refs/heads/") ? context.ref.slice(11) : "";
            if (!ref || ref === context.ref) {
              core.setFailed(`Expected a branch ref, received ${context.ref}`);
              return;
            }

            const nextRunNumber = runNumber + 1;
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "capture-microstructure.yml",
              ref,
              inputs: {
                duration_minutes: durationMinutes,
                run_number: String(nextRunNumber),
              },
            });

            core.notice(`Successfully dispatched chained soak segment ${nextRunNumber}/5 on ${ref}`);
