name: AliX Meta-Label Economic Experiments

on:
  workflow_dispatch:
  push:
    branches:
      - "research/meta-label-economic-experiments"
    paths:
      - ".github/workflows/meta-label-economic-experiments.yml"
      - "scripts/run_meta_label_economic_experiments.py"
      - "scripts/fetch_nobitex_public_ohlcv.py"
      - "services/data_quality/**"
      - "services/freqai_baseline/**"
      - "services/meta_labeling/**"

permissions:
  contents: read

concurrency:
  group: alix-meta-label-economic-experiments
  cancel-in-progress: false

jobs:
  public-economic-walkforward:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout the exact research candidate
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned public research dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3 scipy==1.18.1 scikit-learn==1.9.0

      - name: Fetch 365 days of public OHLCV
        run: |
          python scripts/fetch_nobitex_public_ohlcv.py \
            --days 365 \
            --output-dir "$RUNNER_TEMP/alix-meta-economic-data" \
            --commit-sha "$GITHUB_SHA"

      - name: Retrain candidate classifiers and evaluate purged walk-forward
        run: |
          python scripts/run_meta_label_economic_experiments.py \
            --input "$RUNNER_TEMP/alix-meta-economic-data/nobitex-btcusdt-1h.csv" \
            --manifest "$RUNNER_TEMP/alix-meta-economic-data/nobitex-btcusdt-1h.manifest.json" \
            --output "$RUNNER_TEMP/alix-meta-economic-report.json" \
            --commit-sha "$GITHUB_SHA"

      - name: Assert provenance and fail-closed invariants
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path(os.environ["RUNNER_TEMP"]) / "alix-meta-economic-report.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          assert report["experiment_status"] == "COMPLETED"
          assert report["commit_sha"] == os.environ["GITHUB_SHA"]
          assert report["source"]["row_count"] == 8760
          assert report["protocol"]["threshold_was_optimized"] is False
          assert report["champion"] is None
          assert report["economic_acceptance"] == "NO-GO"
          assert report["promotion_status"] == "BLOCKED_NO_STRATEGY_LEVEL_EVIDENCE"
          assert report["production_model_updated"] is False
          assert report["strategy_registry_updated"] is False
          assert report["order_permission"] is False
          assert report["trading_authorization"] == "NO-GO"
          baseline = report["baseline_fixed_configuration"]
          top_candidates = [
              {
                  "candidate_id": item["candidate_id"],
                  "trade_count": item["trade_count"],
                  "win_rate": item["win_rate"],
                  "net_expectancy": item["net_expectancy"],
                  "max_abs_drawdown": item["max_abs_drawdown"],
                  "brier_skill_vs_baseline": item["brier_skill_vs_baseline"],
              }
              for item in report["candidate_diagnostics"][:10]
          ]
          print(json.dumps({
              "commit_sha": report["commit_sha"],
              "dataset_sha256": report["source"]["csv_sha256"],
              "candidate_count": report["protocol"]["candidate_grid"]["candidate_count"],
              "baseline": {
                  "trade_count": baseline["trade_count"],
                  "win_rate": baseline["win_rate"],
                  "net_expectancy": baseline["net_expectancy"],
                  "brier_score_weighted": baseline["brier_score_weighted"],
                  "brier_skill_vs_baseline": baseline["brier_skill_vs_baseline"],
              },
              "top_candidate_diagnostics": top_candidates,
              "adaptive_oos_trades": report["adaptive_walkforward_policy"]["trade_count"],
              "adaptive_win_rate": report["adaptive_walkforward_policy"]["win_rate"],
              "adaptive_net_expectancy": report["adaptive_walkforward_policy"]["net_expectancy"],
              "economic_gate": report["economic_evaluation"]["status"],
              "Champion": report["champion"],
              "order_permission": report["order_permission"],
              "trading_authorization": report["trading_authorization"]
          }, sort_keys=True, allow_nan=False))
          PY

      - name: Upload immutable research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-meta-label-economic-experiments-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/alix-meta-economic-data/
            ${{ runner.temp }}/alix-meta-economic-report.json
          if-no-files-found: warn
          retention-days: 30
