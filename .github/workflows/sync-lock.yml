name: Sync dependency lock and validate exact lock SHA

on:
  push:
    branches:
      - research/nobitex-hf-strategy
    paths:
      - requirements.txt

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-lock-${{ github.ref }}
  cancel-in-progress: false

jobs:
  sync-lock:
    runs-on: ubuntu-latest
    outputs:
      lock_sha: ${{ steps.capture.outputs.lock_sha }}
    steps:
      - name: Checkout target research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          persist-credentials: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the repository-pinned pip resolver and pip-tools
        run: |
          python -m pip install pip==25.2
          python -m pip install pip-tools==7.5.0

      - name: Regenerate requirements.lock from requirements.txt
        run: |
          pip-compile --no-header --no-annotate --no-emit-index-url --no-emit-trusted-host --constraint requirements.lock --output-file=requirements.lock requirements.txt
          sed -i '1i# Generated by pip-tools from requirements.txt; Python 3.12 CI resolver.' requirements.lock

      - name: Require a generated lockfile diff
        run: |
          if git diff --quiet -- requirements.lock; then
            echo "::error::pip-compile produced no requirements.lock change; refusing to create a misleading lock commit."
            exit 1
          fi

      - name: Commit and push only requirements.lock
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(deps): auto-sync requirements.lock"
          file_pattern: requirements.lock
          branch: ${{ github.ref_name }}

      - name: Capture and verify the lock commit SHA
        id: capture
        shell: bash
        run: |
          set -euo pipefail
          lock_sha="$(git rev-parse HEAD)"
          commit_message="$(git log -1 --pretty=%s)"
          if [ "$commit_message" != "chore(deps): auto-sync requirements.lock" ]; then
            echo "::error::Expected the lock auto-commit; found: $commit_message"
            exit 1
          fi
          echo "lock_sha=$lock_sha" >> "$GITHUB_OUTPUT"
          echo "LOCK_AUTO_COMMIT_SHA=$lock_sha" >> "$GITHUB_STEP_SUMMARY"

  standard-ci:
    needs: sync-lock
    runs-on: ubuntu-latest
    steps:
      - name: Checkout and verify the exact generated lock commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: false

      - name: Dispatch Standard CI on the exact auto-committed branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ needs.sync-lock.outputs.lock_sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          checkout_sha="$(git rev-parse HEAD)"
          if [ "$checkout_sha" != "$EXPECTED_SHA" ]; then
            echo "::error::Expected lock SHA $EXPECTED_SHA, checked out $checkout_sha."
            exit 1
          fi

          # workflow_dispatch is a supported GitHub exception for GITHUB_TOKEN-triggered workflow runs.
          gh workflow run ci.yml --ref "$TARGET_BRANCH"

          run_id=""
          for attempt in $(seq 1 60); do
            response="$(gh api --method GET -f branch="$TARGET_BRANCH" -F per_page=50 "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs")"
            run_id="$(printf '%s' "$response" | jq -r --arg sha "$EXPECTED_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch")][0].id // empty')"
            if [ -n "$run_id" ]; then
              break
            fi
            sleep 5
          done

          if [ -z "$run_id" ]; then
            echo "::error::Standard CI workflow_dispatch run was not created for $EXPECTED_SHA."
            exit 1
          fi

          gh run watch "$run_id" --exit-status
          run_result="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/$run_id")"
          actual_sha="$(printf '%s' "$run_result" | jq -r '.head_sha')"
          conclusion="$(printf '%s' "$run_result" | jq -r '.conclusion')"
          if [ "$actual_sha" != "$EXPECTED_SHA" ] || [ "$conclusion" != "success" ]; then
            echo "::error::Standard CI did not pass on the expected lock SHA. SHA=$actual_sha conclusion=$conclusion"
            exit 1
          fi
          {
            echo "## Standard CI"
            echo "- Run ID: $run_id"
            echo "- SHA: $actual_sha"
            echo "- Conclusion: $conclusion"
          } >> "$GITHUB_STEP_SUMMARY"

  quality-preflight:
    needs: sync-lock
    uses: ./.github/workflows/quality-preflight.yml
    with:
      target_sha: ${{ needs.sync-lock.outputs.lock_sha }}
    permissions:
      contents: read
