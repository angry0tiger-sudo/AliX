name: M7 Cross-Sectional Ridge Economic Evaluation

on:
  push:
    branches: [research/nobitex-hf-strategy]
    paths: [docs/research/M7_EVALUATION_TRIGGER.txt]

permissions:
  actions: read
  contents: read

concurrency:
  group: alix-m7-cross-sectional-economic-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: github.ref == 'refs/heads/research/nobitex-hf-strategy'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ALIX_DRY_RUN: "true"
      ALIX_ALLOW_LIVE_TRADING: "false"
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Require Standard CI success on the exact implementation and data parent
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.before }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import Request, urlopen
          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          source_sha = os.environ["SOURCE_SHA"]
          if branch != "research/nobitex-hf-strategy":
              raise SystemExit("m7_unsupported_branch")
          url = f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs?branch={branch}&per_page=100"
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          deadline = time.monotonic() + 20 * 60
          while time.monotonic() < deadline:
              with urlopen(Request(url, headers=headers), timeout=30) as response:
                  payload = json.load(response)
              matches = [
                  item for item in payload.get("workflow_runs", [])
                  if item.get("head_sha") == source_sha
                  and item.get("head_branch") == branch
                  and item.get("name") == "AliX Continuous Integration"
                  and item.get("event") == "push"
              ]
              if matches:
                  latest = max(matches, key=lambda item: item.get("run_number", 0))
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") != "success":
                          raise SystemExit("m7_standard_ci_not_green")
                      print(json.dumps({"gate": "PASS", "source_sha": source_sha, "ci_run_id": latest.get("id")}))
                      break
              time.sleep(10)
          else:
              raise SystemExit("m7_standard_ci_timeout")
          PY
      - name: Checkout exact preregistration and dataset
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned M7 model runtime
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.5 pandas==2.3.3 scikit-learn==1.9.0
      - name: Verify two fixed trials and safety
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          cfg = json.loads(Path("config/m7/cross_sectional_preregistration.json").read_text())
          assert cfg["preregistration"]["status"] == "PREREGISTERED_LOCKED"
          assert cfg["preregistration"]["logical_trial_count"] == 2
          assert cfg["model"]["alpha"] == 1.0
          assert cfg["safety"]["holdout_access"] == "PROHIBITED"
          assert cfg["safety"]["posthack_data_access"] == "PROHIBITED"
          assert cfg["safety"]["Champion"] is None and cfg["safety"]["order_permission"] is False
          assert cfg["safety"]["trading_authorization"] == "NO-GO"
          PY
      - name: Run locked M7 PRE-HACK evaluation
        run: |
          python -m scripts.run_m7_cross_sectional \
            --evaluate \
            --data-dir data/nobitex/prehack/m7 \
            --btc-csv data/nobitex/prehack/nobitex-btcusdt-1h.csv \
            --config config/m7/cross_sectional_preregistration.json \
            --report-out .artifacts/m7/m7_evaluation_report.json
      - name: Validate two-trial report and publish summary
        env:
          REPORT_PATH: .artifacts/m7/m7_evaluation_report.json
          SUMMARY_PATH: m7_summary.md
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text())
          assert report["phase"] == "M7" and len(report["trials"]) == 2
          safety = report["safety"]
          assert safety["holdout_bytes_read"] is False and safety["posthack_data_read"] is False
          assert safety["private_api_calls"] == 0 and safety["real_order_attempts"] == 0 and safety["paper_orders"] == 0
          assert safety["Champion"] is None and safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          lines = [
              "# M7 Cross-Sectional Ridge Evaluation", "",
              "| Trial | Status | Cost-50 PF | Cost-90 PF | Trades | MaxDD |",
              "|---|---|---:|---:|---:|---:|",
          ]
          for trial_id, item in report["trials"].items():
              c50 = item.get("cost_scenarios", {}).get("Cost-50", {})
              c90 = item.get("cost_scenarios", {}).get("Cost-90", {})
              lines.append(
                  f"| {trial_id} | {item['status']} | {c50.get('net_profit_factor')} | "
                  f"{c90.get('net_profit_factor')} | {c50.get('completed_oos_trades')} | {c50.get('max_drawdown')} |"
              )
          lines.extend(["", f"Overall verdict: **{report['economic_acceptance']['overall_verdict']}**",
                        "", "PRE-HACK exploratory only; Holdout/Post-Hack not accessed."])
          Path(os.environ["SUMMARY_PATH"]).write_text("\n".join(lines) + "\n", encoding="utf-8")
          print("\n".join(lines))
          PY
          cat m7_summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload M7 report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-m7-cross-sectional-results
          path: .artifacts/m7/
          if-no-files-found: warn
          retention-days: 90
