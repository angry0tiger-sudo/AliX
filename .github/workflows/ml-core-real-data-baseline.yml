name: AliX ML Core Real-Data Diagnostic Baseline

on:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: alix-ml-core-real-data-baseline
  cancel-in-progress: false

jobs:
  diagnostic-classification:
    if: github.ref == 'refs/heads/research/ml-core-rebuild'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout the selected research commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm branch and safety scope
        run: |
          test "$GITHUB_REF" = "refs/heads/research/ml-core-rebuild"
          test -n "$GITHUB_SHA"
          printf 'commit_sha=%s\n' "$GITHUB_SHA"
          printf 'scope=DIAGNOSTIC_CLASSIFICATION_ONLY\n'
          printf 'real_order_attempts=0\nprivate_api_calls=0\n'

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned diagnostic tree-model dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3 scikit-learn==1.9.0 lightgbm==4.7.0

      # Binance Spot public klines are fetched in validated 1,000-candle pages.
      # Missing or partial pages fail closed; no shorter window or synthetic fill.
      - name: Fetch complete Binance public candles with pagination
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/alix-real-market-data"
          rm -rf "$data_dir"
          mkdir -p "$data_dir"
          for symbol in BTCUSDT ETHUSDT; do
            log_path="$RUNNER_TEMP/binance-fetch-730-${symbol}.log"
            if python scripts/fetch_binance_public_ohlcv.py \
              --days 730 \
              --symbol "$symbol" \
              --interval 1m \
              --output-dir "$data_dir" \
              --commit-sha "$GITHUB_SHA" >"$log_path" 2>&1; then
              cat "$log_path"
            else
              cat "$log_path"
              echo "Binance fetcher failed for ${symbol}; refusing to train on incomplete real-market data." >&2
              exit 1
            fi
          done
          echo "ALIX_DIAGNOSTIC_DAYS=730" >> "$GITHUB_ENV"
          echo "ALIX_DIAGNOSTIC_CONFIGURED_DAYS=730" >> "$GITHUB_ENV"
          echo "ALIX_DIAGNOSTIC_FALLBACK_REASON=NONE" >> "$GITHUB_ENV"
          printf 'selected_complete_days=730\n'
          printf 'provider=Binance Spot public klines API\n'
          printf 'fetch_page_size_candles=1000\n'
          printf 'inter_page_delay_seconds=0.25\n'
          printf 'fallback_reason=NONE\n'

      - name: Train diagnostic LightGBM classification baselines
        run: |
          python -m scripts.run_ml_core_real_data_baseline \
            --input-dir "$RUNNER_TEMP/alix-real-market-data" \
            --output "$GITHUB_WORKSPACE/alix-real-data-classification-report.json" \
            --days "$ALIX_DIAGNOSTIC_DAYS" \
            --commit-sha "$GITHUB_SHA" \
            --hold-weight-multiplier 3.0 \
            --calibration-fraction 0.20 \
            --minimum-hold-precision 0.40 \
            --minimum-hold-recall 0.20

      - name: Validate classification-only report and safety invariants
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report_path = Path("alix-real-data-classification-report.json")
          report = json.loads(report_path.read_text(encoding="utf-8"))
          assert report["commit_sha"] == os.environ["GITHUB_SHA"]
          assert report["diagnostic_scope"] == "CLASSIFICATION_ONLY"
          assert report["schema_version"] == "alix.ml-core.real-data-classification-diagnostic.v4"
          assert report["economic_evaluation_performed"] is False
          assert report["economic_metrics_reported"] is False
          assert report["requested_days"] == int(os.environ["ALIX_DIAGNOSTIC_DAYS"])
          window = report["data_window_selection"]
          assert window["configured_days"] == 730
          assert window["selected_days"] == report["requested_days"]
          assert window["fallback_reason"] == os.environ["ALIX_DIAGNOSTIC_FALLBACK_REASON"]
          assert report["requested_days"] == 730
          assert report["experiment_count"] == 8
          assert {item["pair"] for item in report["experiments"]} == {"BTC/USDT", "ETH/USDT"}
          assert {item["timeframe"] for item in report["experiments"]} == {"15m", "30m", "1h", "4h"}
          assert len(report["input_datasets"]) == 2
          for dataset in report["input_datasets"]:
              assert dataset["requested_days"] == 730
              assert dataset["row_count"] == 730 * 24 * 60
              assert dataset["missing_minute_intervals"] == 0
              assert dataset["fetch_page_size_candles"] == 1000
              assert dataset["inter_page_delay_seconds"] == 0.25
          assert report["data_window_selection"]["fetch_page_size_candles"] == 1000
          assert report["data_window_selection"]["inter_page_delay_seconds"] == 0.25
          assert report["sample_gate_policy"]["minimum_train_samples_per_class"] == 20
          assert report["sample_gate_policy"]["minimum_validation_samples_per_class"] == 30
          assert report["sample_gate_policy"]["required_classes"] == ["BUY", "SELL", "HOLD"]
          assert report["label_audit_policy"]["exit_reason_values"] == [
              "TP_HIT", "SL_HIT", "COLLISION", "HORIZON_EXPIRY"
          ]
          assert report["label_audit_policy"]["unlabeled_reason_values"] == [
              "insufficient_atr_history", "incomplete_horizon"
          ]
          assert report["baseline_comparisons"]["always_sell"]["predicted_label"] == "SELL"
          assert report["baseline_comparisons"]["lightgbm_unweighted"]["class_weight"] is None
          weighting = report["weighting_policy"]
          assert weighting["hold_weight_multiplier"] == 3.0
          assert set(weighting["policies"]) == {
              "weight_none", "weight_balanced", "weight_intermediate"
          }
          assert weighting["policies"]["weight_none"]["class_weight"] is None
          assert weighting["policies"]["weight_balanced"]["class_weight"] == "balanced"
          assert weighting["policies"]["weight_intermediate"]["class_weight"] == {
              "BUY": 1.0, "SELL": 1.0, "HOLD": 3.0
          }
          calibration_policy = report["calibration_policy"]
          assert calibration_policy["fraction_of_validation"] == 0.20
          assert calibration_policy["temporal_position"] == (
              "FIRST_CHRONOLOGICAL_SEGMENT_OF_VALIDATION"
          )
          assert calibration_policy["minimum_hold_precision"] == 0.40
          assert calibration_policy["minimum_hold_recall"] == 0.20
          allowed_statuses = {
              "TRAINED",
              "SKIPPED_INSUFFICIENT_SAMPLES",
              "SKIPPED_INSUFFICIENT_CLASS_DIVERSITY",
          }
          assert all(item["status"] in allowed_statuses for item in report["experiments"])
          for item in report["experiments"]:
              assert isinstance(item["train_rows"], int) and item["train_rows"] >= 0
              assert isinstance(item["validation_rows"], int) and item["validation_rows"] >= 0
              audit = item["label_audit"]
              assert audit["scope"] == "ALL_TARGET_BARS_BEFORE_SPLIT"
              assert audit["exit_reason_distribution"]["total"] == audit["labeled_events"]
              assert sum(
                  value["count"]
                  for value in audit["exit_reason_distribution"]["reasons"].values()
              ) == audit["labeled_events"]
              assert set(audit["exit_reason_distribution"]["reasons"]) == {
                  "TP_HIT", "SL_HIT", "COLLISION", "HORIZON_EXPIRY"
              }
              assert audit["unlabeled_reason_distribution"]["total"] == audit["unlabeled_events"]
              gate = item["sample_gate"]
              assert gate["minimum_train_samples_per_class"] == 20
              assert gate["minimum_validation_samples_per_class"] == 30
              assert set(gate["train_class_counts"] or {}) in (set(), {"BUY", "SELL", "HOLD"})
              if item["status"] == "TRAINED":
                  assert gate["status"] == "PASS"
                  assert item["classification_metrics"] is not None
                  confusion = item["confusion_matrix"]
                  assert confusion["labels"] == ["BUY", "SELL", "HOLD"]
                  assert confusion["rows_are"] == "actual"
                  assert confusion["columns_are"] == "predicted"
                  assert len(confusion["matrix"]) == 3
                  assert all(len(row) == 3 for row in confusion["matrix"])
                  assert sum(sum(row) for row in confusion["matrix"]) == item["validation_rows"]
                  predictions = item["prediction_distribution"]
                  assert predictions["total"] == item["validation_rows"]
                  assert set(predictions["classes"]) == {"BUY", "SELL", "HOLD"}
                  assert sum(value["count"] for value in predictions["classes"].values()) == item["validation_rows"]
                  comparisons = item["baseline_comparisons"]
                  assert set(comparisons) == {"always_sell", "lightgbm_unweighted"}
                  always_sell = comparisons["always_sell"]
                  assert always_sell["classification_metrics"] is not None
                  assert always_sell["prediction_distribution"]["total"] == item["validation_rows"]
                  assert always_sell["prediction_distribution"]["classes"]["SELL"]["count"] == item["validation_rows"]
                  assert always_sell["prediction_distribution"]["classes"]["BUY"]["count"] == 0
                  assert always_sell["prediction_distribution"]["classes"]["HOLD"]["count"] == 0
                  unweighted = comparisons["lightgbm_unweighted"]
                  assert unweighted["model_parameters"]["class_weight"] is None
                  assert unweighted["classification_metrics"] is not None
                  assert unweighted["prediction_distribution"]["total"] == item["validation_rows"]
                  variants = item["model_variants"]
                  assert set(variants) == {
                      "weight_none", "weight_balanced", "weight_intermediate"
                  }
                  for variant in variants.values():
                      assert variant["classification_metrics"]["validation"] is not None
                      assert variant["prediction_distribution"]["total"] == item["validation_rows"]
                      probabilities = variant["validation_probabilities"]
                      assert len(probabilities) == item["validation_rows"]
                      assert all(
                          set(row["probabilities"]) == {"BUY", "SELL", "HOLD"}
                          and row["actual_label"] in {"BUY", "SELL", "HOLD"}
                          and abs(sum(row["probabilities"].values()) - 1.0) < 1e-5
                          and all(0.0 <= value <= 1.0 for value in row["probabilities"].values())
                          for row in probabilities
                      )
                      threshold = variant["threshold_optimization"]
                      assert threshold["status"] in {
                          "SELECTED",
                          "NO_FEASIBLE_THRESHOLD",
                          "SKIPPED_INSUFFICIENT_CALIBRATION_SAMPLES",
                      }
                      assert threshold["constraints"]["minimum_hold_precision"] == 0.40
                      assert threshold["constraints"]["minimum_hold_recall"] == 0.20
                      assert threshold["calibration"]["temporal_position"] == (
                          "FIRST_CHRONOLOGICAL_SEGMENT_OF_VALIDATION"
                      )
                      forward = threshold["post_calibration_validation"]
                      assert (
                          threshold["calibration"]["row_count"]
                          + (
                              forward["row_count"]
                              if forward is not None
                              else item["validation_rows"] - threshold["calibration"]["row_count"]
                          )
                          == item["validation_rows"]
                      )
                      if threshold["status"] == "SELECTED":
                          assert 0.0 <= threshold["selected_threshold"] <= 1.0
                          selected = threshold["calibration"]["selected_calibration_metrics"]["hold_metrics"]
                          assert selected["precision"] >= 0.40
                          assert selected["recall"] >= 0.20
                          assert forward["calibration_overlap"] is False
                          assert threshold["full_validation_including_calibration"]["calibration_overlap"] is True
                      else:
                          assert threshold["selected_threshold"] is None
                          assert forward is None
                          assert threshold["full_validation_including_calibration"] is None
              else:
                  assert item["model_variants"] is None
                  assert item["threshold_optimization"] is None
                  assert item["classification_metrics"] is None
                  assert item["confusion_matrix"] is None
                  assert item["prediction_distribution"] is None
                  assert item["baseline_comparisons"] is None
                  assert gate["status"] in {"NOT_EVALUATED", item["status"]}
          four_hour = [item for item in report["experiments"] if item["timeframe"] == "4h"]
          assert len(four_hour) == 2
          assert all(item["status"] == "SKIPPED_INSUFFICIENT_SAMPLES" for item in four_hour)
          assert all(
              "HOLD" in item["sample_gate"]["insufficient_validation_classes"]
              and item["sample_gate"]["validation_class_counts"]["HOLD"] < 30
              for item in four_hour
          )
          assert report["trained_models"] == sum(
              item["status"] == "TRAINED" for item in report["experiments"]
          )
          safety = report["safety"]
          assert safety["public_api_only"] is True
          assert safety["credentials_used"] is False
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0
          assert safety["orders_or_execution_api_used"] is False
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          print(json.dumps({
              "commit_sha": report["commit_sha"],
              "requested_days": report["requested_days"],
              "experiments": report["experiment_count"],
              "trained_models": report["trained_models"],
              "economic_evaluation_performed": False,
              "private_api_calls": 0,
              "real_order_attempts": 0,
              "Champion": None,
              "order_permission": False,
              "trading_authorization": "NO-GO",
          }, sort_keys=True))
          PY

      - name: Upload classification-only diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-real-data-classification-diagnostic
          path: alix-real-data-classification-report.json
          if-no-files-found: warn
          retention-days: 14
