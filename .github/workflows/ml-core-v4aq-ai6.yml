name: AliX V4-AQ AI-6 Funding-only 36-Cell Economic Sweep

on:
  push:
    branches:
      - research/ml-core-v4aq-ai6
    paths:
      - .github/workflows/ml-core-v4aq-ai6.yml
      - external_data/binance_futures.py
      - scripts/fetch_binance_external_data.py
      - scripts/fetch_binance_public_ohlcv.py
      - scripts/run_ml_core_v4aq_ai6.py
      - scripts/run_ml_core_v4ap_diagnostic_sweep.py
      - services/ml_core/external_market_features.py
      - services/meta_labeling/v4aq.py
      - services/meta_labeling/v4x.py
      - tests/unit/test_external_data_binance_futures.py
      - tests/unit/test_fetch_binance_external_data.py
      - tests/unit/test_ml_core_external_market_features.py
      - tests/unit/test_ml_core_v4aq.py
      - tests/unit/test_ml_core_v4aq_ai6.py
      - docs/governance/owner-directives/2026-11-08-ai6-binance-public-market-data.md
      - docs/architecture/decisions/ADR-0007-binance-funding-open-interest-ai6.md
      - docs/data-provider-registry.md
      - external_data/README.md
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: alix-v4aq-ai6
  cancel-in-progress: true

jobs:
  v4aq-ai6-funding-only:
    if: github.ref == 'refs/heads/research/ml-core-v4aq-ai6'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require Standard CI success for this exact AI-6 commit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_branch = os.environ["TARGET_BRANCH"]
          expected_branch = "research/ml-core-v4aq-ai6"
          if target_branch != expected_branch:
              raise SystemExit("unsupported_ai6_branch:" + target_branch)

          deadline = time.monotonic() + 90 * 60
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs"
              f"?head_sha={target_sha}&per_page=100"
          )
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except (HTTPError, URLError, TimeoutError) as error:
                  raise SystemExit(
                      f"ci_status_lookup_failed:{type(error).__name__}"
                  ) from None
              matching = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == target_sha
                  and run.get("head_branch") == expected_branch
                  and run.get("event") == "push"
              ]
              if matching:
                  latest = max(
                      matching,
                      key=lambda item: (
                          item.get("run_number", 0),
                          item.get("run_attempt", 0),
                      ),
                  )
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") != "success":
                          raise SystemExit(
                              "ci_green_gate_blocked:"
                              + str(latest.get("conclusion"))
                              + ":"
                              + target_sha
                          )
                      print(json.dumps({
                          "gate": "PASS",
                          "target_sha": target_sha,
                          "ci_run_id": latest.get("id"),
                          "ci_run_url": latest.get("html_url"),
                          "ci_conclusion": latest.get("conclusion"),
                      }, sort_keys=True))
                      break
              time.sleep(30)
          else:
              raise SystemExit("ci_green_gate_timeout:" + target_sha)
          PY

      - name: Checkout exact AI-6 commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned research dependencies only
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3 scikit-learn==1.9.0 lightgbm==4.7.0

      - name: Verify Funding-only, immutable data, economic and safety contracts
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/ml-core-v4aq-ai6"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          python - <<'PY'
          from external_data.binance_futures import (
              ALLOWED_SYMBOLS,
              FUNDING_PAGE_LIMIT,
              FUNDING_RATE_PATH,
          )
          from scripts import run_ml_core_v4aq_ai6 as ai6
          from scripts import run_ml_core_v4ap_diagnostic_sweep as v4ap
          from services.meta_labeling.v4aq import V4AQ_META_FEATURE_COLUMNS
          from services.ml_core.external_market_features import EXTERNAL_FEATURE_COLUMNS

          assert ALLOWED_SYMBOLS == ("BTCUSDT", "ETHUSDT")
          assert FUNDING_RATE_PATH == "/fapi/v1/fundingRate"
          assert FUNDING_PAGE_LIMIT == 1000
          assert ai6.REQUESTED_DAYS == 1825
          assert ai6.ROUND_TRIP_COST_BPS == 30.0
          assert ai6.ROC_AUC_REFERENCE == 0.51
          assert ai6.MINIMUM_TRADE_COUNT == 50
          assert ai6.MINIMUM_WIN_RATE == 0.40
          assert ai6.MINIMUM_NET_PROFIT_FACTOR == 1.10
          assert ai6.MINIMUM_DSR_Z == 0.0
          assert tuple(EXTERNAL_FEATURE_COLUMNS) == (
              "funding_rate_zscore",
              "funding_rate_ma",
          )
          assert tuple(V4AQ_META_FEATURE_COLUMNS) == (
              "primary_context_1",
              "primary_context_2",
              "funding_rate_zscore",
              "funding_rate_ma",
          )
          assert len(v4ap._grid_candidate_ids()) == 36
          assert v4ap.ROUND_TRIP_COST_BPS == 30.0
          print("AI-6 Funding-only model and economic contracts: PASS")
          PY
          printf 'Champion=null\norder_permission=false\ntrading_authorization=NO-GO\n'
          printf 'private_api_calls=0\nreal_order_attempts=0\ncredentials_used=false\n'

      - name: Fetch 1825-day BTCUSDT Spot 1m baseline and declare exact common window
        run: |
          set -euo pipefail
          spot_dir="$RUNNER_TEMP/alix-v4aq-spot"
          mkdir -p "$spot_dir"
          python -m scripts.fetch_binance_public_ohlcv \
            --days 1825 \
            --symbol BTCUSDT \
            --interval 1m \
            --output-dir "$spot_dir" \
            --commit-sha "$GITHUB_SHA" \
            --allow-exchange-gaps
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "alix-v4aq-spot"
          path = root / "binance-btcusdt-1m.manifest.json"
          manifest = json.loads(path.read_text(encoding="utf-8"))
          start = manifest["start_utc"]
          end = manifest["end_utc"]
          if manifest["requested_days"] != 1825:
              raise SystemExit("ai6_btc_spot_window_invalid")
          if manifest["symbol"] != "BTCUSDT" or manifest["credentials_used"] is not False:
              raise SystemExit("ai6_btc_spot_provenance_invalid")
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as handle:
              handle.write(f"SPOT_DIR={root}\n")
              handle.write(f"DATA_START_UTC={start}\n")
              handle.write(f"DATA_END_UTC={end}\n")
          print(f"COMMON_DATA_WINDOW={start}..{end}")
          PY

      - name: Fetch ETHUSDT Spot 1m baseline over the identical BTC window
        run: |
          set -euo pipefail
          python -m scripts.fetch_binance_public_ohlcv \
            --days 1825 \
            --symbol ETHUSDT \
            --interval 1m \
            --output-dir "$SPOT_DIR" \
            --commit-sha "$GITHUB_SHA" \
            --start-utc "$DATA_START_UTC" \
            --end-utc "$DATA_END_UTC" \
            --allow-exchange-gaps

      - name: Fetch public Funding Rate history only for BTCUSDT and ETHUSDT
        run: |
          set -euo pipefail
          external_dir="$RUNNER_TEMP/alix-v4aq-funding"
          mkdir -p "$external_dir"
          python -m scripts.fetch_binance_external_data \
            --symbols BTCUSDT ETHUSDT \
            --days 1825 \
            --start-utc "$DATA_START_UTC" \
            --end-utc "$DATA_END_UTC" \
            --commit-sha "$GITHUB_SHA" \
            --output-dir "$external_dir"
          echo "EXTERNAL_DIR=$external_dir" >> "$GITHUB_ENV"

      - name: Run Funding-only 36-cell LightGBM and economic sweep
        run: |
          set -euo pipefail
          python -m scripts.run_ml_core_v4aq_ai6 \
            --input-dir "$SPOT_DIR" \
            --external-dir "$EXTERNAL_DIR" \
            --output-report "$GITHUB_WORKSPACE/alix-v4aq-ai6-report.json" \
            --output-trades-csv "$GITHUB_WORKSPACE/alix-v4aq-ai6-trades.csv" \
            --output-decisions-csv "$GITHUB_WORKSPACE/alix-v4aq-ai6-decisions.csv" \
            --output-summary "$GITHUB_WORKSPACE/alix-v4aq-ai6-step-summary.md" \
            --commit-sha "$GITHUB_SHA" \
            --start-utc "$DATA_START_UTC" \
            --end-utc "$DATA_END_UTC"

      - name: Validate exact 36-cell Funding-only report and publish Step Summary
        env:
          REPORT_PATH: ${{ github.workspace }}/alix-v4aq-ai6-report.json
          SUMMARY_PATH: ${{ github.workspace }}/alix-v4aq-ai6-step-summary.md
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts import run_ml_core_v4aq_ai6 as ai6
          from scripts import run_ml_core_v4ap_diagnostic_sweep as v4ap

          report = json.loads(
              Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8")
          )
          assert report["commit_sha"] == os.environ["TARGET_SHA"]
          assert report["schema_version"] == ai6.REPORT_SCHEMA_VERSION
          assert report["dataset"]["requested_days"] == 1825
          assert report["execution_assumptions"]["round_trip_cost_bps"] == 30.0
          assert report["funding"]["endpoint"] == "/fapi/v1/fundingRate"
          assert report["funding"]["feature_columns"] == [
              "funding_rate_zscore", "funding_rate_ma"
          ]
          assert report["funding"]["open_interest_used"] is False
          assert report["model_usage"]["open_interest_used"] is False
          assert len(report["candidates"]) == 36
          assert {
              row["candidate_id"] for row in report["candidates"]
          } == v4ap._grid_candidate_ids()
          assert report["Champion"] is None
          assert report["order_permission"] is False
          assert report["trading_authorization"] == "NO-GO"
          assert report["private_api_calls"] == 0
          assert report["real_order_attempts"] == 0
          assert report["credentials_used"] is False
          if report["status"] == "BLOCKED_INSUFFICIENT_FUNDING_HISTORY":
              assert report["model"]["fit_performed"] is False
              assert report["model"]["fit_group_count"] == 0
              assert report["economic_results"] is None
          elif report["status"] == "COMPLETED_RESEARCH_EVALUATION":
              assert report["economic_results"]["candidate_count"] == 36
              assert report["model"]["expected_fit_group_count"] == 12
              for row in report["candidates"]:
                  for field in (
                      "roc_auc",
                      "net_profit_factor",
                      "win_rate",
                      "dsr_z_score",
                      "trade_count",
                  ):
                      assert field in row
          else:
              raise SystemExit("ai6_report_status_invalid")

          summary_path = Path(os.environ["SUMMARY_PATH"])
          summary = summary_path.read_text(encoding="utf-8")
          if summary.count("| BTCUSDT |") + summary.count("| ETHUSDT |") < 36:
              raise SystemExit("ai6_step_summary_missing_candidate_rows")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as handle:
              handle.write(summary)
          print(summary, end="")
          PY

      - name: Upload AI-6 public data, manifests, report and ledgers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-v4aq-ai6-funding-only-36-cell
          path: |
            ${{ runner.temp }}/alix-v4aq-spot/
            ${{ runner.temp }}/alix-v4aq-funding/
            alix-v4aq-ai6-report.json
            alix-v4aq-ai6-trades.csv
            alix-v4aq-ai6-decisions.csv
            alix-v4aq-ai6-step-summary.md
          if-no-files-found: warn
          retention-days: 30
