name: AliX Nobitex AI Ensemble Research

on:
  push:
    branches:
      - research/ml-core-ai-ensemble
  pull_request:
    branches:
      - release/nobitex-mvp
    paths:
      - "research/ai_ensemble/**"
      - "scripts/fetch_nobitex_public_ohlcv.py"
      - "scripts/fetch_nobitex_prehack_ohlcv.py"
      - "scripts/train_nobitex_ai_ensemble.py"
      - "tests/unit/test_ai_ensemble.py"
      - "tests/unit/test_chronos_features.py"
      - ".github/workflows/ai-ensemble-research.yml"

permissions:
  contents: read

jobs:
  ensemble-research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ALIX_DRY_RUN: "true"
      ALIX_ALLOW_LIVE_TRADING: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned research test dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy pandas==2.3.3 scikit-learn==1.9.0 joblib==1.5.3 lightgbm==4.7.0 xgboost-cpu==3.4.1 pytest==9.0.3 ruff==0.14.0
      - name: Compile Chronos and ensemble modules
        run: python -m compileall -q research/ai_ensemble scripts/fetch_nobitex_public_ohlcv.py scripts/fetch_nobitex_prehack_ohlcv.py scripts/train_nobitex_ai_ensemble.py tests/unit/test_ai_ensemble.py tests/unit/test_chronos_features.py
      - name: Ruff lint
        run: ruff check research/ai_ensemble scripts/fetch_nobitex_public_ohlcv.py scripts/fetch_nobitex_prehack_ohlcv.py scripts/train_nobitex_ai_ensemble.py tests/unit/test_fetch_nobitex_public_ohlcv.py tests/unit/test_ai_ensemble.py tests/unit/test_chronos_features.py
      - name: Ruff format
        run: ruff format --check --diff research/ai_ensemble scripts/fetch_nobitex_public_ohlcv.py scripts/fetch_nobitex_prehack_ohlcv.py scripts/train_nobitex_ai_ensemble.py tests/unit/test_fetch_nobitex_public_ohlcv.py tests/unit/test_ai_ensemble.py tests/unit/test_chronos_features.py
      - name: Run Nobitex, ensemble and Chronos feature tests
        run: pytest tests/unit/test_fetch_nobitex_public_ohlcv.py tests/unit/test_ai_ensemble.py tests/unit/test_chronos_features.py -q
