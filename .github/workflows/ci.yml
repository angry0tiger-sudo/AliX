name: AliX Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Pin resolver compatible with pip-tools
        run: python -m pip install pip==25.2
      - name: Install pinned quality tools
        run: python -m pip install ruff==0.14.0 mypy==1.18.2 gymnasium==1.4.0 farama-notifications==0.0.6 pandas==2.3.3 pandas-stubs==2.3.2.250926 bandit==1.8.6 pip-audit==2.9.0 pytest==9.0.3 pytest-cov==7.0.0 import-linter==2.3 xenon==0.9.3 pre-commit==4.3.0 jsonschema==4.25.1 pip-tools==7.5.0 scikit-learn==1.9.0 fastapi==0.158.1 httpx2==2.16.0 sqlalchemy==2.1.6 'psycopg[binary]==3.3.2' uvicorn==0.54.0 pyyaml==6.0.3
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Validate Docker Compose configuration without starting services
        env:
          POSTGRES_PASSWORD: compose-config-synthetic-password
          ALIx_ADMIN_TOKEN: compose-config-synthetic-owner-token-0123456789
        run: docker compose --file compose.yaml config --quiet
      - name: Validate Phase 9 test PostgreSQL Compose profile without starting services
        run: docker compose --file compose.phase9-test.yaml --profile phase9-test config --quiet
      - name: Compile source
        run: python -m compileall -q control_plane risk connectivity external_data services integrations user_data/strategies user_data/freqaimodels tests scripts
      - name: Ruff lint
        run: ruff check control_plane risk connectivity external_data services integrations user_data/strategies user_data/freqaimodels tests scripts
      - name: Ruff format check
        run: ruff format --check --diff control_plane risk connectivity external_data services integrations user_data/strategies user_data/freqaimodels tests scripts
      - name: Strict type check
        run: mypy --config-file mypy.ini
      - name: Security scan
        run: bandit -r control_plane risk connectivity external_data services integrations user_data/strategies user_data/freqaimodels scripts -ll
      - name: Runtime and tooling dependency resolution (dry run)
        run: python -m pip install --dry-run --report /tmp/alix-dependency-resolution.json -r requirements.txt
      - name: Verify transitive dependency lock
        run: |
          pip-compile --no-header --no-annotate --no-emit-index-url --no-emit-trusted-host --constraint requirements.lock --output-file=/tmp/requirements.lock requirements.txt
          sed -i '1i# Generated by pip-tools from requirements.txt; Python 3.12 CI resolver.' /tmp/requirements.lock
          diff -u requirements.lock /tmp/requirements.lock
      - name: Dependency audit
        run: pip-audit -r requirements.lock
      - name: Architecture contracts
        run: lint-imports
      - name: Complexity gate
        run: xenon --max-absolute B --max-modules B --max-average A control_plane risk connectivity external_data services integrations user_data/strategies user_data/freqaimodels scripts
      - name: Unit tests and coverage (mock-only)
        run: pytest --cov=control_plane --cov=risk --cov=connectivity --cov=external_data --cov=services --cov=integrations.nobitex --cov=user_data/strategies --cov-report=term-missing --cov-fail-under=90 -q
      - name: Phase 9 end-to-end simulation (synthetic only)
        run: python -m scripts.run_phase9_e2e --output /tmp/alix-phase9-e2e.json --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload Phase 9 synthetic E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9-synthetic-e2e-report
          path: /tmp/alix-phase9-e2e.json
          if-no-files-found: warn
      - name: Phase 7 risk fault-injection report (synthetic only)
        run: python scripts/run_phase7_risk_fault_injection.py --output /tmp/alix-phase7-risk-fault-injection.json --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload Phase 7 fault-injection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-risk-fault-injection-report
          path: /tmp/alix-phase7-risk-fault-injection.json
          if-no-files-found: warn
      - name: Phase 1 safety and dependency contracts
        run: pytest tests/unit/test_phase1_contracts.py -q
      - name: Starter Kit integrity and documentation validation
        run: python scripts/validate_project_docs.py

  freqtrade-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Freqtrade runtime
        run: |
          python -m pip install pip==25.2
          python -m pip install freqtrade==2026.7 datasieve==0.1.9 joblib==1.5.3 scikit-learn==1.9.0 lightgbm==4.7.0
      - name: Verify Freqtrade CLI
        run: freqtrade --version
      - name: Verify strategy loads with Freqtrade and config stays closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from freqtrade.freqai.base_models.BaseRegressionModel import BaseRegressionModel
          from freqtrade.strategy import IStrategy
          from user_data.freqaimodels.AliXBaselineRegressor import AliXBaselineRegressor
          from user_data.strategies.AliXFreqAIBaselineStrategy import AliXFreqAIBaselineStrategy
          from user_data.strategies.AliXStrategy import AliXStrategy

          config = json.loads(Path("config.json").read_text(encoding="utf-8"))
          assert issubclass(AliXStrategy, IStrategy)
          assert issubclass(AliXFreqAIBaselineStrategy, IStrategy)
          assert issubclass(AliXBaselineRegressor, BaseRegressionModel)
          assert config["dry_run"] is True
          assert config["initial_state"] == "stopped"
          assert config["max_open_trades"] == 0
          assert config["exchange"]["key"] == ""
          assert config["exchange"]["secret"] == ""
          assert config["exchange"]["pair_whitelist"] == []
          print("Freqtrade runtime smoke passed; no exchange connection was requested.")
          PY
      - name: Run synthetic Phase 4 walk-forward mechanics check
        run: |
          python -m scripts.run_freqai_baseline_walkforward --synthetic --output /tmp/alix-phase4-synthetic.json --timeframe 1h --horizon 12 --folds 3 --min-train-size 300 --fee-bps 10 --slippage-bps 5 --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/alix-phase4-synthetic.json").read_text(encoding="utf-8"))
          assert report["commit_sha"] == "${{ github.event.pull_request.head.sha || github.sha }}"
          assert report["evaluation_status"] == "SYNTHETIC_MECHANICS_ONLY"
          assert report["dataset"]["kind"] == "synthetic"
          assert len(report["folds"]) == 3
          assert report["champion"] is None
          assert report["promotion_status"] == "BLOCKED_NO_ECONOMIC_GATE"
          assert report["economic_gates"]["status"] == "NOT_EVALUATED"
          assert report["model"]["reload_roundtrip"] == "passed"
          assert report["out_of_sample"]["sample_count"] > 0
          print("Synthetic FreqAI mechanics passed; this is not economic evidence and Champion remains unset.")
          PY
      - name: Upload synthetic Phase 4 mechanics report
        uses: actions/upload-artifact@v4
        with:
          name: phase4-synthetic-walkforward-report
          path: /tmp/alix-phase4-synthetic.json
          if-no-files-found: error

      - name: Run synthetic Phase 5 Triple-Barrier and Meta-Labeling mechanics check
        run: |
          python -m scripts.run_meta_labeling_walkforward --synthetic --output /tmp/alix-phase5-synthetic.json --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/alix-phase5-synthetic.json").read_text(encoding="utf-8"))
          assert report["commit_sha"] == "${{ github.event.pull_request.head.sha || github.sha }}"
          assert report["evaluation_status"] == "SYNTHETIC_MECHANICS_ONLY"
          assert report["dataset"]["kind"] == "synthetic"
          assert report["data_quality_gate"]["passed"] is True
          assert report["data_quality_gate"]["status"] == "VALID"
          assert report["data_quality_gate"]["fingerprint"]
          assert report["triple_barrier"]["event_count"] > 0
          assert sum(report["triple_barrier"]["barrier_outcomes"].values()) == report["triple_barrier"]["event_count"]
          assert report["primary_oof"]["oos_sample_count"] > 0
          assert report["meta_evaluation"]["evaluated_fold_count"] >= 2
          assert report["meta_evaluation"]["training_signal_requirement"] == "OUT_OF_FOLD_ONLY"
          assert report["economic_gates"]["status"] == "NOT_EVALUATED"
          assert report["champion"] is None
          assert report["promotion_status"] == "BLOCKED_NO_ECONOMIC_GATE"
          assert report["trading_authorization"] == "NO_GO"
          assert report["model_output_is_order_permission"] is False
          print("Phase 5 synthetic mechanics passed; no economic acceptance or trading permission is implied.")
          PY
      - name: Upload synthetic Phase 5 mechanics report
        uses: actions/upload-artifact@v4
        with:
          name: phase5-synthetic-meta-labeling-report
          path: /tmp/alix-phase5-synthetic.json
          if-no-files-found: error

  postgres-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17.6-alpine
        env:
          POSTGRES_DB: alix_phase9
          POSTGRES_USER: alix_test
          POSTGRES_PASSWORD: phase9-only-synthetic-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U alix_test -d alix_phase9"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      ALIX_TEST_POSTGRES_URL: postgresql+psycopg://alix_test:phase9-only-synthetic-password@127.0.0.1:5432/alix_phase9
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned PostgreSQL test dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install pytest==9.0.3 sqlalchemy==2.1.6 'psycopg[binary]==3.3.2'
      - name: Test Control Plane transactions against disposable PostgreSQL
        run: pytest tests/integration/test_phase9_postgres.py -q

  real-data-diagnostic:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/research/ml-core-rebuild' }}
    needs:
      - quality
      - postgres-integration
      - freqtrade-runtime-smoke
    permissions:
      contents: read
    uses: ./.github/workflows/ml-core-real-data-baseline.yml

  ensemble-real-data-research:
    if: github.event_name == 'push' && github.ref == 'refs/heads/research/ml-core-ai-ensemble'
    needs:
      - quality
      - freqtrade-runtime-smoke
      - postgres-integration
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALIX_DRY_RUN: "true"
      ALIX_ALLOW_LIVE_TRADING: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact research commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned OHLCV ensemble runtime and test dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy pandas==2.3.3 scikit-learn==1.9.0 joblib==1.5.3 lightgbm==4.7.0 xgboost-cpu==3.4.1 pytest==9.0.3
      - name: Re-run AI ensemble mechanics before accessing real market data
        run: pytest tests/unit/test_ai_ensemble.py -q
      - name: Fetch exactly five years of public Nobitex Spot hourly OHLCV
        run: |
          set -euo pipefail
          data_dir="$GITHUB_WORKSPACE/.artifacts/alix-ensemble-data"
          mkdir -p "$data_dir"
          python -m scripts.fetch_nobitex_5y_ohlcv \
            --symbol BTCUSDT \
            --output-dir "$data_dir" \
            --commit-sha "$GITHUB_SHA"
      - name: Verify five-year OHLCV provenance, completeness, and safety
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timedelta
          import hashlib
          import json
          import os
          from pathlib import Path

          data_dir = Path(".artifacts/alix-ensemble-data")
          csv_path = data_dir / "nobitex-btcusdt-1h.csv"
          manifest_path = data_dir / "nobitex-btcusdt-1h.manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          assert manifest["provider"] == "Nobitex public UDF history API"
          assert manifest["interval"] == "1h"
          assert manifest["symbol"] == "BTCUSDT"
          assert manifest["requested_days"] == 1825
          assert manifest["row_count"] == 43800
          assert manifest["total_candles_expected"] == 43800
          assert manifest["windowing_policy"] == "FIVE_ADJACENT_365_DAY_WINDOWS"
          assert manifest["missing_intervals"] == 0
          assert manifest["csv_sha256"] == hashlib.sha256(csv_path.read_bytes()).hexdigest()
          assert manifest["commit_sha"] == os.environ["GITHUB_SHA"]

          # This is an unauthenticated public market-data endpoint.
          # No API key, account credentials, or private endpoint is used.
          assert manifest["public_api_only"] is True
          assert manifest["credentials_used"] is False
          assert manifest["private_api_calls"] == 0
          assert manifest["exchange_calls"] == 0
          assert manifest["real_order_attempts"] == 0
          assert manifest["order_permission"] is False
          assert manifest["Champion"] is None
          assert manifest["trading_authorization"] == "NO-GO"

          timestamps = []
          with csv_path.open(newline="", encoding="utf-8") as stream:
              reader = csv.DictReader(stream)
              expected_columns = {"date", "open", "high", "low", "close", "volume"}
              assert set(reader.fieldnames or ()) == expected_columns
              for row in reader:
                  timestamps.append(
                      datetime.fromisoformat(row["date"].replace("Z", "+00:00"))
                  )

          assert len(timestamps) == 43800
          assert all(
              current - previous == timedelta(hours=1)
              for previous, current in zip(timestamps, timestamps[1:])
          )

          print(json.dumps({
              "provider": manifest["provider"],
              "symbol": manifest["symbol"],
              "interval": manifest["interval"],
              "requested_days": manifest["requested_days"],
              "row_count": len(timestamps),
              "csv_sha256": manifest["csv_sha256"],
              "public_api_only": True,
              "credentials_used": False,
              "private_api_calls": 0,
              "real_order_attempts": 0,
              "Champion": None,
              "order_permission": False,
              "trading_authorization": "NO-GO",
          }, sort_keys=True))
          PY
      - name: Train LightGBM, XGBoost, HMM, and Logistic Regression on real OHLCV
        run: |
          set -euo pipefail
          data_dir="$GITHUB_WORKSPACE/.artifacts/alix-ensemble-data"
          output_dir="$GITHUB_WORKSPACE/.artifacts/alix-ensemble-artifacts"
          mkdir -p "$output_dir"
          python -m scripts.train_nobitex_ai_ensemble \
            --ohlcv "$data_dir/nobitex-btcusdt-1h.csv" \
            --manifest "$data_dir/nobitex-btcusdt-1h.manifest.json" \
            --model "$output_dir/nobitex-ai-ensemble.joblib" \
            --model-manifest "$output_dir/nobitex-ai-ensemble.manifest.json" \
            --report "$output_dir/nobitex-ai-ensemble-report.json" \
            --commit-sha "$GITHUB_SHA"
      - name: Verify training report and write economic Step Summary
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          output_dir = Path(".artifacts/alix-ensemble-artifacts")
          report_path = output_dir / "nobitex-ai-ensemble-report.json"
          model_manifest_path = output_dir / "nobitex-ai-ensemble.manifest.json"
          report = json.loads(report_path.read_text(encoding="utf-8"))
          model_manifest = json.loads(model_manifest_path.read_text(encoding="utf-8"))

          dataset = report["dataset"]
          result = report["research_result"]
          safety = report["safety"]

          assert dataset["kind"] == "PUBLIC_MARKET_DATA"
          assert dataset["row_count"] == 43800
          assert dataset["requested_days"] == 1825
          assert dataset["interval"] == "1h"
          assert report["validation"]["fold_count"] == 3
          assert model_manifest["code_commit_sha"] == os.environ["GITHUB_SHA"]
          assert model_manifest["labeling"]["round_trip_cost_bps"] == 50
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0
          assert safety["orders_or_execution_api_used"] is False

          def number(value, places=4):
              return "N/A" if value is None else f"{float(value):.{places}f}"

          def percent(value):
              return "N/A" if value is None else f"{float(value) * 100:.2f}%"

          summary = [
              "# AliX AI Ensemble: Five-Year Real OHLCV Research",
              "",
              f"Commit: {os.environ['GITHUB_SHA']}",
              f"Dataset: {dataset['provider']} / {dataset['symbol']} / {dataset['interval']}",
              f"Coverage: {dataset['row_count']:,} contiguous hourly candles ({dataset['requested_days']} days)",
              f"Dataset SHA-256: {dataset['csv_sha256']}",
              f"Eligible labeled training rows: {dataset['eligible_labeled_rows']:,}",
              f"Out-of-sample folds: {report['validation']['fold_count']}",
              "",
              "| Metric | Result |",
              "|---|---:|",
              f"| Net PF | {number(result['net_profit_factor'])} |",
              f"| Win Rate | {percent(result['win_rate'])} |",
              f"| Max Drawdown | {percent(result['max_drawdown'])} |",
              f"| Statistical Z-Score | {number(result['statistical_z_score'])} |",
              f"| Net compounded return | {percent(result['net_return'])} |",
              f"| Non-overlapping trades | {result['trade_count']} |",
              "",
              "The Statistical Z-Score is the one-sample normal-approximation statistic for mean non-overlapping net trade return against a zero-mean null. It is not a Deflated Sharpe Ratio and does not apply a multiple-testing correction.",
              "",
              "## Safety and promotion state",
              "",
              "- Champion = null",
              "- order_permission = false",
              "- trading_authorization = NO-GO",
              "- private_api_calls = 0",
              "- real_order_attempts = 0",
              "- Economic acceptance remains NO-GO. A successful training run does not authorize promotion or execution.",
              "",
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(summary))
          print(json.dumps({
              "training_rows": dataset["eligible_labeled_rows"],
              "research_result": result,
              "safety": safety,
          }, sort_keys=True))
          PY
      - name: Upload real-data model, metrics, and dataset provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-ai-ensemble-real-data
          path: |
            .artifacts/alix-ensemble-data/*
            .artifacts/alix-ensemble-artifacts/*
          if-no-files-found: warn
          retention-days: 30

