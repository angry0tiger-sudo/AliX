name: AliX V4-AH Advanced AI Economic Validation
on:
  push:
    branches:
      - research/ml-core-v4ah-advanced-ai
    paths:
      - .github/workflows/ml-core-v4ah-advanced-ai.yml
      - scripts/run_ml_core_v4ah_advanced_ai.py
      - scripts/run_ml_core_v4af_meta_final.py
      - scripts/run_ml_core_v4ac_cost_optimization.py
      - scripts/run_ml_core_real_data_baseline.py
      - scripts/fetch_binance_public_ohlcv.py
      - services/meta_labeling/v4ah.py
      - services/meta_labeling/v4x.py
      - services/meta_labeling/v4y.py
      - services/ml_core/economic_backtest.py
      - services/ml_core/extended_features.py
      - tests/unit/test_ml_core_v4af_meta_final.py
      - tests/unit/test_ml_core_v4ah_advanced_ai.py
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: alix-v4ah-advanced-ai-economic
  cancel-in-progress: false
jobs:
  v4ah-advanced-ai-economic:
    if: github.ref == 'refs/heads/research/ml-core-v4ah-advanced-ai'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require Standard CI success for this exact V4-AH commit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GH_TOKEN"]
          expected_branch = "research/ml-core-v4ah-advanced-ai"
          if target_branch != expected_branch:
              raise SystemExit("unsupported_v4ah_branch:" + target_branch)

          deadline = time.monotonic() + 90 * 60
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs"
              f"?head_sha={target_sha}&per_page=100"
          )
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except (HTTPError, URLError, TimeoutError) as error:
                  raise SystemExit(
                      f"ci_status_lookup_failed:{type(error).__name__}"
                  ) from None

              matching = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == target_sha
                  and run.get("head_branch") == expected_branch
                  and run.get("event") == "push"
              ]
              if matching:
                  latest = max(
                      matching,
                      key=lambda item: (
                          item.get("run_number", 0),
                          item.get("run_attempt", 0),
                      ),
                  )
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") != "success":
                          raise SystemExit(
                              "ci_green_gate_blocked:"
                              + str(latest.get("conclusion"))
                              + ":"
                              + target_sha
                          )
                      print(json.dumps({
                          "gate": "PASS",
                          "target_sha": target_sha,
                          "ci_run_id": latest.get("id"),
                          "ci_run_url": latest.get("html_url"),
                          "ci_conclusion": latest.get("conclusion"),
                      }, sort_keys=True))
                      break
              time.sleep(30)
          else:
              raise SystemExit("ci_green_gate_timeout:" + target_sha)
          PY
      - name: Checkout exact V4-AH commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned V4-AH research dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install \
            numpy==2.5.4 \
            pandas==2.3.3 \
            scipy==1.18.1 \
            scikit-learn==1.9.0 \
            lightgbm==4.7.0 \
            shap==0.54.1
      - name: Confirm V4-AH scope, geometry, and fail-closed safety
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/ml-core-v4ah-advanced-ai"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          printf 'symbol=ETHUSDT\ntimeframe=1h\ndays=730\n'
          printf 'initial_stop_atr=2.0\ntrailing_activation_atr=1.0\n'
          printf 'trailing_reference_step_atr=1.5\ntake_profit_atr=4.0\nhorizon_bars=24\n'
          printf 'fee_bps_per_side=25\nslippage_bps_per_side=20\nround_trip_cost_bps=90\n'
          printf 'SHAP_top_k=30\nregime=KMeans_3_clusters\n'
          printf 'calibration=Temperature_Scaling\nKelly=fractional_0.25_max_0.10\n'
          printf 'Champion=null\norder_permission=false\ntrading_authorization=NO-GO\n'
          printf 'private_api_calls=0\nreal_order_attempts=0\nsequence_model_used=false\n'
          python - <<'PY'
          from scripts import run_ml_core_v4af_meta_final as v4af
          from services.meta_labeling import v4ah

          assert v4af.SYMBOL == "ETHUSDT"
          assert v4af.TIMEFRAME == "1h"
          assert v4af.INITIAL_STOP_ATR == 2.0
          assert v4af.TRAILING_ACTIVATION_ATR == 1.0
          assert v4af.TRAILING_STEP_ATR == 1.5
          assert v4af.TAKE_PROFIT_ATR == 4.0
          assert v4af.HORIZON_BARS_VALUE == 24
          assert v4af.FEE_BPS_PER_SIDE == 25.0
          assert v4af.SLIPPAGE_BPS_PER_SIDE == 20.0
          assert v4af.ROUND_TRIP_COST_BPS == 90.0
          execution = v4af._execution_config()
          assert execution.fee_bps == 25.0
          assert execution.slippage_bps == 20.0
          assert v4ah.V4AH_TOP_K_FEATURES == 30
          assert v4ah.V4AH_REGIME_COUNT == 3
          assert v4ah.V4AH_FRACTIONAL_KELLY == 0.25
          assert v4ah.V4AH_MAXIMUM_KELLY_FRACTION == 0.10
          assert v4ah.V4AH_TRAILING_STEP_OPTIONS == (1.0, 1.5, 2.0)
          print("V4-AH market, model, geometry and safety contracts: PASS")
          PY
      - name: Fetch complete public Binance Spot 730-day ETHUSDT data
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/alix-v4ah-market-data"
          rm -rf "$data_dir"
          mkdir -p "$data_dir"
          log_path="$RUNNER_TEMP/v4ah-fetch-730-ETHUSDT.log"
          if python scripts/fetch_binance_public_ohlcv.py \
            --days 730 \
            --symbol ETHUSDT \
            --interval 1m \
            --output-dir "$data_dir" \
            --commit-sha "$GITHUB_SHA" >"$log_path" 2>&1; then
            cat "$log_path"
          else
            cat "$log_path"
            echo "Public Spot fetch failed; refusing partial data." >&2
            exit 1
          fi
          printf 'requested_days=730\nprovider=Binance Spot public klines API\n'
          printf 'private_api_calls=0\ncredentials_used=false\n'
      - name: Run V4-AH SHAP, regime, calibration, adaptive trailing and Kelly evaluation
        run: |
          set -euo pipefail
          python -m scripts.run_ml_core_v4ah_advanced_ai \
            --input-dir "$RUNNER_TEMP/alix-v4ah-market-data" \
            --output-report "$GITHUB_WORKSPACE/alix-v4ah-advanced-ai-report.json" \
            --output-trades-csv "$GITHUB_WORKSPACE/alix-v4ah-advanced-ai-trades.csv" \
            --output-decisions-csv "$GITHUB_WORKSPACE/alix-v4ah-advanced-ai-decisions.csv" \
            --days 730 \
            --commit-sha "$GITHUB_SHA"
      - name: Validate Primary vs Meta report and publish GitHub Step Summary
        env:
          REPORT_PATH: "${{ github.workspace }}/alix-v4ah-advanced-ai-report.json"
          TRADES_CSV: "${{ github.workspace }}/alix-v4ah-advanced-ai-trades.csv"
          DECISIONS_CSV: "${{ github.workspace }}/alix-v4ah-advanced-ai-decisions.csv"
          TARGET_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          import os
          from pathlib import Path

          from scripts.run_ml_core_v4ah_advanced_ai import (
              CANDIDATE_NAMES,
              SCHEMA,
              _render_step_summary,
              _validate_report,
          )

          report = json.loads(
              Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8")
          )
          _validate_report(report, os.environ["TARGET_SHA"])
          assert report["schema_version"] == SCHEMA
          assert report["symbols"] == ["ETHUSDT"]
          assert report["timeframes"] == ["1h"]
          assert report["dataset_days"] == 730
          assert [item["mode"] for item in report["candidates"]] == list(CANDIDATE_NAMES)
          assert report["final_holdout_used"] is False
          assert report["chronological_evaluation"][
              "final_15_percent_holdout_untouched"
          ] is True
          assert report["fixed_exit_geometry"] == {
              "initial_stop_atr": 2.0,
              "trailing_activation_atr": 1.0,
              "trailing_step_atr": 1.5,
              "take_profit_atr": 4.0,
              "horizon_bars": 24,
          }
          assert report["cost_contract"] == {
              "fee_bps_per_side": 25.0,
              "slippage_bps_per_side": 20.0,
              "round_trip_cost_bps": 90.0,
          }
          safety = report["safety"]
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0
          assert safety["sequence_model_used"] is False

          with Path(os.environ["TRADES_CSV"]).open(
              newline="", encoding="utf-8"
          ) as handle:
              trades = list(csv.DictReader(handle))
          assert len(trades) == report["trade_count"]
          for trade in trades:
              assert trade["symbol"] == "ETHUSDT"
              assert trade["timeframe"] == "1h"
              assert trade["direction"] == "LONG"
              gross = float(trade["gross_market_pnl_usd"])
              fees = float(trade["fees_usd"])
              slippage = float(trade["slippage_cost_usd"])
              raw_net = float(
                  trade.get("unscaled_net_pnl_usd") or trade["net_pnl_usd"]
              )
              assert math.isclose(
                  gross - fees - slippage,
                  raw_net,
                  rel_tol=0.0,
                  abs_tol=0.02,
              )

          with Path(os.environ["DECISIONS_CSV"]).open(
              newline="", encoding="utf-8"
          ) as handle:
              decisions = list(csv.DictReader(handle))
          assert len(decisions) == report["decision_count"]
          assert all(row["split_role"] == "FORWARD_VALIDATION" for row in decisions)
          summary = _render_step_summary(report)
          required = (
              "UNFILTERED_CONTROL",
              "META_NET_EXPECTANCY_FIXED",
              "META_SHAP_ADAPTIVE_TRAIL",
              "META_SHAP_ADAPTIVE_TRAIL_KELLY",
              "Net PF",
              "Max DD",
              "SHAP top-k",
              "KMeans",
              "Champion=null",
              "trading_authorization=NO-GO",
          )
          if any(value not in summary for value in required):
              raise SystemExit("v4ah_step_summary_required_metrics_missing")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as handle:
              handle.write(summary)
          Path("alix-v4ah-advanced-ai-step-summary.md").write_text(
              summary, encoding="utf-8"
          )
          print(summary, end="")
          PY
      - name: Upload V4-AH report, trades, decisions, and exact Step Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-v4ah-advanced-ai-economic
          path: |
            alix-v4ah-advanced-ai-report.json
            alix-v4ah-advanced-ai-trades.csv
            alix-v4ah-advanced-ai-decisions.csv
            alix-v4ah-advanced-ai-step-summary.md
          if-no-files-found: warn
