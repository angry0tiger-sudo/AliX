name: AliX RL Policy Diagnostic Validation Only

on:
  push:
    branches:
      - "research/rl-trading-agent"
    paths:
      - ".github/workflows/rl-trading-agent-policy-diagnostic.yml"
      - "scripts/diagnose_rl_trading_agent.py"
      - "tests/unit/test_rl_policy_diagnostic.py"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alix-rl-policy-diagnostic-${{ github.ref }}
  cancel-in-progress: true

jobs:
  policy-diagnostic:
    name: Compare deterministic and stochastic policy on Validation only
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout diagnostic code without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python 3.12 with pinned dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rl-research.txt

      - name: Wait for matching commit CI to pass
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          deadline = time.monotonic() + 600
          url = f"https://api.github.com/repos/{repository}/actions/runs?head_sha={sha}&per_page=100"
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              matching = [
                  item for item in payload.get("workflow_runs", [])
                  if item.get("name") == "AliX Continuous Integration"
                  and item.get("head_sha") == sha
              ]
              if matching:
                  latest = max(matching, key=lambda item: item.get("run_number", 0))
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") == "success":
                          print("Exact-commit CI passed; diagnostic may proceed.")
                          raise SystemExit(0)
                      raise SystemExit(
                          f"Fail closed: exact-commit CI result was {latest.get('conclusion')}"
                      )
              time.sleep(15)
          raise SystemExit("Fail closed: timed out waiting for exact-commit CI")
          PY

      - name: Pin pip resolver
        run: python -m pip install pip==25.2

      - name: Download exact Run #47 checkpoint and immutable public data
        uses: actions/download-artifact@v4
        with:
          name: rl-trading-agent-ae57111a66afc56324d8c2170d5354261dc608fc
          path: artifacts/source-run-47
          repository: ${{ github.repository }}
          run-id: 40267297996
          github-token: ${{ github.token }}

      - name: Install pinned CPU-only RL research runtime
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-rl-research.txt
          python -m pip check

      - name: Run diagnostic unit and RL contract tests
        run: >-
          python -m pytest
          tests/unit/test_rl_policy_diagnostic.py
          tests/unit/test_rl_trading_environment.py
          tests/unit/test_rl_cost_curriculum.py
          tests/unit/test_rl_trading_agent_runner.py
          -q

      - name: Diagnose the exact Run #47 model on Validation
        run: |
          python -m scripts.diagnose_rl_trading_agent             --data artifacts/source-run-47/public-minute-bars/binance_BTCUSDT_1m.csv             --manifest artifacts/source-run-47/public-minute-bars/manifest.json             --model artifacts/source-run-47/rl-agent/rl_trading_agent_recurrent_ppo.zip             --source-report artifacts/source-run-47/rl-agent/rl-trading-agent-report.json             --out-dir artifacts/rl-agent-policy-diagnostic             --commit-sha "${{ github.sha }}"             --expected-source-commit-sha ae57111a66afc56324d8c2170d5354261dc608fc             --seed 20261026

      - name: Verify diagnostic outputs and immutable safety invariants
        run: |
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          root = Path("artifacts/rl-agent-policy-diagnostic")
          report = json.loads(
              (root / "rl-trading-agent-policy-diagnostic.json").read_text(encoding="utf-8")
          )
          probability_csv = root / "action-probabilities-validation.csv"
          with probability_csv.open(encoding="utf-8", newline="") as stream:
              row_count = sum(1 for _ in csv.DictReader(stream))
          safety = report["safety_invariants"]
          assert report["training_performed"] is False
          assert report["model_weights_modified"] is False
          assert report["final_holdout_scored"] is False
          assert report["final_holdout_metrics_computed"] is False
          assert report["validation"]["scaler_fit_on_training_only"] is True
          assert report["validation"]["source_validation_split_matched"] is True
          assert report["probability_semantics"]["paired_observation_sequence_identical"] is True
          assert row_count == report["validation"]["steps_per_mode"]
          assert report["probability_semantics"]["raw_policy_logits_masked"] is False
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["orders_or_execution_api_used"] is False
          assert safety["real_order_attempts"] == 0
          assert safety["production_promotion_allowed"] is False
          print(json.dumps({
              "validation": report["validation"],
              "mode_comparison": report["diagnostic"]["mode_comparison"],
              "action_probability_summary": report["diagnostic"]["action_probability_summary"],
              "deterministic": report["diagnostic"]["deterministic"]["environment_summary"],
              "stochastic": report["diagnostic"]["stochastic"]["environment_summary"],
              "probability_csv_rows": row_count,
              "safety_invariants": safety,
          }, sort_keys=True, allow_nan=False))
          PY

      - name: Upload policy probabilities and diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rl-trading-agent-policy-diagnostic-${{ github.sha }}
          path: |
            artifacts/rl-agent-policy-diagnostic/rl-trading-agent-policy-diagnostic.json
            artifacts/rl-agent-policy-diagnostic/action-probabilities-validation.csv
          if-no-files-found: warn
          retention-days: 30
