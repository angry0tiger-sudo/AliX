name: AliX V4-M TP/SL Geometry Sweep

on:
  push:
    branches:
      - research/ml-core-v4m-tp-sl-sweep
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: alix-v4m-tp-sl-sweep
  cancel-in-progress: false

jobs:
  tp-sl-sweep:
    if: github.ref == 'refs/heads/research/ml-core-v4m-tp-sl-sweep'
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require Standard CI success for this exact V4-M commit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GH_TOKEN"]
          if target_branch != "research/ml-core-v4m-tp-sl-sweep":
              raise SystemExit("unsupported_v4m_research_branch:" + target_branch)
          deadline = time.monotonic() + 90 * 60
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs"
              f"?head_sha={target_sha}&per_page=100"
          )
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except (HTTPError, URLError, TimeoutError) as error:
                  raise SystemExit(
                      f"ci_status_lookup_failed:{type(error).__name__}"
                  ) from None
              matching = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == target_sha
                  and run.get("head_branch") == target_branch
                  and run.get("event") == "push"
              ]
              if matching:
                  latest = max(
                      matching,
                      key=lambda item: (
                          item.get("run_number", 0),
                          item.get("run_attempt", 0),
                      ),
                  )
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") != "success":
                          raise SystemExit(
                              "ci_green_gate_blocked:"
                              + str(latest.get("conclusion"))
                              + ":"
                              + target_sha
                          )
                      print(json.dumps({
                          "gate": "PASS",
                          "target_sha": target_sha,
                          "ci_run_id": latest.get("id"),
                          "ci_run_url": latest.get("html_url"),
                          "ci_conclusion": latest.get("conclusion"),
                      }, sort_keys=True))
                      break
              time.sleep(30)
          else:
              raise SystemExit("ci_green_gate_timeout:" + target_sha)
          PY

      - name: Checkout exact V4-M commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download immutable V4-H Run 15 candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: alix-v4h-tuning-geometry-diagnostic
          path: ${{ runner.temp }}/v4h-source
          repository: ${{ github.repository }}
          run-id: 41293168191
          github-token: ${{ github.token }}

      - name: Validate immutable V4-H probability source and safety state
        env:
          SOURCE_REPORT: ${{ runner.temp }}/v4h-source/alix-v4h-tuning-geometry-report.json
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          source_path = Path(os.environ["SOURCE_REPORT"])
          source_bytes = source_path.read_bytes()
          source = json.loads(source_bytes.decode("utf-8"))
          expected_sha = (
              "3f3c08c583fabb6c91fcdee81c036db6c92a988cdf2537306813af97e89de6a0"
          )
          assert hashlib.sha256(source_bytes).hexdigest() == expected_sha
          assert source["schema_version"] == "alix.ml-core.v4h-tuning-geometry.v1"
          assert source["commit_sha"] == "e34861c4873b7cc2170aaaf6c79ed9b464df0a9a"
          assert source["diagnostic_scope"] == "CLASSIFICATION_ONLY"
          assert source["trained_models"] == 96
          assert source["experiment_count"] == 48
          assert source["economic_evaluation_performed"] is False
          assert source["acceptance_policy"]["status"] == "MET"
          assert source["acceptance_policy"]["strict_acceptance_count"] == 13
          safety = source["safety"]
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0

          candidate_ids = []
          for experiment in source["experiments"]:
              if experiment.get("scenario") != "V4H_Tighter_SL":
                  continue
              for policy, variant in (experiment.get("model_variants") or {}).items():
                  forward = (
                      (variant.get("threshold_optimization") or {})
                      .get("post_calibration_validation")
                  )
                  if not isinstance(forward, dict):
                      continue
                  hold = forward.get("hold_metrics") or {}
                  if (
                      hold.get("precision") is not None
                      and hold.get("recall") is not None
                      and hold["precision"] >= 0.40
                      and hold["recall"] >= 0.20
                  ):
                      candidate_ids.append("|".join((
                          experiment["scenario"],
                          experiment["pair"],
                          experiment["timeframe"],
                          experiment["feature_profile"],
                          policy,
                      )))
          assert len(candidate_ids) == 13
          assert len(set(candidate_ids)) == 13

          datasets = {item["symbol"]: item for item in source["input_datasets"]}
          assert set(datasets) == {"BTCUSDT", "ETHUSDT"}
          with Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as env:
              for symbol in ("BTCUSDT", "ETHUSDT"):
                  item = datasets[symbol]
                  env.write(f"{symbol}_START_UTC={item['start_utc']}\\n")
                  env.write(f"{symbol}_END_UTC={item['end_utc']}\\n")
          print(json.dumps({
              "source_v4h_sha": source["commit_sha"],
              "source_report_sha256": expected_sha,
              "candidate_count": len(candidate_ids),
              "probability_replay_only": True,
              "Champion": None,
              "trading_authorization": "NO-GO",
          }, sort_keys=True))
          PY

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned V4-M replay dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3

      - name: Fetch byte-identical V4-H public market candles
        env:
          DATA_DIR: ${{ runner.temp }}/alix-v4m-market-data
        run: |
          set -euo pipefail
          rm -rf "$DATA_DIR"
          mkdir -p "$DATA_DIR"
          for symbol in BTCUSDT ETHUSDT; do
            start_var="${symbol}_START_UTC"
            end_var="${symbol}_END_UTC"
            start_utc="${!start_var}"
            end_utc="${!end_var}"
            python scripts/fetch_binance_public_ohlcv.py \
              --days 730 \
              --symbol "$symbol" \
              --interval 1m \
              --start-utc "$start_utc" \
              --end-utc "$end_utc" \
              --output-dir "$DATA_DIR" \
              --commit-sha "$GITHUB_SHA"
          done

      - name: Replay four TP/SL geometries across the same 13 candidates
        env:
          SOURCE_REPORT: ${{ runner.temp }}/v4h-source/alix-v4h-tuning-geometry-report.json
          DATA_DIR: ${{ runner.temp }}/alix-v4m-market-data
          OUTPUT_REPORT: ${{ github.workspace }}/alix-v4m-tp-sl-sweep-report.json
          OUTPUT_CSV: ${{ github.workspace }}/alix-v4m-tp-sl-sweep-comparison.csv
        run: |
          set -euo pipefail
          python -m scripts.run_ml_core_v4m_tp_sl_sweep \
            --source-report "$SOURCE_REPORT" \
            --input-dir "$DATA_DIR" \
            --output "$OUTPUT_REPORT" \
            --output-csv "$OUTPUT_CSV" \
            --commit-sha "$GITHUB_SHA"
          test -s "$GITHUB_STEP_SUMMARY"
          grep -Fq "AliX V4-M TP/SL Geometry Sweep" "$GITHUB_STEP_SUMMARY"
          grep -Fq "NO-GO" "$GITHUB_STEP_SUMMARY"

      - name: Validate V4-M geometry results, ledgers, provenance, and safety
        env:
          OUTPUT_REPORT: ${{ github.workspace }}/alix-v4m-tp-sl-sweep-report.json
          OUTPUT_CSV: ${{ github.workspace }}/alix-v4m-tp-sl-sweep-comparison.csv
          TARGET_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          import os
          from pathlib import Path

          report = json.loads(
              Path(os.environ["OUTPUT_REPORT"]).read_text(encoding="utf-8")
          )
          expected_geometries = [
              (2.0, 2.0),
              (2.5, 2.5),
              (2.0, 3.0),
              (1.5, 2.0),
          ]
          assert report["schema_version"] == "alix.ml-core.v4m-tp-sl-sweep.v1"
          assert report["commit_sha"] == os.environ["TARGET_SHA"]
          assert report["source_v4h_commit_sha"] == "e34861c4873b7cc2170aaaf6c79ed9b464df0a9a"
          assert report["source_v4h_report_sha256"] == (
              "3f3c08c583fabb6c91fcdee81c036db6c92a988cdf2537306813af97e89de6a0"
          )
          assert report["candidate_count"] == 13
          assert report["geometry_count"] == 4
          assert report["candidate_geometry_pair_count"] == 52
          assert report["confidence_threshold"] == 0.60
          assert report["model_training_performed"] is False
          assert report["model_inference_performed"] is False
          assert report["persisted_probability_replay_only"] is True
          assert report["promotion_status"] == "BLOCKED_PENDING_INDEPENDENT_OOS_AND_OWNER_REVIEW"

          fixed = report["fixed_trade_management_config"]
          assert fixed["confidence_threshold"] == 0.60
          assert fixed["atr_period"] == 14
          assert fixed["horizon_candles"] == 12
          actual_geometries = [
              (
                  item["stop_loss_atr_multiplier"],
                  item["take_profit_atr_multiplier"],
              )
              for item in report["geometry_results"]
          ]
          assert actual_geometries == expected_geometries

          for geometry in report["geometry_results"]:
              stop_loss = float(geometry["stop_loss_atr_multiplier"])
              take_profit = float(geometry["take_profit_atr_multiplier"])
              assert len(geometry["candidates"]) == 13
              assert geometry["aggregate"]["candidate_count"] == 13
              for candidate in geometry["candidates"]:
                  metrics = candidate["metrics"]
                  trades = candidate["trades"]
                  assert candidate["confidence_threshold"] == 0.60
                  assert candidate["stop_loss_atr_multiplier"] == stop_loss
                  assert candidate["take_profit_atr_multiplier"] == take_profit
                  assert metrics["trade_count"] == len(trades)
                  assert sum(candidate["exit_reason_counts"].values()) == len(trades)
                  assert candidate["trade_direction_counts"]["SHORT"] == 0
                  for trade in trades:
                      assert trade["direction"] == "LONG"
                      assert trade["entry_confidence"] >= 0.60
                      assert 1 <= trade["bars_held"] <= 12
                      reference = float(trade["barrier_reference_price"])
                      atr_value = float(trade["atr_value"])
                      assert math.isclose(
                          float(trade["stop_loss_price"]),
                          reference - stop_loss * atr_value,
                          rel_tol=1e-9,
                          abs_tol=1e-7,
                      )
                      assert math.isclose(
                          float(trade["take_profit_price"]),
                          reference + take_profit * atr_value,
                          rel_tol=1e-9,
                          abs_tol=1e-7,
                      )

          for dataset in report["input_datasets"]:
              assert dataset["byte_identical_to_v4h"] is True
              assert dataset["csv_sha256"] == dataset["source_v4h_csv_sha256"]
              assert dataset["public_api_only"] is True
              assert dataset["credentials_used"] is False
          safety = report["safety"]
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0
          assert safety["orders_or_execution_api_used"] is False

          with Path(os.environ["OUTPUT_CSV"]).open(
              encoding="utf-8", newline=""
          ) as handle:
              rows = list(csv.DictReader(handle))
          assert len(rows) == 52
          assert {float(row["confidence_threshold"]) for row in rows} == {0.60}
          assert {
              (
                  float(row["stop_loss_atr_multiplier"]),
                  float(row["take_profit_atr_multiplier"]),
              )
              for row in rows
          } == set(expected_geometries)
          print(json.dumps({
              "candidate_count": report["candidate_count"],
              "geometry_count": report["geometry_count"],
              "candidate_geometry_pairs": len(rows),
              "economic_acceptance": report["economic_acceptance"],
              "Champion": None,
              "trading_authorization": "NO-GO",
              "model_training_performed": False,
          }, sort_keys=True))
          PY

      - name: Upload V4-M TP/SL sweep report and comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-v4m-tp-sl-sweep
          path: |
            alix-v4m-tp-sl-sweep-report.json
            alix-v4m-tp-sl-sweep-comparison.csv
          if-no-files-found: error
          retention-days: 14
