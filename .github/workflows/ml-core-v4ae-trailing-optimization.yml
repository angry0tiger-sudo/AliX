name: AliX V4-AE Primary-Only Trailing Stop Optimization

on:
  push:
    branches:
      - research/ml-core-v4ae-trailing-optimization
    paths:
      - .github/workflows/ml-core-v4ae-trailing-optimization.yml
      - scripts/run_ml_core_v4ae_trailing_optimization.py
      - scripts/run_ml_core_v4ac_cost_optimization.py
      - scripts/run_ml_core_real_data_baseline.py
      - scripts/fetch_binance_public_ohlcv.py
      - services/ml_core/economic_backtest.py
      - services/meta_labeling/v4y.py
      - tests/unit/test_ml_core_v4ae_trailing_optimization.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: alix-v4ae-trailing-optimization
  cancel-in-progress: false

jobs:
  v4ae-trailing-optimization:
    if: github.ref == 'refs/heads/research/ml-core-v4ae-trailing-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require Standard CI success for this exact V4-AE commit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GH_TOKEN"]
          expected_branch = "research/ml-core-v4ae-trailing-optimization"
          if target_branch != expected_branch:
              raise SystemExit("unsupported_v4ae_branch:" + target_branch)

          deadline = time.monotonic() + 90 * 60
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs"
              f"?head_sha={target_sha}&per_page=100"
          )
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except (HTTPError, URLError, TimeoutError) as error:
                  raise SystemExit(
                      f"ci_status_lookup_failed:{type(error).__name__}"
                  ) from None

              matching = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == target_sha
                  and run.get("head_branch") == expected_branch
                  and run.get("event") == "push"
              ]
              if matching:
                  latest = max(
                      matching,
                      key=lambda item: (
                          item.get("run_number", 0), item.get("run_attempt", 0)
                      ),
                  )
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") != "success":
                          raise SystemExit(
                              "ci_green_gate_blocked:"
                              + str(latest.get("conclusion")) + ":" + target_sha
                          )
                      print(json.dumps({
                          "gate": "PASS", "target_sha": target_sha,
                          "ci_run_id": latest.get("id"),
                          "ci_run_url": latest.get("html_url"),
                      }, sort_keys=True))
                      break
              time.sleep(30)
          else:
              raise SystemExit("ci_green_gate_timeout:" + target_sha)
          PY

      - name: Checkout exact V4-AE commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm V4-AE scope and fail-closed safety
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/ml-core-v4ae-trailing-optimization"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          printf 'timeframe=1h\nsymbols=BTCUSDT,ETHUSDT\nmode=PRIMARY_ONLY\n'
          printf 'initial_stop_atr=1.0,1.5,2.0\n'
          printf 'trailing_activation_atr=0.5,1.0,1.5\n'
          printf 'trailing_step_atr=1.0,1.5,2.0\n'
          printf 'candidate_rows=54\nhorizon_bars=24\ntake_profit_atr=4.0\n'
          printf 'fee_bps_per_side=10\nslippage_bps_per_side=5\nround_trip_cost_bps=30\n'
          printf 'Champion=null\norder_permission=false\ntrading_authorization=NO-GO\n'
          printf 'private_api_calls=0\nreal_order_attempts=0\nsequence_model_used=false\n'
          python - <<'PY'
          from scripts import run_ml_core_v4ae_trailing_optimization as v4ae

          assert len(v4ae.GRID) == 27
          assert v4ae.SYMBOLS == ("BTCUSDT", "ETHUSDT")
          assert v4ae.TIMEFRAME == "1h"
          assert v4ae.MODE == "PRIMARY_ONLY"
          assert v4ae.HORIZON_BARS == 24
          assert v4ae.TAKE_PROFIT_ATR == 4.0
          assert v4ae.V4AD_BASELINE["initial_stop_atr"] == 2.0
          assert v4ae.V4AD_BASELINE["trailing_activation_atr"] == 1.5
          assert v4ae.V4AD_BASELINE["trailing_step_atr"] == 1.0
          print("V4-AE scope and V4-AD baseline inclusion: PASS")
          PY

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned V4-AE diagnostic dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3 scikit-learn==1.9.0 lightgbm==4.7.0

      - name: Fetch complete public Binance Spot 730-day 1-minute datasets
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/alix-v4ae-market-data"
          rm -rf "$data_dir"
          mkdir -p "$data_dir"
          for symbol in BTCUSDT ETHUSDT; do
            log_path="$RUNNER_TEMP/v4ae-fetch-730-$symbol.log"
            if python scripts/fetch_binance_public_ohlcv.py \
              --days 730 \
              --symbol "$symbol" \
              --interval 1m \
              --output-dir "$data_dir" \
              --commit-sha "$GITHUB_SHA" >"$log_path" 2>&1; then
              cat "$log_path"
            else
              cat "$log_path"
              echo "Public Spot fetch failed; refusing partial data." >&2
              exit 1
            fi
          done
          printf 'requested_days=730\nprovider=Binance Spot public klines API\n'
          printf 'private_api_calls=0\ncredentials_used=false\n'

      - name: Run V4-AE 54-row primary-only trailing grid
        run: |
          set -euo pipefail
          python -m scripts.run_ml_core_v4ae_trailing_optimization \
            --input-dir "$RUNNER_TEMP/alix-v4ae-market-data" \
            --output-report "$GITHUB_WORKSPACE/alix-v4ae-trailing-optimization-report.json" \
            --output-trades-csv "$GITHUB_WORKSPACE/alix-v4ae-trailing-optimization-trades.csv" \
            --days 730 \
            --commit-sha "$GITHUB_SHA"

      - name: Validate V4-AE report and render GitHub Step Summary
        env:
          REPORT_PATH: ${{ github.workspace }}/alix-v4ae-trailing-optimization-report.json
          TRADES_CSV: ${{ github.workspace }}/alix-v4ae-trailing-optimization-trades.csv
          TARGET_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          import os
          from pathlib import Path

          from scripts.run_ml_core_v4ae_trailing_optimization import render_step_summary

          report = json.loads(
              Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8")
          )
          assert report["schema_version"] == "alix.ml-core.v4ae-trailing-optimization.v1"
          assert report["commit_sha"] == os.environ["TARGET_SHA"]
          assert report["requested_days"] == 730
          assert report["symbols"] == ["BTCUSDT", "ETHUSDT"]
          assert report["timeframes"] == ["1h"]
          assert report["horizon_bars"] == 24
          assert report["mode"] == "PRIMARY_ONLY"
          assert report["grid"]["total_candidate_configurations"] == 54
          assert report["grid"]["candidate_configurations_per_symbol"] == 27
          assert report["meta_model"]["enabled"] is False
          assert report["meta_model"]["model_fit_performed"] is False
          assert report["evaluation_window"]["last_15_percent_final_holdout_used"] is False
          costs = report["execution_cost_contract"]
          assert costs["fee_bps_per_side"] == 10.0
          assert costs["fee_type_assumption"] == "MAKER"
          assert costs["slippage_bps_per_side"] == 5.0
          assert costs["round_trip_cost_bps"] == 30.0
          assert len(report["cells"]) == 54
          assert len({cell["candidate_id"] for cell in report["cells"]}) == 54
          for cell in report["cells"]:
              assert cell["mode"] == "PRIMARY_ONLY"
              assert cell["timeframe"] == "1h"
              assert cell["horizon_bars"] == 24
              assert cell["round_trip_cost_bps"] == 30.0
              assert cell["status"] == "COMPLETED"
              assert cell["trade_count"] >= 0
              assert math.isfinite(float(cell["max_drawdown_percent"]))
              assert math.isfinite(float(cell["gross_pnl_total_usd"]))
              assert math.isfinite(float(cell["net_pnl_total_usd"]))
          with Path(os.environ["TRADES_CSV"]).open(
              newline="", encoding="utf-8"
          ) as handle:
              trades = list(csv.DictReader(handle))
          for trade in trades:
              assert trade["direction"] == "LONG"
              assert trade["timeframe"] == "1h"
              assert int(trade["horizon_bars"]) <= 24
              gross = float(trade["gross_market_pnl_usd"])
              fees = float(trade["fees_usd"])
              slippage = float(trade["slippage_cost_usd"])
              net = float(trade["net_pnl_usd"])
              assert math.isclose(
                  gross - fees - slippage, net, rel_tol=0.0, abs_tol=0.02
              )
          safety = report["safety"]
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0
          assert safety["orders_or_execution_api_used"] is False
          assert safety["credentials_used"] is False
          assert safety["short_positions_supported"] is False
          assert safety["sequence_model_used"] is False
          assert report["promotion_status"] == "BLOCKED_PENDING_INDEPENDENT_OOS_AND_OWNER_REVIEW"

          summary = render_step_summary(report)
          required = (
              "| Symbol | Initial SL ATR | Activation ATR | Trailing Step ATR |",
              "Trades", "Gross PF", "Net PF", "Max DD %",
              "Champion=null", "trading_authorization=NO-GO",
          )
          if any(value not in summary for value in required):
              raise SystemExit("v4ae_step_summary_required_metrics_missing")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open(
              "a", encoding="utf-8"
          ) as handle:
              handle.write(summary)
          Path(
              "alix-v4ae-trailing-optimization-step-summary.md"
          ).write_text(summary, encoding="utf-8")
          print(summary, end="")
          PY

      - name: Upload V4-AE report, trade ledger, and exact Step Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-v4ae-trailing-optimization
          path: |
            alix-v4ae-trailing-optimization-report.json
            alix-v4ae-trailing-optimization-trades.csv
            alix-v4ae-trailing-optimization-step-summary.md
          if-no-files-found: warn
