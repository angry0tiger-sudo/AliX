name: AliX Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Pin resolver compatible with pip-tools
        run: python -m pip install pip==25.2
      - name: Install pinned quality tools
        run: python -m pip install ruff==0.14.0 mypy==1.18.2 pandas==2.3.3 pandas-stubs==2.3.2.250926 bandit==1.8.6 pip-audit==2.9.0 pytest==9.0.3 pytest-cov==7.0.0 import-linter==2.3 xenon==0.9.3 pre-commit==4.3.0 jsonschema==4.25.1 pip-tools==7.5.0 scikit-learn==1.9.0 fastapi==0.158.1 httpx2==2.16.0 sqlalchemy==2.1.6 'psycopg[binary]==3.3.2' uvicorn==0.54.0 pyyaml==6.0.3
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Validate Docker Compose configuration without starting services
        env:
          POSTGRES_PASSWORD: compose-config-synthetic-password
          ALIx_ADMIN_TOKEN: compose-config-synthetic-owner-token-0123456789
        run: docker compose --file compose.yaml config --quiet
      - name: Compile source
        run: python -m compileall -q control_plane risk connectivity external_data services integrations user_data/strategies user_data/freqaimodels tests scripts
      - name: Ruff lint
        run: ruff check control_plane risk connectivity external_data services integrations user_data/strategies user_data/freqaimodels tests scripts
      - name: Ruff format check
        run: ruff format --check --diff control_plane risk connectivity external_data services integrations user_data/strategies user_data/freqaimodels tests scripts
      - name: Strict type check
        run: mypy --config-file mypy.ini
      - name: Security scan
        run: bandit -r control_plane risk connectivity external_data services integrations user_data/strategies user_data/freqaimodels scripts -ll
      - name: Runtime and tooling dependency resolution (dry run)
        run: python -m pip install --dry-run --report /tmp/alix-dependency-resolution.json -r requirements.txt
      - name: Verify transitive dependency lock
        run: |
          pip-compile --no-header --no-annotate --no-emit-index-url --no-emit-trusted-host --constraint requirements.lock --output-file=/tmp/requirements.lock requirements.txt
          sed -i '1i# Generated by pip-tools from requirements.txt; Python 3.12 CI resolver.' /tmp/requirements.lock
          diff -u requirements.lock /tmp/requirements.lock
      - name: Dependency audit
        run: pip-audit -r requirements.lock
      - name: Architecture contracts
        run: lint-imports
      - name: Complexity gate
        run: xenon --max-absolute B --max-modules B --max-average A control_plane risk connectivity external_data services integrations user_data/strategies user_data/freqaimodels scripts
      - name: Unit tests and coverage (mock-only)
        run: pytest --cov=control_plane --cov=risk --cov=connectivity --cov=external_data --cov=services --cov=integrations.nobitex --cov=user_data/strategies --cov-report=term-missing --cov-fail-under=90 -q
      - name: Phase 7 risk fault-injection report (synthetic only)
        run: python scripts/run_phase7_risk_fault_injection.py --output /tmp/alix-phase7-risk-fault-injection.json --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
      - name: Upload Phase 7 fault-injection report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-risk-fault-injection-report
          path: /tmp/alix-phase7-risk-fault-injection.json
          if-no-files-found: warn
      - name: Phase 1 safety and dependency contracts
        run: pytest tests/unit/test_phase1_contracts.py -q
      - name: Starter Kit integrity and documentation validation
        run: python scripts/validate_project_docs.py

  freqtrade-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Freqtrade runtime
        run: |
          python -m pip install pip==25.2
          python -m pip install freqtrade==2026.7 datasieve==0.1.9 joblib==1.5.3 scikit-learn==1.9.0 lightgbm==4.7.0
      - name: Verify Freqtrade CLI
        run: freqtrade --version
      - name: Verify strategy loads with Freqtrade and config stays closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from freqtrade.freqai.base_models.BaseRegressionModel import BaseRegressionModel
          from freqtrade.strategy import IStrategy
          from user_data.freqaimodels.AliXBaselineRegressor import AliXBaselineRegressor
          from user_data.strategies.AliXFreqAIBaselineStrategy import AliXFreqAIBaselineStrategy
          from user_data.strategies.AliXStrategy import AliXStrategy

          config = json.loads(Path("config.json").read_text(encoding="utf-8"))
          assert issubclass(AliXStrategy, IStrategy)
          assert issubclass(AliXFreqAIBaselineStrategy, IStrategy)
          assert issubclass(AliXBaselineRegressor, BaseRegressionModel)
          assert config["dry_run"] is True
          assert config["initial_state"] == "stopped"
          assert config["max_open_trades"] == 0
          assert config["exchange"]["key"] == ""
          assert config["exchange"]["secret"] == ""
          assert config["exchange"]["pair_whitelist"] == []
          print("Freqtrade runtime smoke passed; no exchange connection was requested.")
          PY
      - name: Run synthetic Phase 4 walk-forward mechanics check
        run: |
          python -m scripts.run_freqai_baseline_walkforward --synthetic --output /tmp/alix-phase4-synthetic.json --timeframe 1h --horizon 12 --folds 3 --min-train-size 300 --fee-bps 10 --slippage-bps 5 --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/alix-phase4-synthetic.json").read_text(encoding="utf-8"))
          assert report["commit_sha"] == "${{ github.event.pull_request.head.sha || github.sha }}"
          assert report["evaluation_status"] == "SYNTHETIC_MECHANICS_ONLY"
          assert report["dataset"]["kind"] == "synthetic"
          assert len(report["folds"]) == 3
          assert report["champion"] is None
          assert report["promotion_status"] == "BLOCKED_NO_ECONOMIC_GATE"
          assert report["economic_gates"]["status"] == "NOT_EVALUATED"
          assert report["model"]["reload_roundtrip"] == "passed"
          assert report["out_of_sample"]["sample_count"] > 0
          print("Synthetic FreqAI mechanics passed; this is not economic evidence and Champion remains unset.")
          PY
      - name: Upload synthetic Phase 4 mechanics report
        uses: actions/upload-artifact@v4
        with:
          name: phase4-synthetic-walkforward-report
          path: /tmp/alix-phase4-synthetic.json
          if-no-files-found: error

      - name: Run synthetic Phase 5 Triple-Barrier and Meta-Labeling mechanics check
        run: |
          python -m scripts.run_meta_labeling_walkforward --synthetic --output /tmp/alix-phase5-synthetic.json --commit-sha "${{ github.event.pull_request.head.sha || github.sha }}"
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("/tmp/alix-phase5-synthetic.json").read_text(encoding="utf-8"))
          assert report["commit_sha"] == "${{ github.event.pull_request.head.sha || github.sha }}"
          assert report["evaluation_status"] == "SYNTHETIC_MECHANICS_ONLY"
          assert report["dataset"]["kind"] == "synthetic"
          assert report["data_quality_gate"]["passed"] is True
          assert report["data_quality_gate"]["status"] == "VALID"
          assert report["data_quality_gate"]["fingerprint"]
          assert report["triple_barrier"]["event_count"] > 0
          assert sum(report["triple_barrier"]["barrier_outcomes"].values()) == report["triple_barrier"]["event_count"]
          assert report["primary_oof"]["oos_sample_count"] > 0
          assert report["meta_evaluation"]["evaluated_fold_count"] >= 2
          assert report["meta_evaluation"]["training_signal_requirement"] == "OUT_OF_FOLD_ONLY"
          assert report["economic_gates"]["status"] == "NOT_EVALUATED"
          assert report["champion"] is None
          assert report["promotion_status"] == "BLOCKED_NO_ECONOMIC_GATE"
          assert report["trading_authorization"] == "NO_GO"
          assert report["model_output_is_order_permission"] is False
          print("Phase 5 synthetic mechanics passed; no economic acceptance or trading permission is implied.")
          PY
      - name: Upload synthetic Phase 5 mechanics report
        uses: actions/upload-artifact@v4
        with:
          name: phase5-synthetic-meta-labeling-report
          path: /tmp/alix-phase5-synthetic.json
          if-no-files-found: error
