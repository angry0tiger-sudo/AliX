name: AliX V4-H Tuning and Target Geometry

on:
  push:
    branches:
      - research/ml-core-v4h-tuning-geometry
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: alix-v4h-tuning-geometry
  cancel-in-progress: false

jobs:
  tuning-geometry:
    if: github.ref == 'refs/heads/research/ml-core-v4h-tuning-geometry'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require standard CI success for this exact V4-H commit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GH_TOKEN"]
          if target_branch != "research/ml-core-v4h-tuning-geometry":
              raise SystemExit("unsupported_v4h_training_branch:" + target_branch)
          deadline = time.monotonic() + 90 * 60
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs"
              f"?head_sha={target_sha}&per_page=100"
          )
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except (HTTPError, URLError, TimeoutError) as error:
                  raise SystemExit(
                      f"ci_status_lookup_failed:{type(error).__name__}"
                  ) from None

              matching = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == target_sha
                  and run.get("head_branch") == target_branch
                  and run.get("event") == "push"
              ]
              if matching:
                  latest = max(
                      matching,
                      key=lambda item: (
                          item.get("run_number", 0),
                          item.get("run_attempt", 0),
                      ),
                  )
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") != "success":
                          raise SystemExit(
                              "ci_green_gate_blocked:"
                              + str(latest.get("conclusion"))
                              + ":"
                              + target_sha
                          )
                      print(json.dumps({
                          "gate": "PASS",
                          "target_sha": target_sha,
                          "ci_run_id": latest.get("id"),
                          "ci_run_url": latest.get("html_url"),
                          "ci_conclusion": latest.get("conclusion"),
                      }, sort_keys=True))
                      break
              time.sleep(30)
          else:
              raise SystemExit("ci_green_gate_timeout:" + target_sha)
          PY

      - name: Checkout exact V4-H commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm V4-H branch, experiment contract, and safety scope
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/ml-core-v4h-tuning-geometry"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          printf 'commit_sha=%s\n' "$GITHUB_SHA"
          printf 'scope=CLASSIFICATION_ONLY\n'
          printf 'feature_profiles=Baseline,Baseline+Trend\n'
          printf 'geometries=Current,Symmetric,Tighter_SL\n'
          printf 'target_horizon_candles=12\n'
          printf 'outer_validation=PURGED_CHRONOLOGICAL_HOLDOUT\n'
          printf 'inner_search=RANDOM_SEARCH_9_CANDIDATES_3_PURGED_FOLDS\n'
          printf 'expected_experiments=48\nexpected_models=96\n'
          printf 'economic_evaluation_performed=false\n'
          printf 'private_api_calls=0\nreal_order_attempts=0\n'
          printf 'Champion=null\norder_permission=false\ntrading_authorization=NO-GO\n'

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned classification diagnostic dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3 scikit-learn==1.9.0 lightgbm==4.7.0

      - name: Fetch complete Binance public 1-minute candles
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/alix-v4h-market-data"
          rm -rf "$data_dir"
          mkdir -p "$data_dir"
          for symbol in BTCUSDT ETHUSDT; do
            log_path="$RUNNER_TEMP/v4h-fetch-730-${symbol}.log"
            if python scripts/fetch_binance_public_ohlcv.py \
              --days 730 \
              --symbol "$symbol" \
              --interval 1m \
              --output-dir "$data_dir" \
              --commit-sha "$GITHUB_SHA" >"$log_path" 2>&1; then
              cat "$log_path"
            else
              cat "$log_path"
              echo "Binance fetch failed for ${symbol}; refusing partial data." >&2
              exit 1
            fi
          done
          echo "ALIX_DIAGNOSTIC_DAYS=730" >> "$GITHUB_ENV"
          echo "ALIX_DIAGNOSTIC_CONFIGURED_DAYS=730" >> "$GITHUB_ENV"
          echo "ALIX_DIAGNOSTIC_FALLBACK_REASON=NONE" >> "$GITHUB_ENV"

      - name: Run V4-H experiments and verify Step Summary
        run: |
          python -m scripts.run_ml_core_v4h_tuning_geometry \
            --input-dir "$RUNNER_TEMP/alix-v4h-market-data" \
            --output "$GITHUB_WORKSPACE/alix-v4h-tuning-geometry-report.json" \
            --days "$ALIX_DIAGNOSTIC_DAYS" \
            --commit-sha "$GITHUB_SHA" \
            --random-search-iterations 9 \
            --calibration-fraction 0.20

          summary_path="${GITHUB_STEP_SUMMARY:?missing_GITHUB_STEP_SUMMARY}"
          test -s "$summary_path"
          grep -Fq "AliX V4-H Tuning & Target Geometry" "$summary_path"
          grep -Fq "Best inner-CV hyperparameter combinations" "$summary_path"
          grep -Fq "V4H_Current" "$summary_path"
          grep -Fq "V4H_Symmetric" "$summary_path"
          grep -Fq "V4H_Tighter_SL" "$summary_path"
          grep -Fq "NO-GO" "$summary_path"

      - name: Validate V4-H experiment counts, train-only search, and safety
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("alix-v4h-tuning-geometry-report.json").read_text(encoding="utf-8")
          )
          expected_scenarios = [
              {
                  "name": "V4H_Current",
                  "horizon_candles": 12,
                  "take_profit_multiplier": 2.0,
                  "stop_loss_multiplier": 1.0,
              },
              {
                  "name": "V4H_Symmetric",
                  "horizon_candles": 12,
                  "take_profit_multiplier": 1.5,
                  "stop_loss_multiplier": 1.5,
              },
              {
                  "name": "V4H_Tighter_SL",
                  "horizon_candles": 12,
                  "take_profit_multiplier": 2.0,
                  "stop_loss_multiplier": 1.5,
              },
          ]
          assert report["schema_version"] == "alix.ml-core.v4h-tuning-geometry.v1"
          assert report["commit_sha"] == os.environ["GITHUB_SHA"]
          assert report["diagnostic_scope"] == "CLASSIFICATION_ONLY"
          assert report["economic_evaluation_performed"] is False
          assert report["economic_metrics_reported"] is False
          assert report["requested_days"] == 730
          assert report["triple_barrier_scenarios"] == expected_scenarios
          assert report["labels"] == ["BUY", "SELL", "HOLD"]
          assert report["experiment_count"] == 48
          assert report["trained_experiments"] == 48
          assert report["trained_models"] == 96
          assert report["expected_experiments"] == 48
          assert report["expected_models"] == 96
          assert report["feature_engineering"]["selected_profiles"] == [
              "Baseline", "Baseline+Trend"
          ]
          tuning = report["hyperparameter_tuning"]
          assert tuning["candidate_count_per_model"] == 9
          assert tuning["inner_cv_fold_count"] == 3
          assert tuning["inner_cv_scope"] == "OUTER_TRAIN_ONLY"
          assert tuning["validation_accessed_during_search"] is False
          assert tuning["final_refit_scope"] == "FULL_OUTER_TRAIN_ONLY"
          assert tuning["model_count"] == 96
          assert tuning["candidate_fit_count"] == 96 * 9 * 3
          assert tuning["final_refit_count"] == 96
          assert tuning["candidate_summary"]["candidate_combinations_evaluated"] == 9
          assert tuning["candidate_summary"]["best_by_mean_inner_cv_hold_precision"]
          assert tuning["candidate_summary"]["best_by_mean_inner_cv_macro_f1"]
          assert len(report["geometry_summary"]) == 3

          expected_profiles = {"Baseline", "Baseline+Trend"}
          expected_weightings = {"weight_none", "weight_balanced"}
          independently_counted_acceptances = 0
          for experiment in report["experiments"]:
              assert experiment["scenario"] in {
                  "V4H_Current", "V4H_Symmetric", "V4H_Tighter_SL"
              }
              assert experiment["triple_barrier"]["horizon_candles"] == 12
              assert experiment["feature_profile"] in expected_profiles
              assert experiment["status"] == "TRAINED"
              assert experiment["sample_signature_sha256"]
              assert experiment["split"]["method"] == "PURGED_CHRONOLOGICAL_OUTER_HOLDOUT"
              assert experiment["split"]["inner_tuning_uses_outer_train_only"] is True
              assert set(experiment["model_variants"]) == expected_weightings
              for variant in experiment["model_variants"].values():
                  search = variant["hyperparameter_tuning"]
                  assert search["candidate_count"] == 9
                  assert search["inner_cv_fold_count"] == 3
                  assert search["inner_cv_scope"] == "OUTER_TRAIN_ONLY"
                  assert search["validation_accessed_during_search"] is False
                  assert search["final_refit_scope"] == "FULL_OUTER_TRAIN_ONLY"
                  assert search["candidate_fit_count"] == 27
                  assert len(search["candidate_results"]) == 9
                  assert len({
                      json.dumps(item["parameters"], sort_keys=True)
                      for item in search["candidate_results"]
                  }) == 9
                  for fold in search["inner_cv_folds"]:
                      assert fold["maximum_training_label_end_index"] < fold[
                          "validation_start_index"
                      ]
                      assert fold["pre_validation_embargo_candles"] == 12
                  forward = variant["threshold_optimization"][
                      "post_calibration_validation"
                  ]
                  if forward is not None:
                      hold = forward["hold_metrics"]
                      if hold["precision"] >= 0.40 and hold["recall"] >= 0.20:
                          independently_counted_acceptances += 1

          assert independently_counted_acceptances == report["acceptance_policy"][
              "strict_acceptance_count"
          ]
          assert report["acceptance_policy"]["status"] == (
              "MET" if independently_counted_acceptances else "NOT_MET"
          )
          for geometry in report["geometry_summary"]:
              assert geometry["experiment_count"] == 16
              assert geometry["trained_model_count"] == 32
              assert geometry["label_distribution"]["total"] > 0
              assert abs(
                  sum(
                      item["percent"]
                      for item in geometry["label_distribution"]["classes"].values()
                  ) - 100.0
              ) < 0.001
          safety = report["safety"]
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0
          assert safety["orders_or_execution_api_used"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert report["input_datasets"] and len(report["input_datasets"]) == 2
          for dataset in report["input_datasets"]:
              assert dataset["requested_days"] == 730
              assert dataset["row_count"] == 730 * 24 * 60
              assert dataset["missing_minute_intervals"] == 0
              assert dataset["public_api_only"] is True
              assert dataset["credentials_used"] is False
          print(json.dumps({
              "commit_sha": report["commit_sha"],
              "experiments": report["experiment_count"],
              "trained_models": report["trained_models"],
              "inner_candidate_fits": tuning["candidate_fit_count"],
              "geometry_summary": report["geometry_summary"],
              "strict_acceptance_count": independently_counted_acceptances,
              "Champion": None,
              "trading_authorization": "NO-GO",
              "economic_evaluation_performed": False,
          }, sort_keys=True))
          PY

      - name: Upload V4-H tuning and target geometry report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-v4h-tuning-geometry-diagnostic
          path: alix-v4h-tuning-geometry-report.json
          if-no-files-found: warn
          retention-days: 14
