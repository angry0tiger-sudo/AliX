name: AliX Imitation Learning Research

on:
  push:
    branches:
      - "research/imitation-learning-agent"
    paths:
      - ".github/workflows/imitation-learning-agent.yml"
      - "services/rl_research/institutional_teacher.py"
      - "scripts/run_imitation_learning_agent.py"
      - "scripts/fetch_nobitex_public_ohlcv.py"
      - "scripts/fetch_public_hourly_bars.py"
      - "tests/unit/test_fetch_public_hourly_bars.py"
      - "tests/unit/test_institutional_teacher.py"
      - "tests/unit/test_imitation_learning_agent.py"
      - "tests/unit/test_phase10_public_market_data.py"

permissions:
  contents: read
  actions: read

concurrency:
  group: alix-imitation-learning-${{ github.ref }}
  cancel-in-progress: false

jobs:
  train-lstm-behavioral-cloning:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[train-imitation]') }}
    name: Generate teacher dataset, train fresh LSTM, evaluate holdout
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"

    steps:
      - name: Checkout exact candidate commit without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Wait for successful CI on this exact SHA
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          deadline = time.monotonic() + 1800
          url = (
              f"https://api.github.com/repos/{repository}/actions/runs"
              f"?head_sha={sha}&per_page=100"
          )
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              matches = [
                  run
                  for run in payload.get("workflow_runs", [])
                  if run.get("name") == "AliX Continuous Integration"
                  and run.get("head_sha") == sha
              ]
              if matches:
                  latest = max(matches, key=lambda run: run.get("run_number", 0))
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") == "success":
                          print("Exact-SHA CI passed; public dataset generation is now allowed.")
                          raise SystemExit(0)
                      raise SystemExit(
                          "Fail closed: exact-SHA CI concluded "
                          + str(latest.get("conclusion"))
                      )
              time.sleep(15)
          raise SystemExit("Fail closed: timed out waiting for exact-SHA CI success")
          PY

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned CPU-only research dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3 scikit-learn==1.9.0
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install optuna==5.0.0
          python -m pip check

      - name: Generate immutable 730-day public Binance hourly OHLCV dataset
        run: |
          python scripts/fetch_public_hourly_bars.py \
            --days 730 \
            --output-dir "$RUNNER_TEMP/alix-market-data" \
            --commit-sha "$GITHUB_SHA"

      - name: Generate causal teacher labels and train the fresh LSTM
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python scripts/run_imitation_learning_agent.py \
            --dataset "$RUNNER_TEMP/alix-market-data/binance-btcusdt-1h.csv" \
            --manifest "$RUNNER_TEMP/alix-market-data/binance-btcusdt-1h.manifest.json" \
            --output-dir "$RUNNER_TEMP/alix-imitation-output" \
            --commit-sha "$GITHUB_SHA" \
            --epochs 20 \
            --window 48 \
            --optimization-trials 60 \
            --optimization-seed 20261028

      - name: Enforce research-only output and print final scorecard
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          root = Path(os.environ["RUNNER_TEMP"]) / "alix-imitation-output"
          data_root = Path(os.environ["RUNNER_TEMP"]) / "alix-market-data"
          report = json.loads((root / "imitation-learning-report.json").read_text(encoding="utf-8"))
          teacher_manifest = json.loads((root / "teacher-dataset-manifest.json").read_text(encoding="utf-8"))
          market_manifest = json.loads((data_root / "binance-btcusdt-1h.manifest.json").read_text(encoding="utf-8"))

          assert report["commit_sha"] == os.environ["GITHUB_SHA"]
          assert market_manifest["commit_sha"] == os.environ["GITHUB_SHA"]
          # Keep daily opportunity density and both economic acceptance gates strict.
          teacher_backtest = report["teacher_backtest"]
          assert teacher_backtest["commit_sha"] == os.environ["GITHUB_SHA"]
          assert teacher_backtest["gate"]["minimum_trade_signal_count"] == 800
          assert teacher_backtest["gate"]["signal_count_comparison"] == "strictly_greater_than_minimum"
          assert set(teacher_backtest["modes"]) == {"institutional", "trend_pullback", "mean_reversion", "breakout"}
          optimization = teacher_backtest["optimization"]
          assert optimization["schema_version"] == "alix.teacher-optimization-report.v1"
          assert optimization["method"] == "Optuna TPE with purged walk-forward validation"
          assert optimization["sampler"] == "TPESampler"
          assert optimization["requested_trials"] == 60
          assert optimization["dataset_row_count"] == market_manifest["row_count"]
          assert optimization["search_space"]["entry_mode"] == ["mean_reversion", "breakout", "institutional"]
          assert optimization["search_space"]["rsi_buy_below_integer"] == [20, 40]
          assert optimization["search_space"]["rsi_sell_above"] == "100 - rsi_buy_below"
          assert optimization["search_space"]["bollinger_stddev"] == [1.0, 3.0]
          assert optimization["search_space"]["donchian_lookback_candles_integer"] == [10, 50]
          assert optimization["search_space"]["take_profit_fraction"] == [0.005, 0.05]
          assert optimization["search_space"]["stop_loss_fraction"] == [0.005, 0.05]
          assert optimization["search_space"]["atr_cost_multiple"] == [1.0, 3.0]
          assert optimization["completed_trials"] > 0
          assert optimization["best_parameters"]["entry_mode"] == teacher_backtest["selected_mode"]
          assert optimization["holdout_never_used_in_optimization"] is True
          assert optimization["validation_never_used_in_optimization"] is True
          assert optimization["optimization_test_blocks_end_before_validation"] is True
          assert optimization["purge_candles"] == 72
          assert optimization["embargo_candles"] == 48
          assert len(optimization["folds"]) == 5
          assert optimization["final_holdout_start_inclusive"] == teacher_backtest["holdout"]["row_start_inclusive"]
          assert optimization["validation_start_inclusive"] == int(market_manifest["row_count"] * 0.70)
          assert optimization["validation_end_exclusive"] == int(market_manifest["row_count"] * 0.85)
          for fold in optimization["folds"]:
              assert fold["purge_end_exclusive"] == fold["test_start_inclusive"]
              assert fold["test_start_inclusive"] - fold["train_end_exclusive"] >= optimization["purge_candles"]
              assert fold["test_end_exclusive"] <= optimization["validation_start_inclusive"]
              assert fold["test_end_exclusive"] < optimization["final_holdout_start_inclusive"]
          for previous, following in zip(optimization["folds"], optimization["folds"][1:]):
              assert following["test_start_inclusive"] >= previous["embargo_end_exclusive"]
          assert teacher_backtest["selected_mode"] in teacher_backtest["modes"]
          assert teacher_backtest["entry_mode"] == teacher_backtest["selected_mode"]
          assert report["teacher"]["entry_mode"] == teacher_backtest["selected_mode"]
          assert teacher_manifest["teacher_entry_mode"] == teacher_backtest["selected_mode"]
          assert teacher_manifest["signal_count_comparison"] == "strictly_greater_than_minimum"
          assert teacher_manifest["selected_for_training"] is True
          assert set(teacher_backtest["gate"]["mode_gate_results"]) == {"institutional", "trend_pullback", "mean_reversion", "breakout"}
          for mode, result in teacher_backtest["modes"].items():
              assert result["entry_mode"] == mode
              assert result["gate"]["maximum_allowed_drawdown_fraction"] == 0.15
              cost_counterfactual = result["execution_cost_counterfactual"]
              assert "validation_without_direct_costs" in cost_counterfactual
              assert "holdout_without_direct_costs" in cost_counterfactual
              assert cost_counterfactual["diagnosis"]["interpretation"]
          selected_result = teacher_backtest["modes"][teacher_backtest["selected_mode"]]
          assert selected_result["gate"]["passed"] is True
          assert selected_result["gate"]["validation_profit_factor_passed"] is True
          assert selected_result["gate"]["holdout_profit_factor_passed"] is True
          assert selected_result["gate"]["validation_drawdown_passed"] is True
          assert selected_result["gate"]["holdout_drawdown_passed"] is True
          assert selected_result["gate"]["signal_density_passed"] is True
          assert selected_result["gate"]["lstm_training_allowed"] is True
          risk_parameters = teacher_backtest["parameters"]
          cost_diagnostics = teacher_backtest["cost_adjusted_risk_diagnostics"]
          diagnostic_mode = teacher_backtest["diagnostic_mode_by_wfv_objective"]
          assert diagnostic_mode == teacher_backtest["selected_mode"]
          assert risk_parameters == teacher_backtest["modes"][diagnostic_mode]["parameters"]
          assert cost_diagnostics == teacher_backtest["modes"][diagnostic_mode]["cost_adjusted_risk_diagnostics"]
          assert teacher_backtest["gate"]["minimum_profit_factor"] == 1.5
          assert teacher_backtest["gate"]["maximum_allowed_drawdown_fraction"] == 0.15
          for mode, result in teacher_backtest["modes"].items():
              params = result["parameters"]
              assert 0.005 <= params["take_profit_fraction"] <= 0.05
              assert 0.005 <= params["stop_loss_fraction"] <= 0.05
              assert 1.0 <= params["atr_cost_multiple"] <= 3.0
              assert params["minimum_atr_fraction"] == (
                  params["atr_cost_multiple"]
                  * (params["fee_bps_per_side"] + params["slippage_bps_per_side"])
                  / 10_000.0
              )
              assert params["fee_bps_per_side"] == 25.0
              assert params["slippage_bps_per_side"] == 20.0
              mode_costs = result["cost_adjusted_risk_diagnostics"]
              assert mode_costs["take_profit_fraction"] == params["take_profit_fraction"]
              assert mode_costs["stop_loss_fraction"] == params["stop_loss_fraction"]
              assert mode_costs["estimated_net_return_at_sl_without_gaps"] < 0.0
              assert 0.0 < mode_costs["break_even_win_rate_fraction_without_gaps"] < 1.0
          breakout_params = teacher_backtest["modes"]["breakout"]["parameters"]
          breakout_lookback = breakout_params["donchian_lookback_candles"]
          assert 10 <= breakout_lookback <= 50
          breakout_logic = teacher_backtest["modes"]["breakout"]["entry_logic"]
          assert breakout_logic["donchian_lookback_candles"] == breakout_lookback
          assert f"prior {breakout_lookback} candles" in breakout_logic["buy_condition"]
          assert "completed 4h EMA bias is bullish" in breakout_logic["buy_condition"]
          assert "regardless of the trend filter" in breakout_logic["sell_condition"]
          mean_reversion_params = teacher_backtest["modes"]["mean_reversion"]["parameters"]
          mean_reversion_logic = teacher_backtest["modes"]["mean_reversion"]["entry_logic"]
          assert mean_reversion_logic["bollinger_period_candles"] == 20
          assert 1.0 <= mean_reversion_logic["bollinger_standard_deviations"] <= 3.0
          assert mean_reversion_logic["bollinger_standard_deviations"] == mean_reversion_params["bollinger_stddev"]
          assert mean_reversion_logic["rsi_period_candles"] == 14
          assert 20 <= mean_reversion_logic["rsi_buy_below"] <= 40
          assert mean_reversion_logic["rsi_buy_below"] == mean_reversion_params["rsi_buy_below"]
          assert mean_reversion_logic["rsi_sell_above"] == 100 - mean_reversion_logic["rsi_buy_below"]
          assert mean_reversion_logic["rsi_sell_above"] == mean_reversion_params["rsi_sell_above"]
          assert teacher_backtest["parameters"]["minimum_atr_fraction"] == (
              teacher_backtest["parameters"]["atr_cost_multiple"]
              * (teacher_backtest["parameters"]["fee_bps_per_side"]
                 + teacher_backtest["parameters"]["slippage_bps_per_side"])
              / 10_000.0
          )
          assert teacher_backtest["gate"]["passed"] is True
          for partition in ("validation", "holdout"):
              economics = teacher_backtest[partition]["economics"]
              assert economics["profit_factor"] is not None
              assert economics["profit_factor"] > teacher_backtest["gate"]["minimum_profit_factor"]
              assert economics["max_drawdown_fraction"] <= teacher_backtest["gate"]["maximum_allowed_drawdown_fraction"]
          assert report["dataset"]["source_csv_sha256"] == market_manifest["csv_sha256"]
          assert teacher_manifest["source_csv_sha256"] == market_manifest["csv_sha256"]
          teacher_actions = report["teacher"]["action_distribution"]
          trade_signal_count = teacher_actions["BUY"]["count"] + teacher_actions["SELL"]["count"]
          assert teacher_backtest["gate"]["signal_density_passed"] is True
          assert teacher_backtest["gate"]["teacher_trade_signal_count"] == trade_signal_count
          assert teacher_backtest["gate"]["minimum_trade_signal_count"] <= trade_signal_count
          assert trade_signal_count > teacher_backtest["gate"]["minimum_trade_signal_count"], (
              "teacher_signal_density_below_target:"
              + str(trade_signal_count)
          )
          assert teacher_actions["BUY"]["count"] > 0
          assert teacher_actions["SELL"]["count"] > 0
          assert market_manifest["provider"] == "Binance Spot public klines API"
          assert market_manifest["interval"] == "1h"
          assert market_manifest["gap_count"] == 0
          assert market_manifest["row_count"] == 730 * 24
          assert report["model"]["initialized_from_scratch"] is True
          assert report["holdout"]["classification_vs_teacher"]["sample_count"] > 0
          assert report["safety"]["Champion"] is None
          assert report["safety"]["order_permission"] is False
          assert report["safety"]["trading_authorization"] == "NO-GO"
          assert report["safety"]["real_order_attempts"] == 0
          assert report["safety"]["exchange_calls"] == 0
          assert market_manifest["public_api_only"] is True
          assert market_manifest["credentials_used"] is False
          assert market_manifest["real_order_attempts"] == 0
          assert market_manifest["order_permission"] is False
          assert market_manifest["Champion"] is None
          assert market_manifest["trading_authorization"] == "NO-GO"
          print(json.dumps({
              "commit_sha": report["commit_sha"],
              "teacher_dataset_rows": report["dataset"]["row_count"],
              "teacher_actions": report["teacher"]["action_distribution"],
              "teacher_trade_signal_count": trade_signal_count,
              "optimization": optimization,
              "teacher_entry_mode": teacher_backtest["entry_mode"],
              "minimum_teacher_trade_signal_count": teacher_backtest["gate"]["minimum_trade_signal_count"],
              "teacher_backtest_gate": teacher_backtest["gate"],
              "teacher_backtest_modes": teacher_backtest["modes"],
              "teacher_cost_sensitivity_diagnostics": {
                  mode: result["execution_cost_counterfactual"]["diagnosis"]
                  for mode, result in teacher_backtest["modes"].items()
              },
              "cost_adjusted_risk_diagnostics": teacher_backtest["cost_adjusted_risk_diagnostics"],
              "teacher_backtest_validation": teacher_backtest["validation"]["economics"],
              "teacher_backtest_holdout": teacher_backtest["holdout"]["economics"],
              "class_weighting": report["model"]["class_weighting"],
              "validation_classification": report["validation"]["classification"],
              "validation_model_economics": report["validation"]["model_economics"],
              "holdout_classification": report["holdout"]["classification_vs_teacher"],
              "holdout_teacher_economics": report["holdout"]["teacher_economics"],
              "holdout_model_economics": report["holdout"]["model_economics"],
              "holdout_model_actions": report["holdout"]["model_action_distribution"],
              "hold_collapse": report["holdout"]["hold_collapse"],
              "safety": report["safety"],
              "decision": report["decision"],
          }, indent=2, sort_keys=True))
          PY

      - name: Upload public dataset, teacher labels, model weights and scorecard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-imitation-learning-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/alix-market-data/
            ${{ runner.temp }}/alix-imitation-output/
          if-no-files-found: warn
          retention-days: 30
