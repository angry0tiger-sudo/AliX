name: AliX RL Trading Agent Research

on:
  push:
    branches:
      - "research/rl-trading-agent"
    paths:
      - ".github/workflows/rl-trading-agent-research.yml"
      - ".github/workflows/ci.yml"
      - "docs/governance/owner-directives/2026-10-25-rl-reward-shaping.md"
      - "docs/governance/owner-directives/2026-10-25-rl-action-mask-and-holdout.md"
      - "docs/governance/owner-directives/2026-10-25-rl-discrete-action-space.md"
      - "docs/governance/owner-directives/2026-10-26-rl-reward-balance-and-signal-curriculum.md"
      - "docs/governance/owner-directives/2026-10-26-rl-hold-collapse-remediation.md"
      - "docs/governance/owner-directives/2026-10-25-rl-entropy-cost-curriculum.md"
      - "requirements-rl-research.txt"
      - "services/rl_research/rl_trading_environment.py"
      - "services/rl_research/rl_cost_curriculum.py"
      - "scripts/rl_auxiliary_ppo.py"
      - "scripts/run_rl_trading_agent.py"
      - "scripts/audit_rl_training_dynamics.py"
      - "tests/unit/test_rl_training_dynamics_audit.py"
      - "scripts/fetch_public_minute_bars.py"
      - "tests/unit/test_rl_trading_environment.py"
      - "tests/unit/test_rl_cost_curriculum.py"
      - "tests/unit/test_rl_trading_agent_runner.py"
      - "tests/unit/test_rl_auxiliary_ppo.py"
      - "docs/knowledge_base/RL_TRADING_AGENT_ARCHITECTURE.md"
      - "docs/governance/owner-directives/2026-10-25-rl-trading-agent.md"
      - "docs/governance/owner-directives/2026-10-26-rl-observation-auxiliary-loss.md"
      - "docs/governance/owner-directives/2026-10-26-rl-policy-logit-masking.md"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: alix-rl-trading-agent-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rl-historical-research:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[train-rl]') }}
    name: Train recurrent PPO and evaluate untouched holdout
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    steps:
      - name: Checkout exact commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Wait for matching commit CI to pass before retraining
        if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[train-rl]') }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          token = os.environ["GITHUB_TOKEN"]
          deadline = time.monotonic() + 600
          url = (
              f"https://api.github.com/repos/{repository}/actions/runs"
              f"?head_sha={sha}&per_page=100"
          )
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=20) as response:
                  payload = json.load(response)
              matches = [
                  run
                  for run in payload.get("workflow_runs", [])
                  if run.get("name") == "AliX Continuous Integration"
                  and run.get("head_sha") == sha
              ]
              if matches:
                  latest = max(matches, key=lambda run: run.get("run_number", 0))
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") == "success":
                          print("Exact-commit CI completed successfully; training may proceed.")
                          raise SystemExit(0)
                      raise SystemExit(
                          f"Fail closed: exact-commit CI conclusion was {latest.get('conclusion')}"
                      )
              time.sleep(15)
          raise SystemExit("Fail closed: timed out waiting for successful exact-commit CI")
          PY

      - name: Set up Python 3.12 with pinned dependency cache
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-rl-research.txt

      - name: Pin pip resolver
        run: python -m pip install pip==25.2

      - name: Install pinned public-data downloader dependency
        run: python -m pip install requests==2.34.2

      - name: Reuse immutable two-year public minute-bars artifact
        id: reuse-market-data
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: self-evolving-public-minute-bars-6eb38e5c927f8c308aa9ee129beb66c75c9d0e11
          path: .prior-market-data
          repository: ${{ github.repository }}
          run-id: 40183512645
          github-token: ${{ github.token }}

      - name: Stage immutable data or fetch a fresh two-year public window
        shell: bash
        run: |
          set -euo pipefail
          target="artifacts/public-minute-bars"
          mkdir -p "$target"
          if [[ -f ".prior-market-data/public-minute-bars/binance_BTCUSDT_1m.csv" && -f ".prior-market-data/public-minute-bars/manifest.json" ]]; then
            cp ".prior-market-data/public-minute-bars/binance_BTCUSDT_1m.csv" "$target/"
            cp ".prior-market-data/public-minute-bars/manifest.json" "$target/"
            echo "Reused the immutable two-year public market-data artifact."
          else
            echo "Retained artifact unavailable; fetching up to 24 calendar months from public Spot data."
            python -m scripts.fetch_public_minute_bars --symbol BTCUSDT --months 24 --out-dir "$target"
          fi

      - name: Install CPU-only PyTorch and pinned RL research dependencies
        run: |
          python -m pip install torch==2.14.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-rl-research.txt
          python -m pip check

      - name: Audit pinned RL research dependency graph
        run: pip-audit -r requirements-rl-research.txt

      - name: Run environment, curriculum, and split contract tests
        run: >-
          python -m pytest
          tests/unit/test_rl_trading_environment.py
          tests/unit/test_rl_cost_curriculum.py
          tests/unit/test_rl_trading_agent_runner.py
          tests/unit/test_rl_auxiliary_ppo.py
          -q

      - name: Validate data provenance, integrity, and immutable safety invariants
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("artifacts/public-minute-bars")
          csv_path = root / "binance_BTCUSDT_1m.csv"
          manifest = json.loads((root / "manifest.json").read_text(encoding="utf-8"))
          digest = hashlib.sha256(csv_path.read_bytes()).hexdigest()
          safety = manifest["safety_invariants"]
          assert manifest["schema_version"] == "alix.self-evolving-data-manifest.v1"
          assert manifest["symbol"] == "BTCUSDT"
          assert manifest["interval"] == "1m"
          assert manifest["row_count"] >= 1_051_200
          assert manifest["expected_minute_slots"] == manifest["row_count"]
          assert manifest["missing_minute_intervals_between_rows"] == 0
          assert manifest["coverage_fraction"] == 1.0
          assert digest == manifest["csv_sha256"]
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert manifest["private_api_calls"] == 0
          assert manifest["orders_or_execution_api_used"] is False
          assert manifest["real_order_attempts"] == 0
          print(json.dumps({
              "symbol": manifest["symbol"],
              "interval": manifest["interval"],
              "start_utc": manifest["start_utc"],
              "end_utc": manifest["end_utc"],
              "row_count": manifest["row_count"],
              "coverage_fraction": manifest["coverage_fraction"],
              "csv_sha256": digest,
              "Champion": safety["Champion"],
              "order_permission": safety["order_permission"],
              "trading_authorization": safety["trading_authorization"],
          }, sort_keys=True, allow_nan=False))
          PY

      - name: Train Recurrent PPO and run one-pass validation plus final holdout
        run: |
          python -m scripts.run_rl_trading_agent \
            --data artifacts/public-minute-bars/binance_BTCUSDT_1m.csv \
            --manifest artifacts/public-minute-bars/manifest.json \
            --out-dir artifacts/rl-agent \
            --timesteps 1000000 \
            --seed 20261025 \
            --ent-coef 0.1 \
            --exploration-ent-coef 0.5 \
            --exploration-steps 50000 \
            --fee-bps 25 \
            --slippage-bps 20 \
            --commit-sha "${{ github.sha }}"

      - name: Verify report and immutable safety invariants
        run: |
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          report = json.loads(
              Path("artifacts/rl-agent/rl-trading-agent-report.json")
              .read_text(encoding="utf-8")
          )
          safety = report["safety_invariants"]
          split = report["split"]
          model = report["model"]
          evaluation = report["evaluation"]
          curriculum = report["cost_curriculum"]
          assert report["schema_version"] == "alix.rl-trading-agent-report.v13"
          assert report["run_mode"] == "historical_simulation_only"
          assert report["dataset"]["row_count"] >= 1_051_200
          assert report["dataset"]["coverage_fraction"] == 1.0
          assert len(report["dataset"]["csv_sha256"]) == 64
          assert split["training_fraction"] == 0.70
          assert split["validation_fraction"] == 0.10
          assert split["final_holdout_fraction"] == 0.20
          assert split["scaler_fit_on_training_only"] is True
          assert split["validation_used_for_model_selection"] is False
          assert split["final_holdout_used_for_training"] is False
          assert split["final_holdout_used_for_model_selection"] is False
          assert split["final_holdout_evaluation_performed"] is True
          assert split["final_holdout_evaluations"] == 1
          assert split["latest_tail_used_as_current_final_holdout"] is True
          assert split["final_holdout_exposed_in_prior_research"] is True
          assert split["final_holdout_disjoint_from_current_train_validation"] is True
          assert split["final_holdout_start_utc"] == split["previous_run_candidate_holdout_start_utc"]
          assert split["rows_excluded_between_validation_and_final_holdout"] > 0
          assert 0.19 <= split["final_holdout_fraction_actual"] <= 0.21
          assert model["algorithm"] == "RecurrentPPO"
          assert model["policy"] == "ActionMaskedRecurrentActorCriticPolicy"
          assert "no flat-cash HOLD bonus" in model["training_algorithm"]
          assert "low-volatility HOLD reward" not in model["training_algorithm"]
          assert model["model_reload_roundtrip"] == "passed"
          reload_check = model["model_reload_verification"]
          assert reload_check["status"] == "passed"
          assert reload_check["model_file"] == model["model_artifact"]
          assert reload_check["model_sha256"] == model["model_sha256"]
          assert reload_check["model_size_bytes"] > 0
          assert reload_check["trained_timesteps"] == model["total_timesteps_trained"]
          assert reload_check["reloaded_timesteps"] == model["total_timesteps_trained"]
          assert reload_check["original_policy_class"] == "ActionMaskedRecurrentActorCriticPolicy"
          assert reload_check["reloaded_policy_class"] == "ActionMaskedRecurrentActorCriticPolicy"
          assert reload_check["policy_class_match"] is True
          assert reload_check["deterministic_probe_action_match"] is True
          assert 0 <= reload_check["deterministic_probe_action"] < 7
          assert len(model["model_sha256"]) == 64
          assert model["total_timesteps_trained"] >= 1_000_000
          entropy_schedule = model["entropy_coefficient_schedule"]
          assert model["ent_coef"] == entropy_schedule["post_exploration_ent_coef"] == 0.1
          assert entropy_schedule["initial_ent_coef"] == 0.5
          assert entropy_schedule["requested_exploration_steps"] == 50000
          assert entropy_schedule["rollout_update_transition_timestep"] == 50176
          assert entropy_schedule["final_schedule_coefficient"] == 0.1
          assert report["environment"]["reward"]["inactivity_penalty_per_unchanged_position_step"] == 0.001
          assert report["environment"]["reward"]["invalid_action_penalty_default_per_masked_request"] == 0.001
          assert report["environment"]["reward"]["invalid_full_position_buy_penalty"] == 1.0
          assert report["environment"]["reward"]["holding_profit_reward_per_profitable_hold"] == 0.0001

          assert report["environment"]["reward"]["transaction_cost_reward_multiplier"] == 1.0
          assert "this_step_fee_cost + this_step_slippage_cost" in report["environment"]["reward"]["transaction_cost_reward_penalty"]
          assert report["environment"]["reward"]["holding_loss_penalty_per_underwater_hold"] == 0.0001
          assert report["environment"]["reward"]["realized_profit_reward_scale_of_initial_equity"] == 0.5
          assert report["environment"]["reward"]["training_signal_guidance"]["enabled_only_during_training"] is True
          assert report["environment"]["reward"]["training_signal_guidance"]["initial_reward_scale"] == 0.0002
          assert report["environment"]["reward"]["training_signal_guidance"]["anneal_steps"] == 300000
          assert report["environment"]["reward"]["training_signal_guidance"]["update_interval_steps"] == 1000
          assert report["environment"]["reward"]["training_signal_guidance"]["minimum_reward_scale"] == 0.00002
          assert report["environment"]["reward"]["training_signal_guidance"]["final_reward_scale"] == 0.00002
          assert report["environment"]["reward"]["training_signal_guidance"]["validation_enabled"] is False
          assert report["environment"]["reward"]["training_signal_guidance"]["final_holdout_enabled"] is False
          guidance = report["signal_guidance_curriculum"]
          assert guidance["initial_reward_scale"] == 0.0002
          assert guidance["anneal_steps"] == 300000
          assert guidance["update_interval_steps"] == 1000
          assert guidance["minimum_reward_scale"] == 0.00002
          assert guidance["final_reward_scale"] == 0.00002
          assert guidance["floor_reached"] is True
          assert guidance["anneal_completed"] is True
          assert guidance["evaluation_enabled"] is False
          auxiliary = report["auxiliary_loss_curriculum"]
          assert auxiliary["method"] == "recurrent_policy_combined_discrete_action_cross_entropy"
          assert auxiliary["initial_weight"] == 0.1
          assert auxiliary["anneal_steps"] == 500_000
          assert auxiliary["minimum_weight"] == 0.01
          assert auxiliary["effective_weight_at_training_end"] == 0.01
          assert auxiliary["floor_reached"] is True
          assert auxiliary["anneal_completed"] is True
          assert auxiliary["validation_enabled"] is False
          assert auxiliary["final_holdout_enabled"] is False
          assert auxiliary["target_classes"] == {
              "0": "HOLD",
              "1": "BUY_25",
              "2": "BUY_50",
              "3": "BUY_100",
              "4": "SELL_25",
              "5": "SELL_50",
              "6": "SELL_100",
          }
          assert "causal 20-completed-candle SMA slope" in auxiliary["target_rule"]
          assert guidance["rewarded_action_count"] >= 0
          assert guidance["reward_total"] >= 0.0
          assert guidance["rewarded_buy_action_count"] >= 0
          assert guidance["rewarded_sell_action_count"] >= 0
          assert guidance["rewarded_buy_action_count"] + guidance["rewarded_sell_action_count"] == guidance["rewarded_action_count"]
          assert curriculum["initial_fee_bps_per_side"] == 0.0
          assert curriculum["initial_slippage_bps_per_side"] == 0.0
          assert curriculum["target_fee_bps_per_side"] == 25.0
          assert curriculum["target_slippage_bps_per_side"] == 20.0
          assert curriculum["minimum_completed_policy_round_trips"] == 100
          assert curriculum["ramp_steps"] == 100_000
          assert curriculum["ramp_update_interval_steps"] == 1_000
          assert curriculum["training_timesteps"] == model["total_timesteps_trained"]
          assert curriculum["minimum_trade_threshold_met"] == (
              curriculum["total_policy_closed_trade_count"] >= 100
          )
          assert curriculum["ramp_started"] == (
              curriculum["ramp_start_timestep"] is not None
          )
          assert curriculum["ramp_completed"] == (
              curriculum["full_cost_start_timestep"] is not None
              and model["total_timesteps_trained"] >= curriculum["full_cost_start_timestep"]
          )
          assert sum(curriculum["steps_by_stage"].values()) == model["total_timesteps_trained"]
          assert sum(curriculum["closed_trades_by_stage"].values()) == curriculum["total_policy_closed_trade_count"]
          if not curriculum["ramp_completed"]:
              assert report["economic_assessment"]["status"] == "NO-GO"
          assert report["environment"]["reward"]["inactivity_grace_steps"] == 3
          assert report["environment"]["reward"]["profitable_trade_bonus"] == 0.0001
          action_space = report["environment"]["action_space"]
          assert action_space["type"] == "Discrete"
          assert action_space["n"] == 7
          assert action_space["index_to_action"] == {
              "0": "HOLD",
              "1": "BUY_25",
              "2": "BUY_50",
              "3": "BUY_100",
              "4": "SELL_25",
              "5": "SELL_50",
              "6": "SELL_100",
          }
          assert action_space["size_fraction_by_action"] == {
              "1": 0.25,
              "2": 0.5,
              "3": 1.0,
              "4": 0.25,
              "5": 0.5,
              "6": 1.0,
          }
          assert action_space["zero_size_trade_actions_allowed"] is False
          assert action_space["masking"]["enforcement"] == "custom_recurrent_policy_raw_logits_before_categorical_distribution_and_environment_execution_boundary"
          assert action_space["masking"]["policy_distribution_logits_masked"] is True
          assert action_space["masking"]["mask_applied_before_distribution_construction"] is True
          assert action_space["masking"]["masked_logit_value"] == -1e8
          assert action_space["masking"]["forbidden_action_probability_exactly_zero"] is True
          assert action_space["masking"]["buy_action_indices"] == [1, 2, 3]
          assert action_space["masking"]["sell_action_indices"] == [4, 5, 6]
          assert action_space["masking"]["hold_action_index"] == 0
          assert action_space["masking"]["position_fraction_full_threshold"] == 1.0 - 1e-9
          assert action_space["masking"]["position_fraction_flat_threshold"] == 1e-9
          assert action_space["masking"]["buy_actions_masked_when_position_fraction_at_or_above_full_threshold"] is True
          assert action_space["masking"]["sell_actions_masked_when_position_fraction_at_or_below_flat_threshold"] is True
          assert action_space["masking"]["invalid_buy_fallback_reward_penalty"] == 1.0
          assert report["environment"]["reward"]["opportunity_cost_penalty_when_flat_above_sma"] == 0.01
          assert report["environment"]["reward"]["flat_cash_hold_bonus"] == 0.0
          assert report["environment"]["reward"]["flat_cash_hold_bonus_enabled"] is False
          assert report["environment"]["reward"]["low_volatility_hold_reward_removed"] is True
          assert "low_volatility_hold_reward" not in report["environment"]["reward"]
          assert "low_volatility_lookback_completed_candles" not in report["environment"]["reward"]
          assert "low_volatility_return_std_threshold" not in report["environment"]["reward"]
          entropy_schedule = model["entropy_coefficient_schedule"]
          assert entropy_schedule["initial_ent_coef"] == 0.5
          assert entropy_schedule["requested_exploration_steps"] == 50000
          assert entropy_schedule["post_exploration_ent_coef"] == 0.1
          assert entropy_schedule["rollout_update_transition_timestep"] == 50176
          assert entropy_schedule["final_schedule_coefficient"] == 0.1
          assert entropy_schedule["training_only"] is True
          assert entropy_schedule["validation_and_holdout_guidance_enabled"] is False
          assert report["environment"]["reward"]["opportunity_cost_moving_average_window"] == 20
          assert report["environment"]["reward"]["opportunity_cost_indicator_visible_to_policy"] is False
          for split_name in ("validation", "final_holdout"):
              metrics = evaluation[split_name]
              assert metrics["buy_action_count"] >= 0
              assert metrics["sell_action_count"] >= 0
              assert metrics["hold_action_count"] >= 0
              assert metrics["masked_buy_action_count"] >= 0
              assert metrics["masked_sell_action_count"] >= 0
              assert metrics["invalid_action_penalty_count"] >= 0
              assert metrics["full_position_buy_penalty_count"] >= 0
              assert metrics["full_position_buy_penalty_total"] >= 0.0
              assert metrics["full_position_buy_penalty_total"] == (
                  metrics["full_position_buy_penalty_count"]
                  * report["environment"]["reward"]["invalid_full_position_buy_penalty"]
              )
              assert metrics["policy_buy_zero_size_request_count"] == 0
              assert metrics["buy_noop_action_count"] >= 0
              assert metrics["buy_target_not_increasing_action_count"] >= 0
              assert metrics["opportunity_cost_penalty_count"] >= 0
              assert metrics["holding_loss_penalty_count"] >= 0
              assert metrics["holding_profit_reward_count"] >= 0
              assert "low_volatility_hold_reward_count" not in metrics
              assert metrics["transaction_cost_reward_penalty_total"] >= 0.0
              assert set(metrics["discrete_action_counts"]) == {
                  "HOLD", "BUY_25", "BUY_50", "BUY_100", "SELL_25", "SELL_50", "SELL_100"
              }
              assert sum(metrics["discrete_action_counts"].values()) == metrics["steps"]
              assert metrics["discrete_action_counts"]["HOLD"] == metrics["hold_action_count"]
              assert sum(
                  metrics["discrete_action_counts"][name]
                  for name in ("BUY_25", "BUY_50", "BUY_100")
              ) == metrics["buy_action_count"]
              assert sum(
                  metrics["discrete_action_counts"][name]
                  for name in ("SELL_25", "SELL_50", "SELL_100")
              ) == metrics["sell_action_count"]
              assert metrics["signal_guidance_reward_count"] == 0
              assert metrics["signal_guidance_reward_total"] == 0.0
              assert metrics["realized_profit_reward_count"] >= 0
              assert metrics["realized_profit_reward_total"] >= 0.0
              assert metrics["policy_requested_trade_size_action_count"] == (
                  metrics["buy_action_count"] + metrics["sell_action_count"]
              )
              assert metrics["policy_closed_trade_count"] >= 0
              assert metrics["no_position_change_steps"] >= 0
              assert metrics["max_consecutive_no_position_change_steps"] >= 0
              assert metrics["position_change_count"] >= 0
              assert metrics["closed_trade_count"] >= 0
              assert (
                  metrics["winning_trade_count"]
                  + metrics["losing_trade_count"]
                  + metrics["breakeven_trade_count"]
                  == metrics["closed_trade_count"]
              )
              assert metrics["win_rate"] is None or 0.0 <= metrics["win_rate"] <= 1.0
          assert evaluation["final_holdout"]["steps"] == split["final_holdout_rows"] - 1
          assert evaluation["holdout_pass_count"] == 1
          for key in ("net_profit", "net_return", "max_drawdown", "total_fees", "total_slippage"):
              assert math.isfinite(float(evaluation["final_holdout"][key]))
          checkpointing = report["checkpointing"]
          assert checkpointing["enabled"] is True
          assert checkpointing["interval_steps"] == 100_000
          assert checkpointing["checkpoint_count"] == 10
          expected_checkpoint_steps = list(range(100_000, 1_000_001, 100_000))
          assert [item["timesteps"] for item in checkpointing["checkpoints"]] == expected_checkpoint_steps
          for checkpoint in checkpointing["checkpoints"]:
              checkpoint_path = Path("artifacts/rl-agent") / checkpoint["file"]
              assert checkpoint_path.is_file()
              assert len(checkpoint["sha256"]) == 64
              assert checkpoint["size_bytes"] == checkpoint_path.stat().st_size
          checkpoint_validation = report["checkpoint_validation_evaluation"]
          assert checkpoint_validation["scope"] == "validation_only"
          assert checkpoint_validation["checkpoint_count"] == 10
          assert checkpoint_validation["used_for_selection"] is False
          assert checkpoint_validation["final_holdout_scored_for_checkpoint_evaluation"] is False
          assert [
              item["checkpoint_timesteps"]
              for item in checkpoint_validation["checkpoints"]
          ] == expected_checkpoint_steps
          for checkpoint_result in checkpoint_validation["checkpoints"]:
              assert checkpoint_result["validation_steps"] == evaluation["validation"]["steps"]
              assert checkpoint_result["evaluation_passes"] == 1
              assert checkpoint_result["deterministic_inference"] is True
              assert sum(checkpoint_result["discrete_action_counts"].values()) == checkpoint_result["validation_steps"]
              assert math.isclose(
                  sum(
                      value["percent"]
                      for value in checkpoint_result["action_distribution"].values()
                  ),
                  100.0,
                  abs_tol=1e-9,
              )
          reward_dynamics = report["training_reward_dynamics"]
          assert reward_dynamics["window_size_steps"] == 100_000
          assert sum(window["steps"] for window in reward_dynamics["component_windows"]) == model["total_timesteps_trained"]
          assert len(reward_dynamics["component_windows"]) >= 10
          for window in reward_dynamics["component_windows"]:
              assert window["steps"] > 0
              assert "reward_total" in window["reward_component_sums"]
              assert "fees" in window["transaction_cost_sums"]
              assert sum(window["requested_action_counts"].values()) == window["steps"]
              assert sum(window["executed_action_counts"].values()) == window["steps"]
          assert report["environment"]["observation_contains_position_or_pnl"] is True
          assert "current_position_fraction" in report["environment"]["observation_fields"]
          assert "unrealized_pnl_pct" in report["environment"]["observation_fields"]
          assert report["environment"]["observation_semantics"]["current_position_fraction"]
          assert "divided by total marked account equity" in report["environment"]["observation_semantics"]["current_position_fraction"]
          assert "0.05 means +5%" in report["environment"]["observation_semantics"]["unrealized_pnl_pct"]
          assert report["environment"]["observation_contains_technical_indicators"] is False
          assert report["environment"]["execution"]["fixed_timeframe_rule"] is None
          assert report["environment"]["execution"]["fixed_max_holding_period_candles"] is None
          assert report["environment"]["execution"]["fixed_take_profit_rule"] is None
          assert report["environment"]["reward"]["hard_trade_count_minimum"] is None
          assert report["environment"]["reward"]["profit_target"] is None
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["orders_or_execution_api_used"] is False
          assert safety["real_order_attempts"] == 0
          assert safety["model_output_is_order_permission"] is False
          assert report["production_promotion_allowed"] is False
          assert Path("artifacts/rl-agent/rl_trading_agent_recurrent_ppo.zip").is_file()
          print(json.dumps({
              "research_result": report["research_result"],
              "dataset": report["dataset"],
              "split": split,
              "model": model,
              "cost_curriculum": curriculum,
              "validation": evaluation["validation"],
              "final_holdout": evaluation["final_holdout"],
              "checkpoint_validation_evaluation": checkpoint_validation,
              "entropy_coefficient_schedule": entropy_schedule,
              "final_holdout_buy_and_hold": evaluation["final_holdout_buy_and_hold"],
              "economic_assessment": report["economic_assessment"],
              "safety_invariants": safety,
          }, sort_keys=True, allow_nan=False))
          PY

      - name: Capture exact installed dependency inventory
        if: always()
        run: |
          mkdir -p artifacts/rl-agent
          python -m pip freeze | sort > artifacts/rl-agent/dependencies.txt

      - name: Upload source data, model, dependencies and machine-readable report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rl-trading-agent-${{ github.sha }}
          path: |
            artifacts/public-minute-bars/*.csv
            artifacts/public-minute-bars/manifest.json
            artifacts/rl-agent/
          if-no-files-found: warn
          retention-days: 30
