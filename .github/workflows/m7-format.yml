name: M7 One-Time Ruff Formatting

on:
  push:
    branches: [research/nobitex-hf-strategy]
    paths: [docs/research/M7_FORMAT_TRIGGER.txt]

permissions:
  contents: write

concurrency:
  group: alix-m7-one-time-format
  cancel-in-progress: false

jobs:
  format:
    if: github.ref == 'refs/heads/research/nobitex-hf-strategy'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned Ruff formatter
        run: python -m pip install ruff==0.14.0
      - name: Format only M7 implementation and tests
        run: ruff format scripts/run_m7_cross_sectional.py tests/unit/test_m7_cross_sectional.py
      - name: Commit format-only change
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/run_m7_cross_sectional.py tests/unit/test_m7_cross_sectional.py
          if ! git diff --cached --quiet; then
            git commit -m "style(m7): apply pinned Ruff formatting"
            git push origin HEAD:refs/heads/research/nobitex-hf-strategy
          fi
