name: AliX Continuous Integration

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Pin resolver compatible with pip-tools
        run: python -m pip install pip==25.2
      - name: Install pinned quality tools
        run: python -m pip install ruff==0.14.0 mypy==1.18.2 pandas==2.3.3 pandas-stubs==2.3.2.250926 bandit==1.8.6 pip-audit==2.9.0 pytest==9.0.3 pytest-cov==7.0.0 import-linter==2.3 xenon==0.9.3 pre-commit==4.3.0 jsonschema==4.25.1 pip-tools==7.5.0
      - name: Validate pre-commit configuration
        run: pre-commit validate-config
      - name: Compile source
        run: python -m compileall -q connectivity services integrations user_data/strategies tests scripts
      - name: Ruff lint
        run: ruff check connectivity services integrations user_data/strategies tests scripts
      - name: Ruff format check
        run: ruff format --diff connectivity services integrations user_data/strategies tests scripts
      - name: Strict type check
        run: mypy --config-file mypy.ini
      - name: Security scan
        run: bandit -r connectivity services integrations user_data/strategies scripts -ll
      - name: Runtime and tooling dependency resolution (dry run)
        run: python -m pip install --dry-run --report /tmp/alix-dependency-resolution.json -r requirements.txt
      - name: Verify transitive dependency lock
        run: |
          pip-compile --no-header --no-annotate --no-emit-index-url --no-emit-trusted-host --output-file=/tmp/requirements.lock requirements.txt
          sed -i '1i# Generated by pip-tools from requirements.txt; Python 3.12 CI resolver.' /tmp/requirements.lock
          diff -u requirements.lock /tmp/requirements.lock
      - name: Dependency audit
        run: pip-audit -r requirements.lock
      - name: Architecture contracts
        run: lint-imports
      - name: Complexity gate
        run: xenon --max-absolute B --max-modules B --max-average A connectivity services integrations user_data/strategies scripts
      - name: Unit tests and coverage (mock-only)
        run: pytest --cov=connectivity --cov=services --cov=integrations.nobitex --cov=user_data/strategies --cov-report=term-missing --cov-fail-under=90 -q
      - name: Phase 1 safety and dependency contracts
        run: pytest tests/unit/test_phase1_contracts.py -q
      - name: Starter Kit integrity and documentation validation
        run: python scripts/validate_project_docs.py

  freqtrade-runtime-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install pinned Freqtrade runtime
        run: |
          python -m pip install pip==25.2
          python -m pip install freqtrade==2026.7
      - name: Verify Freqtrade CLI
        run: freqtrade --version
      - name: Verify strategy loads with Freqtrade and config stays closed
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          from freqtrade.strategy import IStrategy
          from user_data.strategies.AliXStrategy import AliXStrategy

          config = json.loads(Path("config.json").read_text(encoding="utf-8"))
          assert issubclass(AliXStrategy, IStrategy)
          assert config["dry_run"] is True
          assert config["initial_state"] == "stopped"
          assert config["max_open_trades"] == 0
          assert config["exchange"]["key"] == ""
          assert config["exchange"]["secret"] == ""
          assert config["exchange"]["pair_whitelist"] == []
          print("Freqtrade runtime smoke passed; no exchange connection was requested.")
          PY
