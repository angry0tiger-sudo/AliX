name: M8 BTCUSDT L2 Microstructure Correlation

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: alix-m8-microstructure
  cancel-in-progress: false

jobs:
  preflight-and-correlation:
    if: github.ref == 'refs/heads/research/nobitex-hf-strategy'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
      EXPECTED_MARKET: "BTCUSDT"
    steps:
      - name: Checkout selected research ref without persisted credentials
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the five exact M1.6 source artifacts and verify archive digests
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          inventory = json.loads(
              Path("docs/research/m1_6_artifact_inventory.json").read_text(encoding="utf-8")
          )
          output = Path(".artifacts/m1_6")
          output.mkdir(parents=True, exist_ok=True)
          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]

          for digest, metadata in inventory["artifacts_by_sha256"].items():
              artifact_id = metadata["artifact_id"]
              url = f"https://api.github.com/repos/{repository}/actions/artifacts/{artifact_id}/zip"
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=90) as response:
                  payload = response.read()
              actual = hashlib.sha256(payload).hexdigest()
              if actual != digest:
                  raise SystemExit(
                      f"ARTIFACT_SHA256_MISMATCH id={artifact_id} expected={digest} actual={actual}"
                  )
              path = output / f"m16-{artifact_id}.zip"
              path.write_bytes(payload)
              print(f"verified artifact_id={artifact_id} sha256={actual} bytes={len(payload)}")
          PY

      - name: Run M8 fail-closed target-market preflight and statistical analysis
        id: analysis
        run: |
          python scripts/analyze_m8_microstructure.py \
            --archives .artifacts/m1_6/*.zip \
            --inventory docs/research/m1_6_artifact_inventory.json \
            --expected-market "$EXPECTED_MARKET" \
            --output .artifacts/m8/m8_microstructure_report.json
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path(".artifacts/m8/m8_microstructure_report.json").read_text(encoding="utf-8")
          )
          summary = [
              "# M8 L2 microstructure preflight",
              f"- Status: **{report['status']}**",
              f"- Expected market: **{report['expected_market']}**",
              f"- Actual market(s): **{', '.join(report['actual_markets'])}**",
              f"- Order-book rows: **{report['total_orderbook_rows']}**",
              f"- Correlation status: **{report['correlation_status']}**",
              f"- Decision: **{report['decision']}**",
              "",
              report.get("decision_note", ""),
          ]
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")
          if report["status"] == "BLOCKED_MARKET_MISMATCH":
              print("::warning::BTCUSDT input is required; no cross-market correlation was computed.")
          PY

      - name: Upload M8 report and verified source archive copies
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-m8-microstructure-preflight-${{ github.run_id }}
          path: |
            .artifacts/m8/
            .artifacts/m1_6/
          if-no-files-found: error
          retention-days: 90
          include-hidden-files: true
