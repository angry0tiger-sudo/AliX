name: Temporary M7 Feature Diagnostic Dispatch Bridge

on:
  push:
    branches: [research/nobitex-hf-strategy]
    paths: [docs/research/M7_FEATURE_DIAGNOSTIC_DISPATCH.txt]

permissions:
  actions: write
  contents: read

concurrency:
  group: alix-m7-feature-diagnostic-dispatch-bridge
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.ref == 'refs/heads/research/nobitex-hf-strategy'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Wait for Standard CI on this exact commit
        env:
          GH_TOKEN: \${{ github.token }}
          SOURCE_SHA: \${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          branch = os.environ["GITHUB_REF_NAME"]
          source_sha = os.environ["SOURCE_SHA"]
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs"
              f"?branch={branch}&per_page=100"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "X-GitHub-Api-Version": "2022-11-28",
          }
          deadline = time.monotonic() + 20 * 60
          while time.monotonic() < deadline:
              with urlopen(Request(url, headers=headers), timeout=30) as response:
                  payload = json.load(response)
              matches = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == source_sha
                  and run.get("head_branch") == branch
                  and run.get("name") == "AliX Continuous Integration"
                  and run.get("event") == "push"
              ]
              if matches:
                  latest = max(matches, key=lambda run: run.get("run_number", 0))
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") != "success":
                          raise SystemExit("m7_diagnostic_bridge_standard_ci_not_green")
                      print(json.dumps({"gate": "PASS", "ci_run_id": latest.get("id")}))
                      break
              time.sleep(10)
          else:
              raise SystemExit("m7_diagnostic_bridge_standard_ci_timeout")
          PY
      - name: Dispatch workflow_dispatch-only diagnostic
        env:
          GH_TOKEN: \${{ github.token }}
        run: |
          gh workflow run m7-feature-diagnostic.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME"
