name: TTM-R2 Risk-Only Research

on:
  push:
    branches: [research/ml-core-ttm-r2-risk-eval]

permissions:
  contents: read

jobs:
  standard-ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  ttm-r2-risk-research:
    needs: standard-ci
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
    env:
      ALIX_DRY_RUN: "true"
      ALIX_ALLOW_LIVE_TRADING: "false"
      HF_HUB_DISABLE_TELEMETRY: "1"
      TOKENIZERS_PARALLELISM: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: Checkout exact Standard CI SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned CPU-only TTM research dependencies
        run: |
          python -m pip install pip==26.3 setuptools==84.2.1
          python -m pip install torch==2.10.0 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install granite-tsfm==0.3.12 transformers==5.20.2 accelerate==1.15.0 datasets==5.2.0 fsspec==2026.9.0 pandas==2.3.3 numpy scikit-learn==1.7.2 lightgbm==4.7.0 xgboost-cpu==3.4.1 pytest==9.0.3
          python -m pip install pip-audit==2.10.1
      - name: Verify pinned TTM dependency compatibility
        run: python -m pip check
      - name: Audit TTM-only dependency environment
        run: pip-audit
      - name: Re-run TTM risk contract tests
        run: pytest tests/unit/test_ttm_risk.py -q
      - name: Fetch immutable pre-hack Nobitex data through the existing public-only fetcher
        run: |
          set -euo pipefail
          data_dir="$GITHUB_WORKSPACE/.artifacts/alix-prehack-data"
          mkdir -p "$data_dir"
          python -m scripts.fetch_nobitex_prehack_ohlcv --output-dir "$data_dir" --commit-sha "$GITHUB_SHA"
      - name: Run frozen zero-shot TTM-R2 risk forecast
        run: |
          set -euo pipefail
          python -m scripts.run_ttm_r2_risk_research \
            --ohlcv .artifacts/alix-prehack-data/nobitex-btcusdt-1h.csv \
            --manifest .artifacts/alix-prehack-data/nobitex-btcusdt-1h.manifest.json \
            --output-dir .artifacts/alix-ttm-r2-risk \
            --commit-sha "$GITHUB_SHA"
      - name: Validate report and write Step Summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path(".artifacts/alix-ttm-r2-risk/ttm-r2-risk-report.json").read_text())
          safety = report["safety"]
          assert report["code_commit_sha"] == __import__("os").environ["GITHUB_SHA"]
          assert report["dataset"]["row_count"] == 31801
          assert report["dataset"]["csv_sha256"] == "0aa13607d1da68c4720919f233635bb33d34048e5bd67d3ecc2ce9bb7c2b462e"
          assert report["model"]["mode"] == "ZERO_SHOT_FROZEN_WEIGHTS"
          assert report["model"]["fine_tuned_on_nobitex"] is False
          assert report["risk_forecast_acceptance"]["status"] in {"PASS_RISK_FORECAST_RESEARCH_ONLY", "NO_GO"}
          assert safety["Champion"] is None and safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0 and safety["real_order_attempts"] == 0
          assert safety["paper_orders"] == 0
          assert safety["position_multiplier_applied_to_runtime"] is False
          assert safety["offline_position_sizing_simulated"] is True
          assert report["portfolio_evaluation"]["final_holdout"]["fixed_size_baseline"]["trade_count"] == report["portfolio_evaluation"]["final_holdout"]["ttm_risk_managed"]["trade_count"]
          assert report["portfolio_evaluation"]["final_holdout_comparison"]["same_trade_count"] is True
          holdout = report["final_holdout_metrics"]
          portfolio = report["portfolio_evaluation"]["final_holdout"]
          baseline = portfolio["fixed_size_baseline"]
          managed = portfolio["ttm_risk_managed"]
          comparison = report["portfolio_evaluation"]["final_holdout_comparison"]
          def metric(value, digits=4):
              return "N/A" if value is None else f"{float(value):.{digits}f}"
          def percent(value):
              return "N/A" if value is None else f"{float(value):.2%}"
          lines = [
              "# TTM-R2 Risk-Only Research",
              f"Commit: {report['code_commit_sha']}",
              f"Model: {report['model']['model_id']} @ {report['model']['resolved_immutable_revision']}",
              f"Weight SHA-256: {report['model']['weights_sha256']}",
              f"Dataset SHA-256: {report['dataset']['csv_sha256']}",
              "",
              "## Final holdout: volatility forecast",
              "| Metric | TTM-R2 | 24h persistence baseline |",
              "|---|---:|---:|",
              f"| QLIKE | {holdout['ttm_qlike']:.8f} | {holdout['persistence_qlike']:.8f} |",
              f"| Log-variance MAE | {holdout['ttm_log_variance_mae']:.8f} | {holdout['persistence_log_variance_mae']:.8f} |",
              f"| Forecast samples | {holdout['sample_count']} | {holdout['sample_count']} |",
              f"| QLIKE improvement | {holdout['qlike_improvement_fraction']:.2%} | 5.00% required |",
              f"| Forecast target floor applied | {holdout['target_floor_applied_fraction']:.2%} of hourly outputs | training-only 1st percentile |",
              f"| Holdout origins touching floor | {holdout['target_floor_applied_origin_fraction']:.2%} |",
              f"| Training-only log1p target floor | {report['risk_forecast_domain']['minimum_log1p_variance_target']:.10g} |",
              "",
              "## Final holdout: offline position-sizing replay",
              "| Metric | Fixed 10% size | TTM risk-sized |",
              "|---|---:|---:|",
              f"| Net PF | {metric(baseline['net_profit_factor'])} | {metric(managed['net_profit_factor'])} |",
              f"| Max drawdown | {percent(baseline['max_drawdown'])} | {percent(managed['max_drawdown'])} |",
              f"| Win rate | {percent(baseline['win_rate'])} | {percent(managed['win_rate'])} |",
              f"| Trade count | {baseline['trade_count']} | {managed['trade_count']} |",
              f"| Net return | {percent(baseline['net_return'])} | {percent(managed['net_return'])} |",
              "",
              f"Net PF improved: {comparison['net_profit_factor_improved']}",
              f"Max drawdown reduced: {comparison['max_drawdown_reduced']}",
              f"Max drawdown below 15%: {comparison['max_drawdown_below_15_percent']}",
              f"Both portfolio objectives met: {comparison['both_objectives_met']}",
              "",
              f"**Forecast verdict: {report['risk_forecast_acceptance']['status']}**",
              "",
              "The entry teacher is the same frozen OHLCV-only model for both portfolios. TTM only changes position size; it does not generate or filter entry signals. Both use 1h candles, a 24-bar forecast horizon, 50 bps round-trip costs and a 10% maximum equity position. This is an offline trade-exit equity replay, not runtime wiring.",
              "",
              "Safety: Champion=null; order_permission=false; trading_authorization=NO-GO; private_api_calls=0; real_order_attempts=0; paper_orders=0.",
          ]
          Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]).write_text("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
      - name: Upload immutable dataset manifest and TTM research artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-ttm-r2-risk-only
          path: |
            .artifacts/alix-prehack-data/*
            .artifacts/alix-ttm-r2-risk/*
          if-no-files-found: warn
          retention-days: 30
