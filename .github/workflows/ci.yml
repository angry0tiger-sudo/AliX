name: AliX Phase 0 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install test tooling only
        run: python -m pip install --disable-pip-version-check pytest==8.4.2 ruff==0.14.0
      - name: Compile source
        run: python -m compileall -q connectivity services user_data/strategies tests
      - name: Lint
        run: ruff check connectivity services user_data/strategies tests
      - name: Unit tests (mock-only)
        run: pytest -q
