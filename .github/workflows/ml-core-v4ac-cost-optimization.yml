name: AliX V4-AC Cost Optimization and Meta Comparison

on:
  push:
    branches:
      - research/ml-core-v4ac-cost-optimization
    paths:
      - .github/workflows/ml-core-v4ac-cost-optimization.yml
      - scripts/run_ml_core_v4ac_cost_optimization.py
      - tests/unit/test_ml_core_v4ac_cost_optimization.py
      - scripts/run_ml_core_real_data_baseline.py
      - services/meta_labeling/v4y.py
      - services/meta_labeling/v4x.py
      - services/ml_core/economic_backtest.py
      - services/ml_core/extended_features.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: alix-v4ac-cost-optimization
  cancel-in-progress: false

jobs:
  v4ac-cost-optimization:
    if: github.ref == 'refs/heads/research/ml-core-v4ac-cost-optimization'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require Standard CI success for this exact V4-AC commit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GH_TOKEN"]
          expected_branch = "research/ml-core-v4ac-cost-optimization"
          if target_branch != expected_branch:
              raise SystemExit("unsupported_v4ac_branch:" + target_branch)

          deadline = time.monotonic() + 90 * 60
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs"
              f"?head_sha={target_sha}&per_page=100"
          )
          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except (HTTPError, URLError, TimeoutError) as error:
                  raise SystemExit(f"ci_status_lookup_failed:{type(error).__name__}") from None

              matching = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == target_sha
                  and run.get("head_branch") == expected_branch
                  and run.get("event") == "push"
              ]
              if matching:
                  latest = max(
                      matching,
                      key=lambda item: (
                          item.get("run_number", 0), item.get("run_attempt", 0)
                      ),
                  )
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") != "success":
                          raise SystemExit(
                              "ci_green_gate_blocked:"
                              + str(latest.get("conclusion")) + ":" + target_sha
                          )
                      print(json.dumps({
                          "gate": "PASS", "target_sha": target_sha,
                          "ci_run_id": latest.get("id"),
                          "ci_run_url": latest.get("html_url"),
                      }, sort_keys=True))
                      break
              time.sleep(30)
          else:
              raise SystemExit("ci_green_gate_timeout:" + target_sha)
          PY

      - name: Checkout exact V4-AC commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm V4-AC scope and fail-closed safety
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/ml-core-v4ac-cost-optimization"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          printf 'commit_sha=%s\n' "$GITHUB_SHA"
          printf 'primary_model=CAUSAL_BOLLINGER_UPPER_BREAKOUT_EMA200_TREND\n'
          printf 'timeframes=15m,30m,1h,4h\nhorizon_bars=24\n'
          printf 'exit_policies=TB_1.5_1.0,TRAIL_2.0\n'
          printf 'modes=PRIMARY_ONLY,META_FILTERED\n'
          printf 'fee_bps_per_side=10\nslippage_bps_per_side=5\nround_trip_cost_bps=30\n'
          printf 'meta_model=OOF_LIGHTGBM_POLICY_MATCHED_LABELS\n'
          printf 'Champion=null\norder_permission=false\ntrading_authorization=NO-GO\n'
          printf 'private_api_calls=0\nreal_order_attempts=0\nsequence_model_used=false\n'
          python - <<'PY'
          import ast
          from pathlib import Path

          source = Path(
              "scripts/run_ml_core_v4ac_cost_optimization.py"
          ).read_text(encoding="utf-8")
          tree = ast.parse(source)
          contract_names = {
              "TIMEFRAMES",
              "HORIZON_BARS",
              "EXIT_POLICIES",
              "MODES",
              "FEE_BPS_PER_SIDE",
              "SLIPPAGE_BPS_PER_SIDE",
              "ROUND_TRIP_COST_BPS",
          }
          observed = {}
          for node in tree.body:
              if isinstance(node, ast.Assign):
                  for target in node.targets:
                      if isinstance(target, ast.Name) and target.id in contract_names:
                          observed[target.id] = ast.literal_eval(node.value)

          expected = {
              "TIMEFRAMES": ("15m", "30m", "1h", "4h"),
              "HORIZON_BARS": 24,
              "EXIT_POLICIES": ("TB_1.5_1.0", "TRAIL_2.0"),
              "MODES": ("PRIMARY_ONLY", "META_FILTERED"),
              "FEE_BPS_PER_SIDE": 10.0,
              "SLIPPAGE_BPS_PER_SIDE": 5.0,
              "ROUND_TRIP_COST_BPS": 30.0,
          }
          if observed != expected:
              raise SystemExit(
                  "v4ac_static_contract_mismatch:"
                  + repr({"observed": observed, "expected": expected})
              )
          print("V4-AC static execution contract: PASS")
          PY

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned V4-AC diagnostic and Meta dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3 scikit-learn==1.9.0 lightgbm==4.7.0

      - name: Fetch complete public Binance Spot 730-day 1-minute datasets
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/alix-v4ac-market-data"
          rm -rf "$data_dir"
          mkdir -p "$data_dir"
          for symbol in BTCUSDT ETHUSDT; do
            log_path="$RUNNER_TEMP/v4ac-fetch-730-$symbol.log"
            if python scripts/fetch_binance_public_ohlcv.py \
              --days 730 \
              --symbol "$symbol" \
              --interval 1m \
              --output-dir "$data_dir" \
              --commit-sha "$GITHUB_SHA" >"$log_path" 2>&1; then
              cat "$log_path"
            else
              cat "$log_path"
              echo "Public Spot fetch failed; refusing partial data." >&2
              exit 1
            fi
          done
          printf 'requested_days=730\nprovider=Binance Spot public klines API\n'
          printf 'private_api_calls=0\ncredentials_used=false\n'

      - name: Run V4-AC 32-row Primary-only and Meta-filtered economic matrix
        run: |
          set -euo pipefail
          python -m scripts.run_ml_core_v4ac_cost_optimization \
            --input-dir "$RUNNER_TEMP/alix-v4ac-market-data" \
            --output-report "$GITHUB_WORKSPACE/alix-v4ac-cost-optimization-report.json" \
            --output-trades-csv "$GITHUB_WORKSPACE/alix-v4ac-cost-optimization-trades.csv" \
            --output-decisions-csv "$GITHUB_WORKSPACE/alix-v4ac-cost-optimization-decisions.csv" \
            --days 730 \
            --commit-sha "$GITHUB_SHA"

      - name: Render the complete V4-AC comparison to GitHub Step Summary
        env:
          REPORT_PATH: ${{ github.workspace }}/alix-v4ac-cost-optimization-report.json
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from scripts.run_ml_core_v4ac_cost_optimization import render_step_summary

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          if report.get("schema_version") != "alix.ml-core.v4ac-cost-optimization.v1":
              raise SystemExit("v4ac_step_summary_report_schema_invalid")
          if len(report.get("cells", [])) != 32:
              raise SystemExit("v4ac_step_summary_cell_count_invalid")
          summary = render_step_summary(report)
          required = (
              "| Symbol | TF | Horizon Bars | Exit | Mode |",
              "Fee bps/side", "Slip bps/side", "Gross PF", "Net PF",
              "Trades", "PRIMARY_ONLY", "META_FILTERED",
              "Champion=null", "trading_authorization=NO-GO",
          )
          if any(value not in summary for value in required):
              raise SystemExit("v4ac_step_summary_required_metrics_missing")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as handle:
              handle.write(summary)
          Path(
              os.environ["GITHUB_WORKSPACE"],
              "alix-v4ac-cost-optimization-step-summary.md",
          ).write_text(summary, encoding="utf-8")
          print(summary, end="")
          PY

      - name: Validate V4-AC matrix, policy-matched Meta outcomes, accounting, and safety
        env:
          REPORT_PATH: ${{ github.workspace }}/alix-v4ac-cost-optimization-report.json
          TRADES_CSV: ${{ github.workspace }}/alix-v4ac-cost-optimization-trades.csv
          DECISIONS_CSV: ${{ github.workspace }}/alix-v4ac-cost-optimization-decisions.csv
          TARGET_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import csv
          import json
          import math
          import os
          from pathlib import Path

          report = json.loads(Path(os.environ["REPORT_PATH"]).read_text(encoding="utf-8"))
          assert report["schema_version"] == "alix.ml-core.v4ac-cost-optimization.v1"
          assert report["commit_sha"] == os.environ["TARGET_SHA"]
          assert report["requested_days"] == 730
          assert report["symbols"] == ["BTCUSDT", "ETHUSDT"]
          assert report["timeframes"] == ["15m", "30m", "1h", "4h"]
          assert report["horizon_bars"] == 24
          assert report["horizon_hours_by_timeframe"] == {
              "15m": 6.0, "30m": 12.0, "1h": 24.0, "4h": 96.0
          }
          assert report["exit_policies"] == ["TB_1.5_1.0", "TRAIL_2.0"]
          assert report["modes"] == ["PRIMARY_ONLY", "META_FILTERED"]
          assert report["primary_model"]["definition"] == "CAUSAL_BOLLINGER_UPPER_BREAKOUT_EMA200_TREND"
          assert report["primary_model"]["signal_changed_from_v4ab"] is False
          assert report["meta_model"]["enabled"] is True
          assert report["meta_model"]["separate_model_per_symbol_timeframe_exit_policy"] is True
          assert report["meta_model"]["calibration_labels_used"] is False
          assert report["meta_model"]["validation_labels_used_for_fit_or_threshold"] is False
          assert report["evaluation_window"]["last_15_percent_final_holdout_used"] is False
          costs = report["execution_cost_contract"]
          assert costs["fee_bps_per_side"] == 10.0
          assert costs["fee_type_assumption"] == "MAKER"
          assert costs["slippage_bps_per_side"] == 5.0
          assert costs["round_trip_cost_bps"] == 30.0
          assert costs["assumption_only_not_limit_fill_simulation"] is True

          expected = {
              f"{symbol}|{timeframe}|24|{policy}|{mode}"
              for symbol in ("BTCUSDT", "ETHUSDT")
              for timeframe in ("15m", "30m", "1h", "4h")
              for policy in ("TB_1.5_1.0", "TRAIL_2.0")
              for mode in ("PRIMARY_ONLY", "META_FILTERED")
          }
          assert len(report["cells"]) == 32
          assert {cell["candidate_id"] for cell in report["cells"]} == expected
          assert len(report["meta_model"]["scenarios"]) == 16
          for cell in report["cells"]:
              assert cell["timeframe"] in {"15m", "30m", "1h", "4h"}
              assert cell["horizon_bars"] == 24
              assert cell["round_trip_cost_bps"] == 30.0
              if cell["status"] != "COMPLETED":
                  assert cell["mode"] == "META_FILTERED"
                  assert cell["trade_count"] is None
                  assert cell["gross_profit_factor"] is None
                  assert cell["net_profit_factor"] is None
                  assert cell["net_pnl_total_usd"] is None
                  continue
              assert cell["trade_count"] >= 0
              assert math.isfinite(float(cell["win_rate"]))
              assert math.isfinite(float(cell["max_drawdown_percent"]))
              assert math.isfinite(float(cell["gross_pnl_total_usd"]))
              assert math.isfinite(float(cell["net_pnl_total_usd"]))

          for scenario in report["meta_model"]["scenarios"]:
              if scenario["status"] == "TRAINED":
                  diagnostics = scenario["diagnostics"]
                  assert diagnostics["labels_matured_before_outer_train_end"] is True
                  assert diagnostics["all_primary_events_are_buy"] is True
                  assert diagnostics["all_primary_events_are_oof"] is True
                  assert diagnostics["fit_labels_purged_before_calibration"] is True
                  assert diagnostics["validation_labels_used_for_fit"] is False
                  assert diagnostics["validation_labels_used_for_threshold"] is False

          with Path(os.environ["TRADES_CSV"]).open(newline="", encoding="utf-8") as handle:
              trades = list(csv.DictReader(handle))
          for trade in trades:
              assert trade["direction"] == "LONG"
              assert trade["timeframe"] in {"15m", "30m", "1h", "4h"}
              assert int(trade["horizon_bars"]) == 24
              gross = float(trade["gross_market_pnl_usd"])
              fees = float(trade["fees_usd"])
              slippage = float(trade["slippage_cost_usd"])
              net = float(trade["net_pnl_usd"])
              assert math.isclose(gross - fees - slippage, net, rel_tol=0.0, abs_tol=0.02)

          with Path(os.environ["DECISIONS_CSV"]).open(newline="", encoding="utf-8") as handle:
              decisions = list(csv.DictReader(handle))
          for decision in decisions:
              assert decision["split_role"] == "FORWARD_VALIDATION"
              assert decision["primary_signal"] == "BUY"
              assert decision["executable_signal"] in {"BUY", "NO_ENTRY"}
              assert decision["meta_filter_decision"] in {"ACCEPT", "REJECT"}

          safety = report["safety"]
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0
          assert safety["orders_or_execution_api_used"] is False
          assert safety["credentials_used"] is False
          assert safety["short_positions_supported"] is False
          assert safety["sequence_model_used"] is False
          assert report["promotion_status"] == "BLOCKED_PENDING_INDEPENDENT_OOS_AND_OWNER_REVIEW"
          print(json.dumps({
              "validation": "PASS", "commit_sha": report["commit_sha"],
              "candidate_rows": len(report["cells"]),
              "meta_scenarios": len(report["meta_model"]["scenarios"]),
              "trade_rows": len(trades), "decision_rows": len(decisions),
              "Champion": None, "order_permission": False,
              "trading_authorization": "NO-GO",
          }, sort_keys=True))
          PY

      - name: Upload V4-AC report, trades, decisions, and exact Step Summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-v4ac-cost-optimization
          path: |
            alix-v4ac-cost-optimization-report.json
            alix-v4ac-cost-optimization-trades.csv
            alix-v4ac-cost-optimization-decisions.csv
            alix-v4ac-cost-optimization-step-summary.md
          if-no-files-found: warn
