name: AliX V4-E Hierarchical Real-Data Baseline

on:
  push:
    branches:
      - research/ml-core-v4e-hierarchical-target
  workflow_dispatch:
    inputs:
      take_profit_multiplier:
        description: "12-candle take-profit ATR multiplier"
        type: number
        required: false
        default: 2.0
      stop_loss_multiplier:
        description: "12-candle stop-loss ATR multiplier"
        type: number
        required: false
        default: 1.0

  workflow_call:
    inputs:
      take_profit_multiplier:
        description: "12-candle take-profit ATR multiplier"
        type: number
        required: false
        default: 2.0
      stop_loss_multiplier:
        description: "12-candle stop-loss ATR multiplier"
        type: number
        required: false
        default: 1.0

permissions:
  actions: read
  contents: read

concurrency:
  group: alix-v4e-hierarchical-real-data-baseline
  cancel-in-progress: false

jobs:
  diagnostic-classification:
    if: github.ref == 'refs/heads/research/ml-core-v4e-hierarchical-target'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ALIx_ENV: paper
      ALIx_DRY_RUN: "true"
      ALIx_ALLOW_LIVE_TRADING: "false"
      ALIx_REPORTING_ENABLED: "false"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
      GH_TOKEN: ${{ github.token }}
      ALIX_TAKE_PROFIT_MULTIPLIER: ${{ inputs.take_profit_multiplier == '' && '2.0' || inputs.take_profit_multiplier }}
      ALIX_STOP_LOSS_MULTIPLIER: ${{ inputs.stop_loss_multiplier == '' && '1.0' || inputs.stop_loss_multiplier }}
    steps:
      - name: Require standard CI success for this exact V4-E research commit
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          target_sha = os.environ["TARGET_SHA"]
          target_branch = os.environ["TARGET_BRANCH"]
          token = os.environ["GH_TOKEN"]
          if target_branch != "research/ml-core-v4e-hierarchical-target":
              raise SystemExit("unsupported_v4e_training_branch:" + target_branch)
          deadline = time.monotonic() + 90 * 60
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/ci.yml/runs"
              f"?head_sha={target_sha}&per_page=100"
          )

          while time.monotonic() < deadline:
              request = Request(
                  url,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              try:
                  with urlopen(request, timeout=20) as response:
                      payload = json.load(response)
              except (HTTPError, URLError, TimeoutError) as error:
                  raise SystemExit(
                      f"ci_status_lookup_failed:{type(error).__name__}"
                  ) from None

              matching = [
                  run for run in payload.get("workflow_runs", [])
                  if run.get("head_sha") == target_sha
                  and run.get("head_branch") == target_branch
                  and run.get("event") == "push"
              ]
              if matching:
                  latest = max(
                      matching,
                      key=lambda item: (
                          item.get("run_number", 0),
                          item.get("run_attempt", 0),
                      ),
                  )
                  if latest.get("status") == "completed":
                      if latest.get("conclusion") != "success":
                          raise SystemExit(
                              "ci_green_gate_blocked:"
                              + str(latest.get("conclusion"))
                              + ":"
                              + target_sha
                          )
                      print(json.dumps({
                          "gate": "PASS",
                          "target_sha": target_sha,
                          "ci_run_id": latest.get("id"),
                          "ci_run_url": latest.get("html_url"),
                          "ci_conclusion": latest.get("conclusion"),
                      }, sort_keys=True))
                      break
              time.sleep(30)
          else:
              raise SystemExit("ci_green_gate_timeout:" + target_sha)
          PY

      - name: Checkout the exact V4-E research commit without persisted credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Confirm V4-E branch, target contract, and safety scope
        env:
          TARGET_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/research/ml-core-v4e-hierarchical-target"
          test "$GITHUB_SHA" = "$TARGET_SHA"
          test -n "$GITHUB_SHA"
          printf 'commit_sha=%s\\n' "$GITHUB_SHA"
          printf 'scope=DIAGNOSTIC_CLASSIFICATION_ONLY\\n'
          printf 'target_architecture=HIERARCHICAL_HIT_THEN_DIRECTION\\n'
          printf 'target_horizon_candles=12\\n'
          printf 'model_training_performed=false_until_this_manual_workflow_runs\\n'
          printf 'private_api_calls=0\\nreal_order_attempts=0\\n'
          printf 'trading_authorization=NO-GO\\n'

      - name: Set up pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned diagnostic tree-model dependencies
        run: |
          python -m pip install pip==25.2
          python -m pip install numpy==2.5.4 pandas==2.3.3 scikit-learn==1.9.0 lightgbm==4.7.0

      - name: Fetch complete Binance public 1-minute candles
        run: |
          set -euo pipefail
          data_dir="$RUNNER_TEMP/alix-v4e-market-data"
          rm -rf "$data_dir"
          mkdir -p "$data_dir"
          for symbol in BTCUSDT ETHUSDT; do
            log_path="$RUNNER_TEMP/v4e-fetch-730-${symbol}.log"
            if python scripts/fetch_binance_public_ohlcv.py \\
              --days 730 \\
              --symbol "$symbol" \\
              --interval 1m \\
              --output-dir "$data_dir" \\
              --commit-sha "$GITHUB_SHA" >"$log_path" 2>&1; then
              cat "$log_path"
            else
              cat "$log_path"
              echo "Binance fetch failed for ${symbol}; refusing partial data." >&2
              exit 1
            fi
          done
          echo "ALIX_DIAGNOSTIC_DAYS=730" >> "$GITHUB_ENV"
          echo "ALIX_DIAGNOSTIC_CONFIGURED_DAYS=730" >> "$GITHUB_ENV"
          echo "ALIX_DIAGNOSTIC_FALLBACK_REASON=NONE" >> "$GITHUB_ENV"

      - name: Train V4-E hierarchical 12-candle diagnostics
        run: |
          python -m scripts.run_ml_core_real_data_baseline \\
            --input-dir "$RUNNER_TEMP/alix-v4e-market-data" \\
            --output "$GITHUB_WORKSPACE/alix-v4e-hierarchical-classification-report.json" \\
            --days "$ALIX_DIAGNOSTIC_DAYS" \\
            --commit-sha "$GITHUB_SHA" \\
            --scenario "Hierarchical_12_Candle:12:$ALIX_TAKE_PROFIT_MULTIPLIER:$ALIX_STOP_LOSS_MULTIPLIER" \\
            --calibration-fraction 0.20 \\
            --minimum-hold-precision 0.40 \\
            --minimum-hold-recall 0.20
          echo "ALIX_TRAIN_STEP_SUMMARY=$GITHUB_STEP_SUMMARY" >> "$GITHUB_ENV"

      - name: Validate V4-E hierarchical report and safety invariants
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          report = json.loads(
              Path("alix-v4e-hierarchical-classification-report.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["schema_version"] == "alix.ml-core.real-data-classification-diagnostic.v6"
          assert report["commit_sha"] == os.environ["GITHUB_SHA"]
          assert report["diagnostic_scope"] == "CLASSIFICATION_ONLY"
          assert report["economic_evaluation_performed"] is False
          assert report["economic_metrics_reported"] is False
          assert report["experiment_count"] == 8
          assert report["triple_barrier_scenarios"] == [{
              "name": "Hierarchical_12_Candle",
              "horizon_candles": 12,
              "take_profit_multiplier": float(os.environ["ALIX_TAKE_PROFIT_MULTIPLIER"]),
              "stop_loss_multiplier": float(os.environ["ALIX_STOP_LOSS_MULTIPLIER"]),
          }]
          policy = report["hierarchical_target_policy"]
          assert policy["horizon_candles"] == 12
          assert policy["stage1_target_column"] == "stage1_hit_target"
          assert policy["stage1_semantics"]["1"] == "TP_OR_SL_FIRST_TOUCHED_WITHIN_CANDLES_1_TO_12"
          assert policy["stage1_semantics"]["0"] == "NO_HIT_BY_CANDLE_12_INCLUDING_ANY_LATER_HIT_AT_13_TO_24"
          assert policy["stage2_target_column"] == "stage2_direction_target"
          assert policy["stage2_condition"] == "STAGE1_TARGET_EQUALS_1"
          assert policy["stage2_mapping"] == {"1": "BUY_TP_HIT", "0": "SELL_SL_HIT_OR_COLLISION"}
          assert policy["stage2_no_hit_value"] is None
          assert policy["inference_probabilities"] == {
              "P_BUY": "P_HIT * P_BUY_GIVEN_HIT",
              "P_SELL": "P_HIT * P_SELL_GIVEN_HIT",
              "P_HOLD": "1 - P_HIT",
          }
          gate_policy = report["sample_gate_policy"]
          assert gate_policy["stage1_required_classes"] == ["NO_HIT", "HIT"]
          assert gate_policy["stage2_required_classes"] == ["SELL", "BUY"]
          assert gate_policy["minimum_train_samples_per_class"] == 20
          assert gate_policy["minimum_validation_samples_per_class"] == 30
          assert gate_policy["gate_behavior"] == "BOTH_STAGES_MUST_PASS_BEFORE_ANY_MODEL_FIT"
          assert report["model"]["architecture"] == "HIERARCHICAL_HIT_THEN_DIRECTION"
          assert report["model"]["stage1_objective"] == "binary"
          assert report["model"]["stage2_objective"] == "binary"
          assert report["model"]["models_per_weighting_policy"] == 3
          assert report["trained_models"] == sum(
              3 * len(item["model_variants"] or {})
              for item in report["experiments"]
          )
          allowed_statuses = {
              "TRAINED",
              "SKIPPED_INSUFFICIENT_SAMPLES",
              "SKIPPED_INSUFFICIENT_CLASS_DIVERSITY",
          }
          assert all(item["status"] in allowed_statuses for item in report["experiments"])
          for item in report["experiments"]:
              assert item["triple_barrier"]["horizon_candles"] == 12
              assert item["sample_gate"]["gate_behavior"] == "BOTH_STAGES_MUST_PASS_BEFORE_ANY_MODEL_FIT"
              if item["status"] == "TRAINED":
                  assert item["sample_gate"]["status"] == "PASS"
                  assert set(item["model_variants"]) == {"weight_none", "weight_balanced"}
                  assert item["hierarchical_metrics"] is not None
                  assert set(item["hierarchical_metrics"]) == {
                      "stage1_hit_classifier",
                      "stage2_direction_classifier",
                      "combined_three_class",
                  }
                  assert item["hierarchical_metrics"]["stage2_direction_classifier"]["evaluation_scope"] == "ACTUAL_STAGE1_HIT_ROWS_ONLY"
                  assert item["hierarchical_metrics"]["combined_three_class"]["evaluation_scope"] == "ALL_ROWS_USING_PREDICTED_STAGE1_PROBABILITY"
                  assert item["stage2_training_rows"] < item["train_rows"]
                  assert item["stage2_validation_rows"] < item["validation_rows"]
                  assert item["hierarchical_metrics"]["stage1_hit_classifier"]["probability_diagnostics"]["forward_validation"]["brier_score"] is not None
                  assert item["hierarchical_metrics"]["stage1_hit_classifier"]["probability_diagnostics"]["forward_validation"]["ece"] is not None
                  assert item["hierarchical_metrics"]["stage2_direction_classifier"]["probability_diagnostics"]["forward_validation"]["brier_score"] is not None
                  assert item["hierarchical_metrics"]["stage2_direction_classifier"]["probability_diagnostics"]["forward_validation"]["ece"] is not None
                  for variant in item["model_variants"].values():
                      assert variant["three_class_baseline"]["model_parameters"]["objective"] == "multiclass"
                      assert variant["three_class_baseline"]["model_parameters"]["target_horizon_candles"] == 12
                      assert variant["three_class_baseline"]["classification_metrics"]["validation"] is not None
                      assert variant["three_class_baseline"]["confusion_matrix"]["matrix"]
                      assert variant["three_class_baseline"]["prediction_distribution"]["total"] == item["validation_rows"]
                  for variant in item["model_variants"].values():
                      assert variant["model_parameters"]["stage1"]["objective"] == "binary"
                      assert variant["model_parameters"]["stage2"]["objective"] == "binary"
                      assert variant["classification_metrics"]["validation"] is not None
                      assert len(variant["validation_probabilities"]) == item["validation_rows"]
                      for row in variant["validation_probabilities"]:
                          probs = row["probabilities"]
                          assert set(probs) == {"BUY", "SELL", "HOLD"}
                          assert abs(sum(probs.values()) - 1.0) < 1e-5
                          assert all(0.0 <= value <= 1.0 for value in probs.values())
              else:
                  assert item["model_variants"] is None
                  assert item["hierarchical_metrics"] is None
                  assert item["sample_gate"]["status"] == item["status"]
          safety = report["safety"]
          assert safety["Champion"] is None
          assert safety["order_permission"] is False
          assert safety["private_api_calls"] == 0
          assert safety["real_order_attempts"] == 0
          assert safety["trading_authorization"] == "NO-GO"
          assert safety["orders_or_execution_api_used"] is False
          print(json.dumps({
              "schema_version": report["schema_version"],
              "experiments": report["experiment_count"],
              "trained_models": report["trained_models"],
              "model_training_performed": True,
              "Champion": None,
              "trading_authorization": "NO-GO",
              "private_api_calls": 0,
              "real_order_attempts": 0,
          }, sort_keys=True))
          PY

      - name: Verify GitHub Step Summary contains V4-E metrics
        run: |
          set -euo pipefail
          test -n "$ALIX_TRAIN_STEP_SUMMARY"
          test -s "$ALIX_TRAIN_STEP_SUMMARY"
          grep -q "V4-E hierarchical metrics" "$ALIX_TRAIN_STEP_SUMMARY"
          grep -q "Stage 1 and Stage 2 probability quality" "$ALIX_TRAIN_STEP_SUMMARY"
          grep -q "Controlled comparison: hierarchical vs same-target three-class LightGBM" "$ALIX_TRAIN_STEP_SUMMARY"
          grep -q "Validation confusion matrices" "$ALIX_TRAIN_STEP_SUMMARY"
          grep -q "Validation prediction distribution" "$ALIX_TRAIN_STEP_SUMMARY"

      - name: Upload V4-E hierarchical diagnostic report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alix-v4e-hierarchical-classification-diagnostic
          path: alix-v4e-hierarchical-classification-report.json
          if-no-files-found: warn
          retention-days: 14
